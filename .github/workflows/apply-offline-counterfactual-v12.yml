name: Apply Offline Counterfactual V12

on:
  push:
    branches:
      - upgrade/offline-counterfactual-v12

permissions:
  contents: write

concurrency:
  group: offline-counterfactual-v12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-verify-commit:
    if: ${{ !contains(github.event.head_commit.message, '[v12-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/offline-counterfactual-v12
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply surgical core patch
        shell: bash
        run: |
          sed -i 's/08901234567895/08901234567890/g; s/08901234567901/08901234567906/g' tool/apply_offline_counterfactual_v12.py
          python3 tool/apply_offline_counterfactual_v12.py
          dart format lib/domain/medicine_resolution_v2.dart test/offline_counterfactual_v12_test.dart

      - name: Resolve pinned dependencies
        run: flutter pub get

      - name: Analyze changed architecture
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib

      - name: Run V12 and resolver regression suites
        run: |
          flutter test --reporter expanded test/offline_counterfactual_v12_test.dart
          flutter test --reporter expanded test/medicine_resolution_v2_test.dart
          flutter test --reporter expanded test/offline_level6_reasoning_test.dart
          flutter test --reporter expanded test/offline_semantic_brain_v11_test.dart
          flutter test --reporter expanded test/offline_decision_engine_test.dart

      - name: Run full Flutter regression suite
        run: flutter test --reporter expanded

      - name: Compile Android integration
        run: flutter build apk --debug --no-pub

      - name: Remove temporary surgeon files
        run: |
          rm tool/apply_offline_counterfactual_v12.py
          rm .github/workflows/apply-offline-counterfactual-v12.yml

      - name: Commit verified V12 core upgrade
        shell: bash
        run: |
          git config user.name "Aaris Offline Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/domain/medicine_resolution_v2.dart test/offline_counterfactual_v12_test.dart docs/OFFLINE_DECISION_ENGINE_MAP.md tool/apply_offline_counterfactual_v12.py .github/workflows/apply-offline-counterfactual-v12.yml
          git diff --cached --check
          git commit -m "Upgrade offline counterfactual medicine reasoning V12 [skip ci] [v12-applied]"
          git push origin HEAD:upgrade/offline-counterfactual-v12
