name: Aaris operational autopilot upgrade
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aaris-operational-autopilot-upgrade.yml
permissions:
  contents: write
concurrency:
  group: aaris-operational-autopilot-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.event.head_commit.message == 'Run Aaris operational autopilot upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic operational autopilot patch
        run: python3 tool/one_shot_operational_autopilot_upgrade.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Format and verify source
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/domain/app_brain.dart lib/ui/brain_screen.dart test/app_brain_test.dart test/brain_screen_test.dart
          flutter pub get
          dart analyze lib test tool third_party/lib_llama_cpp/lib
          flutter test test/app_brain_test.dart test/brain_screen_test.dart test/attention_test.dart test/operations_plan_test.dart --reporter expanded
          flutter test --reporter expanded
          flutter build apk --debug --no-pub

      - name: Commit verified source upgrade and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock 2>/dev/null || true
          rm -f tool/one_shot_operational_autopilot_upgrade.py
          rm -f .github/workflows/aaris-operational-autopilot-upgrade.yml
          git config user.name 'Aaris Pharmacy Upgrade Bot'
          git config user.email 'warishakhan3548@gmail.com'
          git add -A \
            lib/domain/app_brain.dart \
            lib/ui/brain_screen.dart \
            test/app_brain_test.dart \
            test/brain_screen_test.dart \
            docs/ARCHITECTURE.md \
            docs/AARIS_OPERATIONAL_AUTOPILOT_2026_09_10.md \
            tool/one_shot_operational_autopilot_upgrade.py \
            .github/workflows/aaris-operational-autopilot-upgrade.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No verified source upgrade diff produced'; exit 1; }
          git commit -m 'Upgrade Aaris Brain deterministic operational autopilot [skip ci]'
          git push origin HEAD:main
