name: Aaris context and lifecycle hardening
on:
  push:
    branches: [aaris-context-lifecycle-hardening-20260910]
permissions:
  contents: write
concurrency:
  group: aaris-context-lifecycle-hardening
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply surgical Aaris upgrades
        run: python3 tool/aaris_context_lifecycle_patch.py
      - name: Format upgraded Dart sources
        run: dart format lib/domain/app_brain.dart lib/domain/brain_operations.dart lib/state/pharmacy_controller.dart lib/ui/brain_screen.dart test/app_brain_test.dart test/autonomous_stock_operations_test.dart test/brain_screen_test.dart
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Targeted Brain and lifecycle tests
        run: flutter test test/app_brain_test.dart test/autonomous_stock_operations_test.dart test/brain_screen_test.dart test/operational_context_test.dart test/removal_recovery_test.dart test/sale_ledger_firewall_test.dart --reporter expanded
      - name: Full regression suite
        run: flutter test --reporter expanded
      - name: Compile Android integration
        run: flutter build apk --debug --no-pub
      - name: Commit verified upgrade and self-clean runner
        shell: bash
        run: |
          git config user.name 'Aaris Pharmacy Upgrade Bot'
          git config user.email 'warishakhan3548@gmail.com'
          git rm .github/workflows/aaris-context-lifecycle-hardening.yml tool/aaris_context_lifecycle_patch.py
          git add lib test docs
          git diff --cached --check
          git commit -m 'Harden Aaris exact context and lifecycle reviews [skip ci]'
          git push origin HEAD:aaris-context-lifecycle-hardening-20260910
