          replace_once(
              'lib/ui/brain_screen.dart',
              """    final expectedRevision = widget.controller.snapshot.revision;\n    final confirmed =\n        await showDialog<bool>(\n""",
              """    final review = widget.controller.reviewMarkSold(live.id);\n    final reviewed = review.record;\n    final confirmed =\n        await showDialog<bool>(\n""",
          )
          replace_once(
