name: Aaris Brain control-plane upgrade
on:
  push:
    branches:
      - upgrade/aaris-brain-control-plane-20260910
    paths:
      - .github/workflows/aaris-brain-control-plane-upgrade.yml
permissions:
  contents: write
concurrency:
  group: aaris-brain-control-plane-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply surgical source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/one_shot_brain_control_plane_upgrade.py
          python3 - <<'PY'
          from pathlib import Path
          brain = Path('lib/ui/brain_screen.dart')
          text = brain.read_text().replace("import '../domain/warning_policy.dart';\n", '')
          brain.write_text(text)

          policy = Path('lib/domain/warning_policy.dart')
          text = policy.read_text()
          anchor = """  if (dayValues.length > 1) {
"""
          insertion = """  final numericTokens = RegExp(
    r'(?:^|[^0-9])([0-9]{1,3})(?=$|[^0-9])',
  ).allMatches(ascii).length;
  if (numericTokens != dayValues.length + monthValues.length) {
    throw const FormatException(
      'Every expiry-warning number must have an explicit day or month unit.',
    );
  }

  if (dayValues.length > 1) {
"""
          if text.count(anchor) != 1:
              raise SystemExit('warning policy ambiguity anchor missing')
          policy.write_text(text.replace(anchor, insertion, 1))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format upgraded source
        run: dart format lib/domain/warning_policy.dart lib/domain/app_brain.dart lib/state/pharmacy_controller.dart lib/ui/brain_screen.dart test/brain_control_plane_upgrade_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Control-plane tests
        run: flutter test test/brain_control_plane_upgrade_test.dart --reporter expanded
      - name: Brain parser regressions
        run: flutter test test/app_brain_test.dart test/aaris_brain_command_safety_test.dart --reporter expanded
      - name: Context and autopilot regressions
        run: flutter test test/operational_context_test.dart test/autopilot_supervisor_test.dart --reporter expanded
      - name: Full regression suite
        run: flutter test --reporter expanded
      - name: Android compile gate
        run: flutter build apk --debug --no-pub
      - name: Commit verified source upgrade
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock 2>/dev/null || true
          git config user.name 'Aaris Pharmacy Upgrade Bot'
          git config user.email 'warishakhan3548@gmail.com'
          git add lib/domain/warning_policy.dart lib/domain/app_brain.dart lib/state/pharmacy_controller.dart lib/ui/brain_screen.dart test/brain_control_plane_upgrade_test.dart docs/AARIS_BRAIN_CONTROL_PLANE_2026_09_10.md docs/PROGRESS.md docs/ARCHITECTURE.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source upgrade diff produced'; exit 1; }
          git commit -m 'Upgrade Aaris Brain app control plane'
          git push origin HEAD:upgrade/aaris-brain-control-plane-20260910
