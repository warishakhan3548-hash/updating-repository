name: Clean realtime 1.9.6 formatting

on:
  push:
    branches:
      - upgrade/realtime-196

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/realtime-196
          fetch-depth: 0
      - name: Apply fail-closed formatting cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/aaris/remoteassist/webrtc/ControllerWebRtcSession.kt")
          lines = path.read_text().splitlines()
          expected = [
              "peer.sendControl(",
              "bytes = ControlProtocol.encode(",
              "ControlPacket.VideoFeedback(",
              "lease,",
              "display.generation,",
              "feedbackSequence.incrementAndGet(),",
              "recent.intervalMs,",
              "recent.frames,",
              "recent.processingMs?.toFloat() ?: -1f,",
              "recent.jitterMs?.toFloat() ?: -1f,",
              "recent.dropped ?: -1,",
              "recent.freezes ?: -1",
              ")",
              "),",
              "// Decoder health is periodic freshness telemetry. Once the live lane",
              "// exists, dropping an old sample beats head-of-line blocking input.",
              "freshnessSensitive = true",
              ")",
          ]
          candidates = []
          for index, line in enumerate(lines):
              if line.strip() == "peer.sendControl(" and index + len(expected) <= len(lines):
                  window = [item.strip() for item in lines[index:index + len(expected)]]
                  if window == expected:
                      candidates.append(index)
          if len(candidates) != 1:
              raise SystemExit(f"expected exactly one VideoFeedback formatting target, found {len(candidates)}")
          start = candidates[0]
          desired = [
              "            peer.sendControl(",
              "                bytes = ControlProtocol.encode(",
              "                    ControlPacket.VideoFeedback(",
              "                        lease,",
              "                        display.generation,",
              "                        feedbackSequence.incrementAndGet(),",
              "                        recent.intervalMs,",
              "                        recent.frames,",
              "                        recent.processingMs?.toFloat() ?: -1f,",
              "                        recent.jitterMs?.toFloat() ?: -1f,",
              "                        recent.dropped ?: -1,",
              "                        recent.freezes ?: -1",
              "                    )",
              "                ),",
              "                // Decoder health is periodic freshness telemetry. Once the live lane",
              "                // exists, dropping an old sample beats head-of-line blocking input.",
              "                freshnessSensitive = true",
              "            )",
          ]
          lines[start:start + len(expected)] = desired
          path.write_text("\n".join(lines) + "\n")
          Path(".github/workflows/cleanup-realtime-196.yml").unlink()
          PY
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: clean realtime telemetry formatting"
          git push origin HEAD:upgrade/realtime-196
