name: Aaris offline decision engine V6 upgrade
on:
  push:
    branches:
      - upgrade/offline-decision-engine-v6
    paths:
      - .github/workflows/aaris-offline-decision-v6.yml

permissions:
  contents: write

concurrency:
  group: aaris-offline-decision-v6
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Run Aaris offline decision engine V6 upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical source patch
        run: python3 tool/one_shot_offline_decision_v6_adaptive_gate.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Format and analyze changed engine
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/domain/medicine_resolution_v2.dart test/medicine_resolution_v2_test.dart
          flutter pub get
          dart analyze lib/domain/medicine_resolution_v2.dart test/medicine_resolution_v2_test.dart

      - name: Run focused offline-brain regressions
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/medicine_resolution_v2_test.dart --reporter expanded
          flutter test test/offline_decision_engine_test.dart test/offline_search_evidence_v5_test.dart --reporter expanded

      - name: Run full regression suite
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Commit verified V6 source upgrade to branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock 2>/dev/null || true
          git config user.name 'Aaris Pharmacy Upgrade Bot'
          git config user.email 'warishakhan3548@gmail.com'
          git rm .github/workflows/aaris-offline-decision-v6.yml tool/one_shot_offline_decision_v6.py tool/one_shot_offline_decision_v6_frame_fix.py tool/one_shot_offline_decision_v6_adaptive_gate.py
          git add lib/domain/medicine_resolution_v2.dart test/medicine_resolution_v2_test.dart docs/OFFLINE_DECISION_ENGINE_MAP.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source upgrade diff produced'; exit 1; }
          git commit -m 'Calibrate offline decision authority to evidence reliability V6 [skip ci]'
          git push origin HEAD:upgrade/offline-decision-engine-v6
