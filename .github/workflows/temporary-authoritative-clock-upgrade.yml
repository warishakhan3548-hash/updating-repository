name: Temporary authoritative business clock upgrade
on:
  push:
    branches: [upgrade/authoritative-business-clock-20260910]
permissions:
  contents: write
concurrency:
  group: authoritative-clock-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[business-clock-upgrade]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/authoritative-business-clock-20260910
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply guarded surgery
        run: python3 tool/temporary_authoritative_clock_upgrade.py
      - name: Format changed Dart
        run: dart format lib/data/inventory_database.dart lib/state/pharmacy_controller.dart test/authoritative_business_clock_test.dart
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Full regression suite
        run: flutter test --reporter expanded
      - name: Diff integrity
        run: |
          git checkout -- pubspec.lock 2>/dev/null || true
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'lib/data/inventory_database.dart',
              'lib/state/pharmacy_controller.dart',
              'test/authoritative_business_clock_test.dart',
          }
          rows = subprocess.check_output(
              ['git', 'status', '--porcelain'], text=True
          ).splitlines()
          changed = {row[3:] for row in rows}
          if changed != expected:
              raise SystemExit(
                  f'Unexpected working-tree paths: {sorted(changed)}; expected: {sorted(expected)}'
              )
          PY
      - name: Remove temporary surgeon and commit verified result
        run: |
          rm tool/temporary_authoritative_clock_upgrade.py
          rm .github/workflows/temporary-authoritative-clock-upgrade.yml
          git config user.name "Aaris Pharmacy Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Unify Aaris inventory business clock [business-clock-upgrade]"
          git push origin HEAD:upgrade/authoritative-business-clock-20260910
