name: Aaris Offline V10 Date Intelligence Upgrade
on:
  push:
    branches: [upgrade/offline-engine-v10-date-intelligence]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/offline-engine-v10-date-intelligence
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply V10 integration surgery
        run: python3 .github/scripts/apply_v10_date_intelligence.py
      - name: Remove temporary upgrade tooling
        run: rm -f .github/scripts/apply_v10_date_intelligence.py .github/workflows/aaris-offline-v10-date-upgrade.yml
      - name: Format intended files only
        run: dart format lib/domain/medicine_date_intelligence.dart lib/domain/spatial_traceability.dart lib/domain/medicine_resolution_v2.dart test/offline_date_intelligence_v10_test.dart
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: Static checks
        run: flutter analyze --no-fatal-infos
      - name: Focused V10 regressions
        run: >-
          flutter test
          test/offline_date_intelligence_v10_test.dart
          test/offline_level6_reasoning_test.dart
          test/offline_decision_engine_test.dart
          test/medicine_resolution_v2_test.dart
          test/retrieval_fusion_test.dart
      - name: Full regression suite
        run: flutter test
      - name: Android debug integration build
        run: flutter build apk --debug
      - name: Commit verified V10 patch
        run: |
          git config user.name 'Aaris Upgrade Bot'
          git config user.email 'actions@users.noreply.github.com'
          git status --short
          git add -A
          git commit -m 'Upgrade offline medicine date intelligence to V10'
          git push origin HEAD:upgrade/offline-engine-v10-date-intelligence
