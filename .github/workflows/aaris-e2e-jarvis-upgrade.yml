              '  Future<void> _removedStock(AppBrainIntent intent) async {',
              dedent('''\
                MedicineDraftSeed? _draftSeedFromCommand(String raw) {
                  final clean = raw.replaceAll(RegExp(r'\\s+'), ' ').trim();
                  if (clean.isEmpty) return null;
                  final strengthMatch = RegExp(
                    r'\\b[0-9]+(?:\\.[0-9]+)?\\s*(?:mcg|mg|g|ml|iu|units?|%)',
                    caseSensitive: false,
                  ).firstMatch(clean);
                  var name = clean;
                  var strength = '';
                  if (strengthMatch != null) {
                    strength = strengthMatch.group(0)!.replaceAll(RegExp(r'\\s+'), '');
                    name = clean
                        .replaceRange(strengthMatch.start, strengthMatch.end, ' ')
                        .replaceAll(RegExp(r'\\s+'), ' ')
                        .trim();
                  }
                  if (name.isEmpty) name = clean;
                  return MedicineDraftSeed(
                    name: name,
                    strength: strength,
                    source: 'Aaris Brain command',
                  );
                }

                Future<void> _removedStock(AppBrainIntent intent) async {
              '''),
          )

          replace_regex_once(
              'lib/ui/brain_screen.dart',
              r'''    final expired = isExpiredOn\(live, widget\.controller\.today\);\n    final reasons = <String>\[.*?    if \(reason == null \|\| !mounted\) \{\n      setState\(\(\) => _reply = 'Remove cancelled\. Nothing changed\.'\);\n      return;\n    \}\n\n    if \(reason\.startsWith\('Sold'\)\) \{\n      await _markSoldTarget\(live\);\n      return;\n    \}\n''',
              dedent('''\
                  // An explicit Brain delete already expresses the owner's desired
                  // lifecycle action. Bind one preview to the exact stock row and
                  // require one final confirmation; do not force a second reason
                  // picker that can be mistaken for another target-selection step.
                  final reason = reasonHint?.archiveReason ?? 'Manual removal';
              '''),
