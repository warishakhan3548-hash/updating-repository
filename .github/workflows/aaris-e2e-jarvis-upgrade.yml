                    }
                    return ((candidates.first as Map)['content']['parts'] as List)
                        .map((p) => (p as Map)['text'] ?? '')
                        .join('\\n');
                  }
                  final choices = decoded['choices'] as List?;
                  if (choices == null || choices.isEmpty) {
                    throw StateError(
                      'The endpoint did not return a compatible chat response.',
                    );
                  }
                  final content = (choices.first as Map)['message']['content'];
                  if (content is! String) {
                    throw StateError('The provider did not return a text response.');
                  }
                  return content;
              '''),
          )

          replace_once(
              'lib/services/ai_service.dart',
              '\n}\n\nFuture<void> sharePharmacy(PharmacyExport data) async {',
              dedent('''\

                Future<Map<String, dynamic>> _postJsonWithRetry(
                  Uri endpoint,
                  Map<String, String> headers,
                  Object body,
                  int generation,
                ) async {
                  if (_cloudBusy) {
                    throw StateError('An AI request is already running.');
                  }
                  _cloudBusy = true;
                  Object? lastRetryableError;
                  try {
                    for (var attempt = 0; attempt < 3; attempt++) {
                      if (generation != _requestGeneration) {
                        throw StateError('AI request cancelled.');
                      }
                      final client = http.Client();
                      _client = client;
                      try {
                        final request = http.Request('POST', endpoint)
                          ..followRedirects = false
                          ..headers.addAll(headers)
                          ..body = jsonEncode(body);
                        final response = await client
                            .send(request)
                            .timeout(const Duration(seconds: 60));
                        if (_transientAiStatus(response.statusCode)) {
                          throw _RetryableAiFailure(
                            'AI provider temporarily returned HTTP ${response.statusCode}.',
                          );
                        }
                        if (response.statusCode < 200 || response.statusCode >= 300) {
                          throw StateError(
                            'AI provider returned HTTP ${response.statusCode}. Check the model, key, quota and endpoint.',
                          );
                        }
                        final bytes = <int>[];
                        await for (final chunk in response.stream.timeout(
                          const Duration(seconds: 75),
                        )) {
                          if (generation != _requestGeneration) {
                            throw StateError('AI request cancelled.');
                          }
                          bytes.addAll(chunk);
                          if (bytes.length > 1500000) {
                            throw StateError(
                              'AI response is too large. Ask for fewer changes.',
                            );
                          }
                        }
                        final value = jsonDecode(utf8.decode(bytes));
                        if (value is! Map) {
                          throw const FormatException(
                            'AI provider returned an invalid response envelope.',
                          );
                        }
                        return Map<String, dynamic>.from(value);
                      } catch (error) {
                        if (generation != _requestGeneration) {
                          throw StateError('AI request cancelled.');
                        }
                        final retryable = error is TimeoutException ||
                            error is http.ClientException ||
                            error is _RetryableAiFailure;
                        if (!retryable) rethrow;
                        lastRetryableError = error;
                        if (attempt == 2) break;
                      } finally {
                        client.close();
                        if (identical(_client, client)) _client = null;
                      }
                      await Future<void>.delayed(
                        Duration(milliseconds: 400 * (1 << attempt)),
                      );
                    }
                  } finally {
                    _cloudBusy = false;
                    _client = null;
                  }
                  final detail = lastRetryableError?.toString() ?? 'unknown transport error';
                  throw StateError(
                    'AI connection stayed unavailable after safe retries. $detail',
                  );
                }

                bool _transientAiStatus(int status) =>
                    status == 408 ||
                    status == 425 ||
                    status == 429 ||
                    status == 500 ||
                    status == 502 ||
                    status == 503 ||
                    status == 504;
              }

              class _RetryableAiFailure implements Exception {
                const _RetryableAiFailure(this.message);
                final String message;

                @override
                String toString() => message;
              }

              Future<void> sharePharmacy(PharmacyExport data) async {
              '''),
          )

