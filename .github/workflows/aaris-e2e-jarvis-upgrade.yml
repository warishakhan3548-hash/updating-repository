              "child: const Text('Confirm'),",
          )

          # ------------------------------------------------------------------
          # 3) AI Hub turn state machine. Deterministic App Brain ALWAYS gets
          #    first refusal; unknown prompts alone reach local/cloud AI.
          # ------------------------------------------------------------------
          replace_once(
              'lib/ui/ai_screen.dart',
              'enum AiHubQuickAction { sold, removed, stockSummary, add, delete, modify }',
              dedent('''\
              enum AiHubQuickAction { sold, removed, stockSummary, add, delete, modify }

              enum _AiTurnPhase { idle, routing, thinking, reviewing, streaming }
              '''),
          )
          replace_once(
              'lib/ui/ai_screen.dart',
              '  int _generation = 0;\n',
              '  int _generation = 0;\n  _AiTurnPhase _turnPhase = _AiTurnPhase.idle;\n',
          )
          replace_once(
              'lib/ui/ai_screen.dart',
              dedent('''\
                void _appendMessage(String text, bool user) {
                  final clean = text.trim();
                  if (!mounted || clean.isEmpty) return;
                  setState(() => _messages.add(_AiChatMessage(clean, user)));
                  _scrollToEnd();
                }
              '''),
              dedent('''\
                void _appendMessage(String text, bool user) {
                  final clean = text.trim();
                  if (!mounted || clean.isEmpty) return;
                  setState(() => _messages.add(_AiChatMessage(clean, user)));
                  _scrollToEnd();
                }

                Future<void> _streamAssistantMessage(String text, int generation) async {
                  final clean = text.trim();
                  if (!mounted || clean.isEmpty || generation != _generation) return;
                  var end = clean.length < 18 ? clean.length : 18;
                  final index = _messages.length;
                  setState(
                    () => _messages.add(
                      _AiChatMessage(clean.substring(0, end), false),
                    ),
                  );
                  _scrollToEnd();
                  while (end < clean.length) {
                    await Future<void>.delayed(const Duration(milliseconds: 18));
                    if (!mounted || generation != _generation) return;
                    final next = end + 18;
                    end = next < clean.length ? next : clean.length;
                    setState(
                      () => _messages[index] = _AiChatMessage(
                        clean.substring(0, end),
                        false,
                      ),
                    );
                    if (end == clean.length || end % 90 < 18) _scrollToEnd();
                  }
                }
              '''),
          )

          replace_regex_once(
              'lib/ui/ai_screen.dart',
              r'''  Future<void> _ask\(\) async \{.*?\n  \}\n\n  bool _looksLikeAiResponse''',
              dedent('''\
                Future<void> _ask() async {
                  if (_preparingRequest ||
                      _requesting ||
                      _reviewing ||
                      widget.controller.aiPreparing) {
                    return;
                  }
                  final request = _request.text.trim();
                  if (request.isEmpty) return;
                  setState(() {
                    _preparingRequest = true;
                    _turnPhase = _AiTurnPhase.routing;
                  });
                  try {
                    await _local.initialize();
                    if (!mounted) return;
                    if (!_hasAiRoute) {
                      await _openConnections();
                      if (!mounted) return;
                      if (!_hasAiRoute) {
                        setState(() {
                          _turnPhase = _AiTurnPhase.idle;
                          _error =
                              'No AI model is connected. Offline Aaris Brain still works for commands such as “Open Cefixime”, “Delete Cefixime”, “Add Cefixime 200mg”, stock, expiry and location.';
                        });
                        return;
                      }
                    }
                  } catch (e) {
                    if (mounted) {
                      setState(() {
                        _turnPhase = _AiTurnPhase.idle;
                        _error = e.toString();
                      });
                    }
                    return;
                  } finally {
                    if (mounted) setState(() => _preparingRequest = false);
                  }

                  final generation = ++_generation;
                  setState(() {
                    _requesting = true;
                    _turnPhase = _AiTurnPhase.thinking;
                    _error = '';
                    _plan = null;
                    _messages.add(_AiChatMessage(request, true));
                    _request.clear();
                  });
                  _scrollToEnd();

                  try {
                    final result = await _service.ask(
                      _configuration,
                      widget.controller.export,
                      request,
                      localContext: LocalInventoryContext(
                        records: widget.controller.records,
                        sales: widget.controller.sales,
                        revision: widget.controller.snapshot.revision,
                        today: widget.controller.today,
                      ),
                      conversation: _messages
                          .skip(_messages.length > 6 ? _messages.length - 6 : 0)
                          .map((m) => '${m.user ? 'Owner' : 'Assistant'}: ${m.text}')
                          .join('\\n'),
                    );
                    if (!mounted || generation != _generation) return;
                    setState(() {
                      _turnPhase = _AiTurnPhase.reviewing;
                      _input.text = result;
                    });
                    final plan = await _review(announce: false);
                    if (!mounted || generation != _generation || plan == null) return;
                    final reply = plan.reply.trim().isNotEmpty
                        ? plan.reply.trim()
                        : plan.changes.isEmpty
                        ? 'Done. No inventory change is needed.'
                        : '${plan.changes.length} proposed change${plan.changes.length == 1 ? '' : 's'} are ready below. Review them before saving.';
                    setState(() => _turnPhase = _AiTurnPhase.streaming);
                    await _streamAssistantMessage(reply, generation);
                  } catch (e) {
                    if (mounted && generation == _generation) {
                      setState(
                        () => _error = e is TimeoutException
                            ? 'The AI took too long. No inventory changes were made.'
                            : e.toString().replaceFirst('Bad state: ', ''),
                      );
                    }
                  } finally {
                    if (mounted && generation == _generation) {
                      setState(() {
                        _requesting = false;
                        _turnPhase = _AiTurnPhase.idle;
                      });
                    }
                  }
                }

                bool _looksLikeAiResponse
              '''),
          )

          replace_regex_once(
              'lib/ui/ai_screen.dart',
              r'''  Future<void> _sendComposer\(\) async \{.*?\n  \}\n\n  Future<void> _runQuickAction''',
              dedent('''\
                Future<void> _sendComposer() async {
                  if (_localCommanding ||
                      _requesting ||
                      _reviewing ||
                      widget.controller.aiPreparing) {
                    return;
                  }
                  final text = _request.text.trim();
                  if (text.isEmpty) return;

                  if (_looksLikeAiResponse(text)) {
                    setState(() {
                      _input.text = text;
                      _request.clear();
                      _externalReady = false;
                      _messages.add(
                        const _AiChatMessage(
                          'External AI response pasted for review.',
                          true,
                        ),
                      );
                      _error = '';
                    });
                    _scrollToEnd();
                    await _review();
                    return;
