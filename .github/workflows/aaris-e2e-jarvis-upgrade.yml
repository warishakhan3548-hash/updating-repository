name: Aaris E2E Jarvis upgrade
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aaris-e2e-jarvis-upgrade.yml
permissions:
  contents: write
concurrency:
  group: aaris-e2e-jarvis-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.event.head_commit.message == 'Start Aaris E2E Jarvis upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply E2E AI controller upgrade
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one patch anchor, found {count}')
              file.write_text(text.replace(old, new))

          def replace_regex_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one regex patch anchor, found {count}')
              file.write_text(updated)

          # ------------------------------------------------------------------
          # 1) Deterministic App Brain: explicit Add/Open intents stay useful
          #    with zero AI connectivity and carry medicine identity forward.
          # ------------------------------------------------------------------
          replace_once(
              'lib/domain/app_brain.dart',
              dedent('''\
                if (_containsAny(text, const [
                  'add medicine',
                  'new medicine',
                  'medicine add',
                  'add stock',
                  'nayi medicine',
                  'nayi dawai',
                  'नई मेडिसिन',
                  'नई दवा',
                  'मेडिसिन जोड़',
                ])) {
                  return const AppBrainIntent(
                    action: AppBrainAction.addMedicine,
                    confidence: .98,
                  );
                }
              '''),
              dedent('''\
                final addMedicine = _addMedicineIntent(raw, text);
                if (addMedicine != null) return addMedicine;
              '''),
          )

          replace_once(
              'lib/domain/app_brain.dart',
              dedent('''\
                final section = _sectionIntent(text);
                if (section != null) {
                  return AppBrainIntent(
                    action: AppBrainAction.navigate,
                    section: section,
                    confidence: .97,
                  );
                }

                if (_containsAny(text, _searchTerms)) {
              '''),
              dedent('''\
                final section = _sectionIntent(text);
                if (section != null) {
                  return AppBrainIntent(
                    action: AppBrainAction.navigate,
                    section: section,
                    confidence: .97,
                  );
                }

                final openMedicine = _openMedicineLookupIntent(raw, text);
                if (openMedicine != null) return openMedicine;

                if (_containsAny(text, _searchTerms)) {
              '''),
          )

          replace_once(
              'lib/domain/app_brain.dart',
              'AppSection? _sectionIntent(String text) {',
              dedent('''\
              AppBrainIntent? _addMedicineIntent(String raw, String text) {
                const explicitTerms = <String>[
                  'add medicine',
                  'new medicine',
                  'medicine add',
                  'add stock',
                  'nayi medicine',
                  'nayi dawai',
                  'नई मेडिसिन',
                  'नई दवा',
                  'मेडिसिन जोड़',
                ];
                const directVerbs = <String>[
                  'add',
                  'create',
                  'new',
                  'jodo',
                  'jod do',
                  'जोड़ो',
                  'जोड़ दो',
                ];
                final explicit = _containsAny(text, explicitTerms);
                final direct = _startsWithAnyPhrase(text, directVerbs);
                if (!explicit && !direct) return null;

                // Generic app/config requests must remain available to the AI or
                // settings router instead of becoming a fake medicine draft.
                if (direct &&
                    _containsAny(text, const <String>[
                      'api key',
                      'ai model',
                      'local model',
                      'provider',
                      'connection',
                      'note',
                      'sales report',
                    ])) {
                  return null;
                }
                final query = _extractMedicineQuery(raw, <String>[
                  ...explicitTerms,
                  ...directVerbs,
                ]);
                return AppBrainIntent(
                  action: AppBrainAction.addMedicine,
                  query: query,
                  confidence: query.isEmpty ? .98 : .99,
                );
              }

              AppBrainIntent? _openMedicineLookupIntent(String raw, String text) {
                const verbs = <String>[
                  'open',
                  'open medicine',
                  'kholo',
                  'khol do',
                  'खोलो',
                  'खोल दो',
                ];
                if (!_containsAny(text, verbs)) return null;
                if (_containsAny(text, const <String>[
                  'settings',
                  'setting',
                  'local model',
                  'ai model',
                  'api key',
                  'provider',
                  'connection',
                ])) {
                  return null;
                }
                final query = _extractMedicineQuery(raw, verbs);
                if (query.isEmpty) return null;
                return AppBrainIntent(
                  action: AppBrainAction.search,
                  query: query,
                  confidence: .98,
                );
              }

              AppSection? _sectionIntent(String text) {
              '''),
          )

          # ------------------------------------------------------------------
          # 2) Brain-to-UI bridge: Add pre-fills EditorScreen; Delete opens one
          #    exact reviewed confirmation instead of a clunky two-dialog flow.
          # ------------------------------------------------------------------
          replace_once(
