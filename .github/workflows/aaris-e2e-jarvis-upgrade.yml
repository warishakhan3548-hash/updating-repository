                  // Deterministic commands are availability-independent. App Brain
                  // gets first refusal even when Local AI/API is configured. It
                  // returns null for uncertain/free-form text, which then falls
                  // through to exactly one selected AI route.
                  final localHandler = widget.onLocalCommand;
                  if (localHandler != null) {
                    String? localReply;
                    setState(() {
                      _localCommanding = true;
                      _turnPhase = _AiTurnPhase.routing;
                      _error = '';
                    });
                    try {
                      localReply = await localHandler(text);
                    } catch (error) {
                      if (mounted) {
                        setState(
                          () => _error = error
                              .toString()
                              .replaceFirst('Exception: ', ''),
                        );
                      }
                      return;
                    } finally {
                      if (mounted) {
                        setState(() {
                          _localCommanding = false;
                          _turnPhase = _AiTurnPhase.idle;
                        });
                      }
                    }
                    if (!mounted) return;
                    if (localReply != null) {
                      final reply = localReply.trim();
                      setState(() {
                        _request.clear();
                        _messages.add(_AiChatMessage(text, true));
                        if (reply.isNotEmpty) {
                          _messages.add(_AiChatMessage(reply, false));
                        }
                      });
                      _scrollToEnd();
                      return;
                    }
                  }

                  await _ask();
                }

                Future<void> _runQuickAction
              '''),
