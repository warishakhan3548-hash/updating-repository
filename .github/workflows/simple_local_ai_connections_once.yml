name: Apply simple Local AI connections upgrade

on:
  push:
    branches:
      - upgrade/simple-local-ai-connections-20260910
    paths:
      - tool/one_shot_simple_local_ai_connections.py
      - .github/workflows/simple_local_ai_connections_once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/simple-local-ai-connections-20260910
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Patch original core files
        run: python3 tool/one_shot_simple_local_ai_connections.py
      - name: Fix generated readiness test terminator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/local_model_readiness_test.dart')
          s = p.read_text()
          if not s.endswith('});\n'):
              raise SystemExit('unexpected readiness test ending')
          p.write_text(s[:-4] + '}\n')
          PY
      - name: Format
        run: dart format lib/domain/local_model.dart lib/services/local_ai_service_io.dart lib/services/local_ai_service_stub.dart lib/services/aaris_default_ai_service_io.dart lib/ui/local_models_panel.dart lib/ui/ai_screen.dart test/local_model_readiness_test.dart test/simple_ai_connections_source_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Focused regressions
        run: flutter test test/local_model_readiness_test.dart test/simple_ai_connections_source_test.dart test/unified_ai_hub_ui_test.dart test/local_model_architecture_test.dart test/app_test.dart
      - name: Full Flutter suite
        run: flutter test --reporter expanded
      - name: Compile Android integration
        run: flutter build apk --debug --no-pub
      - name: Commit validated core upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tool/one_shot_simple_local_ai_connections.py .github/workflows/simple_local_ai_connections_once.yml
          git add lib test docs
          git commit -m "Simplify Local AI setup and readiness UX"
          git push origin HEAD:upgrade/simple-local-ai-connections-20260910
