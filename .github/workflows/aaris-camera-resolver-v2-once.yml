name: Aaris camera resolver parity
on:
  push:
    branches: [ai/scan-ingestion-hardening-20260911]
    paths:
      - .github/workflows/aaris-camera-resolver-v2-once.yml
permissions:
  contents: write
concurrency:
  group: aaris-camera-resolver-parity
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.event.head_commit.message == 'Run Aaris camera resolver parity'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unify direct camera onto Resolver V2
        run: python3 tool/one_shot_unify_camera_resolver_v2.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format and verify resolver parity
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/ui/import_screen.dart test/scan_ingestion_privacy_contract_test.dart
          flutter pub get
          dart analyze lib test tool third_party/lib_llama_cpp/lib
          flutter test test/scan_ingestion_privacy_contract_test.dart test/medicine_resolution_v2_test.dart test/medicine_intake_concurrency_test.dart test/scan_auto_save_decision_test.dart --reporter expanded
          flutter test --reporter expanded
          flutter build apk --debug --no-pub
      - name: Commit verified resolver parity
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock 2>/dev/null || true
          git config user.name 'Aaris Pharmacy Upgrade Bot'
          git config user.email 'aaris-pharmacy-upgrade@users.noreply.github.com'
          git rm tool/one_shot_unify_camera_resolver_v2.py .github/workflows/aaris-camera-resolver-v2-once.yml
          git add lib/ui/import_screen.dart test/scan_ingestion_privacy_contract_test.dart docs/SCAN_INGESTION_HARDENING_2026_09_11.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No resolver parity diff produced'; exit 1; }
          git commit -m 'Unify camera scan with medicine resolver v2 [skip ci]'
          git push origin HEAD:ai/scan-ingestion-hardening-20260911
