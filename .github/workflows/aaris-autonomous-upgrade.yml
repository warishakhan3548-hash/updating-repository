name: Aaris autonomous upgrade

on:
  push:
    branches:
      - upgrade/aaris-autonomous-safety-20260910
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aaris-autonomous-upgrade-20260910
  cancel-in-progress: false

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - name: Checkout exact upgrade branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/aaris-autonomous-safety-20260910
          fetch-depth: 0

      - name: Fetch reviewed quick-intake source branch
        run: git fetch origin upgrade/aaris-brain-quick-intake-20260910

      - name: Apply surgical upgrade
        run: |
          python3 tool/aaris_autonomous_upgrade_20260910.py
          sed -i "/domain\/medicine.dart/d" test/reviewed_operation_idempotency_test.dart

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Format only upgraded Dart
        run: |
          dart format \
            lib/data/inventory_database.dart \
            lib/domain/app_brain.dart \
            lib/domain/dispensing_plan.dart \
            lib/domain/medicine_entry_prefill.dart \
            lib/state/pharmacy_controller.dart \
            lib/state/stock_location_operations.dart \
            lib/ui/brain_screen.dart \
            lib/ui/editor_screen.dart \
            test/medicine_entry_prefill_prefix_guard_test.dart \
            test/medicine_entry_prefill_test.dart \
            test/reviewed_operation_idempotency_test.dart

      - name: Verify clean patch shape
        run: git diff --check

      - name: Resolve pinned dependencies
        run: flutter pub get

      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib

      - name: Full Flutter regression suite
        run: flutter test --reporter expanded

      - name: Compile Android integration
        run: flutter build apk --debug --no-pub

      - name: Remove one-shot upgrade machinery
        run: |
          rm -f tool/aaris_autonomous_upgrade_20260910.py
          rm -f .github/workflows/aaris-autonomous-upgrade.yml
          git diff --check

      - name: Commit verified production upgrade
        run: |
          git config user.name "Aaris Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --check
          git commit -m "Upgrade Aaris autonomous pharmacy safety and quick intake"
          git push origin HEAD:upgrade/aaris-autonomous-safety-20260910

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Aaris-Pharmacy-autonomous-upgrade-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
