name: Build signed release APK
# build-trigger

on:
  push:
    branches:
      - release-apk-build-20260925

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Create isolated release signing certificate
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          printf '%s' "$PASS" > "$RUNNER_TEMP/aaris-release-password.txt"
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/aaris-release.p12" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias aaris-release \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650 \
            -dname "CN=Aaris Quran Release Build, OU=Aaris, O=Aaris, L=Palwal, ST=Haryana, C=IN"

      - name: Build and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          python3 tools/build_release.py \
            --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --keystore "$RUNNER_TEMP/aaris-release.p12" \
            --alias aaris-release \
            --password-file "$RUNNER_TEMP/aaris-release-password.txt" \
            --output "$PWD/release-output/Aaris-Quran-0.4.0-release.apk"
          sha256sum release-output/Aaris-Quran-0.4.0-release.apk | tee release-output/Aaris-Quran-0.4.0-release.apk.sha256
          test -s release-output/Aaris-Quran-0.4.0-release.apk
          test -s release-output/Aaris-Quran-0.4.0-release.build.json

      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: Aaris-Quran-0.4.0-release
          path: |
            release-output/Aaris-Quran-0.4.0-release.apk
            release-output/Aaris-Quran-0.4.0-release.apk.sha256
            release-output/Aaris-Quran-0.4.0-release.build.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
