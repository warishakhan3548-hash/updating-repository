name: Build latest release APK

on:
  push:
    branches:
      - build/release-apk-long-search-20260925
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release variant
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
      - name: Sign installable release APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          PASS="$(openssl rand -hex 20)"
          keytool -genkeypair -noprompt             -keystore "$RUNNER_TEMP/aaris-release-test.keystore"             -storepass "$PASS" -keypass "$PASS"             -alias aaris-release-test -keyalg RSA -keysize 2048 -validity 3650             -dname "CN=Aaris Quran Release Test,O=Aaris,C=IN"
          mkdir -p release-output
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" release-output/AarisQuran-release.apk
          "$BUILD_TOOLS/apksigner" sign             --ks "$RUNNER_TEMP/aaris-release-test.keystore"             --ks-key-alias aaris-release-test             --ks-pass "pass:$PASS" --key-pass "pass:$PASS"             --out release-output/AarisQuran-release-signed.apk             release-output/AarisQuran-release.apk
          mv release-output/AarisQuran-release-signed.apk release-output/AarisQuran-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release-output/AarisQuran-release.apk             | tee release-output/signing-verification.txt
          sha256sum release-output/AarisQuran-release.apk | tee release-output/SHA256.txt
          printf 'source_commit=88da731b88e53e8a086809d09716833631e6359f\nvariant=release\nsigning=ephemeral-ci-test-key\n'             > release-output/build-info.txt
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AarisQuran-release-long-search
          path: release-output/
          if-no-files-found: error
          retention-days: 7
