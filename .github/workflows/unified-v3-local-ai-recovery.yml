name: Unified V3 Local AI recovery
on:
  push:
    branches: [unified-medicine-evidence-v3]
    paths:
      - .github/workflows/unified-v3-local-ai-recovery.yml
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Run Local AI recovery race fix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply recovery and intake identity fixes
        run: python3 tool/one_shot_local_ai_recovery_race.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/services/ai_service.dart lib/domain/intake_resolution.dart
          flutter pub get
          dart analyze lib test tool third_party/lib_llama_cpp/lib
          git checkout -- pubspec.lock 2>/dev/null || true
          rm -f .github/workflows/unified-v3-local-ai-recovery.yml
          git config user.name 'Aaris CI Surgeon'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix shared Local AI and intake identity races [skip ci]'
          git push origin HEAD:unified-medicine-evidence-v3
