          ControlPacket.Disconnect -> DISCONNECT
          ''')

          # Controller advertises v2 delta support only after authenticated HELLO.
          p = 'app/src/main/java/com/aaris/remoteassist/webrtc/ControllerWebRtcSession.kt'
          replace_once(p,
          '''        fun onFallbackVideoFrame(frame: FallbackVideoFrame) = Unit
              fun onCommandResult(sequence: Long, applied: Boolean)
          ''',
          '''        fun onFallbackVideoFrame(frame: FallbackVideoFrame) = Unit
