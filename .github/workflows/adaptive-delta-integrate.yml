          ''')
          replace_once(p,
          '''                listener.onLive(geometry)
              }
          ''',
          '''                listener.onLive(geometry)
                  peer.sendControl(
                      ControlProtocol.encode(
                          ControlPacket.FallbackDeltaReady(
                              leaseSecret = packet.leaseSecret
