name: Adaptive Delta Integration

on:
  push:
    branches:
      - upgrade/v1.8.39-adaptive-delta-screen

permissions:
  contents: write

jobs:
  integrate-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[delta-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/v1.8.39-adaptive-delta-screen
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6

      - name: Integrate adaptive delta transport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              text = text.replace(old, new, 1)
              p.write_text(text)

          # Control protocol capability negotiation. Unknown type 18 is ignored
          # by older hosts, so mixed-version sessions remain on legacy JPEG.
          p = 'app/src/main/java/com/aaris/remoteassist/control/ControlProtocol.kt'
          replace_once(p,
          '''    data class InteractionState(
              val leaseSecret: Long,
