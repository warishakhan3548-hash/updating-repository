name: Adaptive Delta Integration

on:
  push:
    branches:
      - upgrade/v1.8.39-adaptive-delta-screen

permissions:
  contents: write

jobs:
  integrate-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[delta-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/v1.8.39-adaptive-delta-screen
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6

      - name: Patch control capability protocol
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/aaris/remoteassist/control/ControlProtocol.kt')
          s = p.read_text()
          def r(old, new):
              global s
              if old not in s: raise SystemExit('ControlProtocol anchor missing: '+repr(old[:80]))
              s = s.replace(old, new, 1)
          r('''    data class InteractionState(\n        val leaseSecret: Long,\n        val active: Boolean\n    ) : ControlPacket\n\n    data object Disconnect : ControlPacket\n''', '''    data class InteractionState(\n        val leaseSecret: Long,\n        val active: Boolean\n    ) : ControlPacket\n\n    data class FallbackDeltaReady(\n        val leaseSecret: Long\n    ) : ControlPacket\n\n    data object Disconnect : ControlPacket\n''')
          r('''    private const val GESTURE_STREAM: Byte = 17\n''', '''    private const val GESTURE_STREAM: Byte = 17\n    private const val FALLBACK_DELTA_READY: Byte = 18\n''')
          r('''            is ControlPacket.VideoRecoveryRequest,\n            is ControlPacket.PrimaryVideoReady -> 2 + 8\n            is ControlPacket.InteractionState -> 2 + 8 + 1\n''', '''            is ControlPacket.VideoRecoveryRequest,\n            is ControlPacket.PrimaryVideoReady,\n            is ControlPacket.FallbackDeltaReady -> 2 + 8\n            is ControlPacket.InteractionState -> 2 + 8 + 1\n''')
          r('''            is ControlPacket.InteractionState -> {\n                buffer.putLong(packet.leaseSecret)\n                buffer.put((if (packet.active) 1 else 0).toByte())\n            }\n\n            ControlPacket.Disconnect -> Unit\n''', '''            is ControlPacket.InteractionState -> {\n                buffer.putLong(packet.leaseSecret)\n                buffer.put((if (packet.active) 1 else 0).toByte())\n            }\n\n            is ControlPacket.FallbackDeltaReady -> {\n                buffer.putLong(packet.leaseSecret)\n            }\n\n            ControlPacket.Disconnect -> Unit\n''')
          r('''                DISCONNECT -> {\n                    require(buffer.remaining() == 0)\n''', '''                FALLBACK_DELTA_READY -> {\n                    require(buffer.remaining() == 8)\n                    ControlPacket.FallbackDeltaReady(\n                        leaseSecret = buffer.long\n                    )\n                }\n\n                DISCONNECT -> {\n                    require(buffer.remaining() == 0)\n''')
          r('''            is ControlPacket.PrimaryVideoReady,\n            is ControlPacket.InteractionState,\n            ControlPacket.Disconnect -> null\n''', '''            is ControlPacket.PrimaryVideoReady,\n            is ControlPacket.InteractionState,\n            is ControlPacket.FallbackDeltaReady,\n            ControlPacket.Disconnect -> null\n''')
          r('''        is ControlPacket.InteractionState ->\n            INTERACTION_STATE\n        ControlPacket.Disconnect -> DISCONNECT\n''', '''        is ControlPacket.InteractionState ->\n            INTERACTION_STATE\n        is ControlPacket.FallbackDeltaReady ->\n            FALLBACK_DELTA_READY\n        ControlPacket.Disconnect -> DISCONNECT\n''')
          p.write_text(s)
          PY

      - name: Patch controller capability advertisement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/aaris/remoteassist/webrtc/ControllerWebRtcSession.kt')
          s = p.read_text()
          def r(old,new):
              global s
              if old not in s: raise SystemExit('Controller anchor missing: '+repr(old[:80]))
              s=s.replace(old,new,1)
          r('''        fun onFallbackVideoFrame(frame: FallbackVideoFrame) = Unit\n        fun onCommandResult(sequence: Long, applied: Boolean)\n''','''        fun onFallbackVideoFrame(frame: FallbackVideoFrame) = Unit\n        fun onFallbackDeltaFrame(frame: FallbackDeltaFrame) = Unit\n        fun onCommandResult(sequence: Long, applied: Boolean)\n''')
          r('''                listener.onLive(geometry)\n            }\n\n            is ControlPacket.CommandResult ->\n''','''                listener.onLive(geometry)\n                peer.sendControl(\n                    ControlProtocol.encode(\n                        ControlPacket.FallbackDeltaReady(\n                            leaseSecret = packet.leaseSecret\n                        )\n                    )\n                )\n            }\n\n            is ControlPacket.CommandResult ->\n''')
          r('''    override fun onFallbackVideoFrame(\n        frame: FallbackVideoFrame\n    ) {\n        listener.onFallbackVideoFrame(frame)\n    }\n\n    override fun onVideoHealth(\n''','''    override fun onFallbackVideoFrame(\n        frame: FallbackVideoFrame\n    ) {\n        listener.onFallbackVideoFrame(frame)\n    }\n\n    override fun onFallbackDeltaFrame(\n        frame: FallbackDeltaFrame\n    ) {\n        listener.onFallbackDeltaFrame(frame)\n    }\n\n    override fun onVideoHealth(\n''')
          p.write_text(s)
          PY

      - name: Patch host adaptive recovery policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/aaris/remoteassist/webrtc/HostWebRtcSession.kt')
          s=p.read_text()
          def r(old,new):
              global s
              if old not in s: raise SystemExit('Host anchor missing: '+repr(old[:80]))
              s=s.replace(old,new,1)
          r('''        if (!closed.get() && interactionActive) {\n            interactionActive = false\n            applyVideoPolicy(profile)\n''','''        if (!closed.get() && interactionActive) {\n            interactionActive = false\n            fallbackStreamer.setInteractionActive(false)\n            applyVideoPolicy(profile)\n''')
          r('''            is ControlPacket.InteractionState -> {\n                val currentLease = lease ?: return\n                if (\n                    packet.leaseSecret !=\n                    currentLease.leaseSecret\n                ) {\n                    return\n                }\n                updateInteractionPriority(packet.active)\n            }\n\n            is ControlPacket.CommandResult,\n''','''            is ControlPacket.InteractionState -> {\n                val currentLease = lease ?: return\n                if (\n                    packet.leaseSecret !=\n                    currentLease.leaseSecret\n                ) {\n                    return\n                }\n                updateInteractionPriority(packet.active)\n            }\n\n            is ControlPacket.FallbackDeltaReady -> {\n                val currentLease = lease ?: return\n                if (\n                    packet.leaseSecret !=\n                    currentLease.leaseSecret\n                ) {\n                    return\n                }\n                fallbackStreamer.setDeltaCapable(true)\n                listener.onDiagnostic(\n                    "Controller supports adaptive delta recovery transport"\n                )\n            }\n\n            is ControlPacket.CommandResult,\n''')
          r('''    private fun updateInteractionPriority(active: Boolean) {\n        displayHandler.removeCallbacks(interactionPriorityTimeout)\n\n        if (interactionActive != active) {\n''','''    private fun updateInteractionPriority(active: Boolean) {\n        displayHandler.removeCallbacks(interactionPriorityTimeout)\n        fallbackStreamer.setInteractionActive(active)\n\n        if (interactionActive != active) {\n''')
          p.write_text(s)
          PY

      - name: Patch fallback WebRTC transport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/aaris/remoteassist/webrtc/WebRtcPeer.kt')
          s=p.read_text()
          def r(old,new):
              global s
              if old not in s: raise SystemExit('WebRtcPeer anchor missing: '+repr(old[:80]))
              s=s.replace(old,new,1)
          r('''import java.nio.ByteBuffer\n''','''import java.nio.ByteBuffer\nimport java.nio.ByteOrder\n''')
          r('''        fun onFallbackVideoFrame(frame: FallbackVideoFrame) = Unit\n        fun onRemoteMediaRecoveryRequested() = Unit\n''','''        fun onFallbackVideoFrame(frame: FallbackVideoFrame) = Unit\n        fun onFallbackDeltaFrame(frame: FallbackDeltaFrame) = Unit\n        fun onRemoteMediaRecoveryRequested() = Unit\n''')
          r('''    private val fallbackReassembler =\n        FallbackVideoProtocol.Reassembler()\n''','''    private val fallbackReassembler =\n        FallbackVideoProtocol.Reassembler()\n    private val fallbackDeltaReassembler =\n        FallbackDeltaProtocol.Reassembler()\n''')
          r('''                    DataChannel.Init().apply {\n                        ordered = false\n                        maxRetransmits = 0\n                    }\n                )\n            )\n            check(\n''','''                    DataChannel.Init().apply {\n                        ordered = false\n                        maxRetransmits = 1\n                    }\n                )\n            )\n            check(\n''')
          r('''        if (\n            channel.bufferedAmount() >\n            MAX_FALLBACK_BUFFERED_BYTES\n        ) {\n            return false\n        }\n\n        return sendBinary(channel, bytes)\n''','''        val bufferedLimit =\n            if (isDeltaFallbackPacket(bytes)) {\n                MAX_FRESH_FALLBACK_BUFFERED_BYTES\n            } else {\n                MAX_FALLBACK_BUFFERED_BYTES\n            }\n        if (channel.bufferedAmount() > bufferedLimit) {\n            return false\n        }\n\n        return sendBinary(channel, bytes)\n''')
          r('''        fallbackVideoChannel?.let(::disposeDataChannel)\n        fallbackVideoChannel = null\n        fallbackReassembler.reset()\n''','''        fallbackVideoChannel?.let(::disposeDataChannel)\n        fallbackVideoChannel = null\n        fallbackReassembler.reset()\n        fallbackDeltaReassembler.reset()\n''')
          r('''                    val bytes = ByteArray(size)\n                    source.get(bytes)\n\n                    fallbackReassembler\n''','''                    val bytes = ByteArray(size)\n                    source.get(bytes)\n\n                    fallbackDeltaReassembler\n                        .offer(bytes)\n                        ?.let { frame ->\n                            listener.onFallbackDeltaFrame(frame)\n                            return\n                        }\n\n                    fallbackReassembler\n''')
          r('''    private fun monotonicNowMs(): Long =\n        System.nanoTime() / 1_000_000L\n''','''    private fun isDeltaFallbackPacket(bytes: ByteArray): Boolean {\n        if (bytes.size < 4) return false\n        return ByteBuffer.wrap(bytes, 0, 4)\n            .order(ByteOrder.BIG_ENDIAN)\n            .int == FALLBACK_DELTA_MAGIC\n    }\n\n    private fun monotonicNowMs(): Long =\n        System.nanoTime() / 1_000_000L\n''')
          r('''        private const val MAX_FALLBACK_BUFFERED_BYTES = 900_000L\n        private const val CONTROL_CHANNEL = "control-v1"\n''','''        private const val MAX_FALLBACK_BUFFERED_BYTES = 900_000L\n        private const val MAX_FRESH_FALLBACK_BUFFERED_BYTES = 64_000L\n        private const val FALLBACK_DELTA_MAGIC = 0x41524432\n        private const val CONTROL_CHANNEL = "control-v1"\n''')
          p.write_text(s)
          PY

      - name: Harden authoritative fallback reference model
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/aaris/remoteassist/webrtc/FallbackScreenStreamer.kt')
          s=p.read_text()
          def r(old,new):
              global s
              if old not in s: raise SystemExit('Fallback streamer anchor missing: '+repr(old[:80]))
              s=s.replace(old,new,1)
          r('''        if (plan.regions.isEmpty() && !plan.forceKeyframe) {\n            // Tiny sub-threshold capture noise does not deserve network bytes.\n            // Keep the controller's authoritative base id while following the\n            // latest raw pixels for the next change comparison.\n            referenceFrame = reference.copy(luma = packedLuma)\n            return true\n        }\n''','''        if (plan.regions.isEmpty() && !plan.forceKeyframe) {\n            // Do not advance the host reference for pixels that were never sent.\n            // This keeps host/controller bases identical across many tiny changes.\n            return true\n        }\n''')
          r('''                    luma = packedLuma\n                )\n            if (firstDeltaReported.compareAndSet(false, true)) {\n''','''                    luma = advanceReferenceLuma(\n                        previous = reference.luma,\n                        current = packedLuma,\n                        width = width,\n                        height = height,\n                        shiftY = plan.shiftY,\n                        regions = plan.regions\n                    )\n                )\n            if (firstDeltaReported.compareAndSet(false, true)) {\n''')
          marker='''    private fun sendLegacyKeyframe(\n'''
          if marker not in s: raise SystemExit('Fallback streamer method marker missing')
          helper='''    private fun advanceReferenceLuma(\n        previous: ByteArray,\n        current: ByteArray,\n        width: Int,\n        height: Int,\n        shiftY: Int,\n        regions: List<DeltaRegion>\n    ): ByteArray {\n        val result = ByteArray(width * height)\n\n        for (y in 0 until height) {\n            val sourceY = y - shiftY\n            if (sourceY !in 0 until height) continue\n            previous.copyInto(\n                destination = result,\n                destinationOffset = y * width,\n                startIndex = sourceY * width,\n                endIndex = (sourceY + 1) * width\n            )\n        }\n\n        regions.forEach { region ->\n            for (y in region.y until region.y + region.height) {\n                val start = y * width + region.x\n                current.copyInto(\n                    destination = result,\n                    destinationOffset = start,\n                    startIndex = start,\n                    endIndex = start + region.width\n                )\n            }\n        }\n        return result\n    }\n\n'''
          s=s.replace(marker,helper+marker,1)
          r('''        private val ADAPTIVE_KEYFRAME_QUALITY_LADDER =\n            intArrayOf(46, 36, 28, 22)\n        private val PATCH_JPEG_QUALITY_LADDER =\n            intArrayOf(58, 48, 38, 30)\n\n        private const val MAX_LEGACY_JPEG_BYTES = 720_000\n        private const val MAX_ADAPTIVE_KEYFRAME_BYTES = 380_000\n        private const val MAX_PATCH_JPEG_BYTES = 150_000\n        private const val MAX_DELTA_JPEG_BYTES = 300_000\n''','''        private val ADAPTIVE_KEYFRAME_QUALITY_LADDER =\n            intArrayOf(44, 34, 26, 20, 16)\n        private val PATCH_JPEG_QUALITY_LADDER =\n            intArrayOf(56, 46, 36, 28, 22)\n\n        private const val MAX_LEGACY_JPEG_BYTES = 720_000\n        private const val MAX_ADAPTIVE_KEYFRAME_BYTES = 240_000\n        private const val MAX_PATCH_JPEG_BYTES = 56_000\n        private const val MAX_DELTA_JPEG_BYTES = 56_000\n''')
          p.write_text(s)
          PY

      - name: Patch controller atomic delta compositor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/aaris/remoteassist/ui/InlineRemoteControllerView.kt')
          s=p.read_text()
          def r(old,new):
              global s
              if old not in s: raise SystemExit('Controller UI anchor missing: '+repr(old[:80]))
              s=s.replace(old,new,1)
          r('''import android.graphics.BitmapFactory\nimport android.graphics.Color\n''','''import android.graphics.BitmapFactory\nimport android.graphics.Canvas\nimport android.graphics.Color\n''')
          r('''import com.aaris.remoteassist.webrtc.ControllerWebRtcSession\nimport com.aaris.remoteassist.webrtc.FallbackVideoFrame\n''','''import com.aaris.remoteassist.webrtc.ControllerWebRtcSession\nimport com.aaris.remoteassist.webrtc.FallbackDeltaFrame\nimport com.aaris.remoteassist.webrtc.FallbackDeltaPatch\nimport com.aaris.remoteassist.webrtc.FallbackVideoFrame\n''')
          r('''    private data class LocalTouchPoint(\n        val x: Float,\n        val y: Float,\n        val atMs: Long\n    )\n''','''    private data class LocalTouchPoint(\n        val x: Float,\n        val y: Float,\n        val atMs: Long\n    )\n\n    private data class DecodedDeltaPatch(\n        val x: Int,\n        val y: Int,\n        val bitmap: Bitmap\n    )\n''')
          r('''    private val fallbackDecodeScheduled = AtomicBoolean(false)\n    private var fallbackBitmap: Bitmap? = null\n    private var mediaRecoveryAttempts = 0\n''','''    private val fallbackDecodeScheduled = AtomicBoolean(false)\n    private var fallbackBitmap: Bitmap? = null\n    private var fallbackScratchBitmap: Bitmap? = null\n    @Volatile\n    private var fallbackCompositeFrameId = -1L\n    private var mediaRecoveryAttempts = 0\n''')
          r('''            override fun onFallbackVideoFrame(\n                frame: FallbackVideoFrame\n            ) {\n                decodeFallbackFrame(frame)\n            }\n\n            override fun onCommandResult(\n''','''            override fun onFallbackVideoFrame(\n                frame: FallbackVideoFrame\n            ) {\n                decodeFallbackFrame(frame)\n            }\n\n            override fun onFallbackDeltaFrame(\n                frame: FallbackDeltaFrame\n            ) {\n                decodeFallbackDeltaFrame(frame)\n            }\n\n            override fun onCommandResult(\n''')
          r('''            fallbackBitmap?.recycle()\n            fallbackBitmap = null\n        }\n\n        remoteTrack = null\n''','''            fallbackBitmap?.recycle()\n            fallbackBitmap = null\n            fallbackScratchBitmap?.recycle()\n            fallbackScratchBitmap = null\n            fallbackCompositeFrameId = -1L\n        }\n\n        remoteTrack = null\n''')
          r('''                                fallbackBitmap?.recycle()\n                                fallbackBitmap = null\n                                status.visibility = View.GONE\n''','''                                fallbackBitmap?.recycle()\n                                fallbackBitmap = null\n                                fallbackScratchBitmap?.recycle()\n                                fallbackScratchBitmap = null\n                                fallbackCompositeFrameId = -1L\n                                status.visibility = View.GONE\n''')
          r('''            fallbackActive = true\n            frameWidth = oriented.width\n            frameHeight = oriented.height\n            updateVideoViewport()\n\n            val previous = fallbackBitmap\n            fallbackBitmap = oriented\n            fallbackImageView.setImageBitmap(oriented)\n''','''            if (frame.frameId <= fallbackCompositeFrameId) {\n                oriented.recycle()\n                return@runOnUiThread\n            }\n\n            fallbackActive = true\n            fallbackCompositeFrameId = frame.frameId\n            frameWidth = oriented.width\n            frameHeight = oriented.height\n            updateVideoViewport()\n\n            val previous = fallbackBitmap\n            val previousScratch = fallbackScratchBitmap\n            fallbackBitmap = oriented\n            fallbackScratchBitmap = null\n            fallbackImageView.setImageBitmap(oriented)\n''')
          r('''            if (\n                previous != null &&\n                previous !== oriented &&\n                !previous.isRecycled\n            ) {\n                previous.recycle()\n            }\n\n            status.visibility = View.VISIBLE\n''','''            if (\n                previous != null &&\n                previous !== oriented &&\n                !previous.isRecycled\n            ) {\n                previous.recycle()\n            }\n            if (\n                previousScratch != null &&\n                previousScratch !== oriented &&\n                previousScratch !== previous &&\n                !previousScratch.isRecycled\n            ) {\n                previousScratch.recycle()\n            }\n\n            status.visibility = View.VISIBLE\n''')
          marker='''    private fun addButton(\n'''
          if marker not in s: raise SystemExit('Controller UI addButton marker missing')
          methods=r'''    private fun decodeFallbackDeltaFrame(\n        frame: FallbackDeltaFrame\n    ) {\n        if (!attached || renderedFrameSeen.get()) return\n        runCatching {\n            fallbackDecoder.execute {\n                decodeFallbackDeltaFrameNow(frame)\n            }\n        }\n    }\n\n    private fun decodeFallbackDeltaFrameNow(\n        frame: FallbackDeltaFrame\n    ) {\n        if (\n            renderedFrameSeen.get() ||\n            frame.baseFrameId != fallbackCompositeFrameId\n        ) {\n            return\n        }\n\n        val decoded = ArrayList<DecodedDeltaPatch>(frame.patches.size)\n        for (patch in frame.patches) {\n            val item = decodeOrientedDeltaPatch(frame, patch)\n            if (item == null) {\n                decoded.forEach { it.bitmap.recycle() }\n                return\n            }\n            decoded += item\n        }\n\n        activity.runOnUiThread {\n            if (\n                !attached ||\n                renderedFrameSeen.get() ||\n                frame.baseFrameId != fallbackCompositeFrameId\n            ) {\n                decoded.forEach { it.bitmap.recycle() }\n                return@runOnUiThread\n            }\n\n            val current = fallbackBitmap\n            if (current == null || current.isRecycled) {\n                decoded.forEach { it.bitmap.recycle() }\n                return@runOnUiThread\n            }\n\n            val orientedWidth =\n                if (frame.rotation == 90 || frame.rotation == 270) {\n                    frame.height\n                } else {\n                    frame.width\n                }\n            val orientedHeight =\n                if (frame.rotation == 90 || frame.rotation == 270) {\n                    frame.width\n                } else {\n                    frame.height\n                }\n            val currentGeometry = geometry\n            if (\n                current.width != orientedWidth ||\n                current.height != orientedHeight ||\n                (\n                    currentGeometry != null &&\n                    !RemoteViewportMapper.frameMatchesRemote(\n                        remoteWidth = currentGeometry.widthPx,\n                        remoteHeight = currentGeometry.heightPx,\n                        frameWidth = orientedWidth,\n                        frameHeight = orientedHeight\n                    )\n                )\n            ) {\n                decoded.forEach { it.bitmap.recycle() }\n                return@runOnUiThread\n            }\n\n            var scratch = fallbackScratchBitmap\n            if (\n                scratch == null ||\n                scratch.isRecycled ||\n                !scratch.isMutable ||\n                scratch.width != orientedWidth ||\n                scratch.height != orientedHeight\n            ) {\n                scratch?.takeIf { !it.isRecycled && it !== current }?.recycle()\n                scratch = Bitmap.createBitmap(\n                    orientedWidth,\n                    orientedHeight,\n                    Bitmap.Config.ARGB_8888\n                )\n            }\n\n            scratch.eraseColor(Color.BLACK)\n            val canvas = Canvas(scratch)\n            val (shiftX, shiftY) = orientedShift(\n                frame.shiftX,\n                frame.shiftY,\n                frame.rotation\n            )\n            canvas.drawBitmap(\n                current,\n                shiftX.toFloat(),\n                shiftY.toFloat(),\n                null\n            )\n            decoded.forEach { patch ->\n                canvas.drawBitmap(\n                    patch.bitmap,\n                    patch.x.toFloat(),\n                    patch.y.toFloat(),\n                    null\n                )\n            }\n\n            fallbackImageView.setImageBitmap(scratch)\n            fallbackBitmap = scratch\n            fallbackScratchBitmap =\n                if (current.isMutable && !current.isRecycled) {\n                    current\n                } else {\n                    if (!current.isRecycled) current.recycle()\n                    null\n                }\n            fallbackCompositeFrameId = frame.frameId\n            fallbackActive = true\n            latestObservedFrameWidth = orientedWidth\n            latestObservedFrameHeight = orientedHeight\n            frameWidth = orientedWidth\n            frameHeight = orientedHeight\n            updateVideoViewport()\n            fallbackImageView.visibility = View.VISIBLE\n            textureView.alpha = 0f\n            status.visibility = View.VISIBLE\n            status.text =\n                "Adaptive recovery video • primary stream recovering…"\n\n            decoded.forEach { patch ->\n                if (!patch.bitmap.isRecycled) patch.bitmap.recycle()\n            }\n        }\n    }\n\n    private fun decodeOrientedDeltaPatch(\n        frame: FallbackDeltaFrame,\n        patch: FallbackDeltaPatch\n    ): DecodedDeltaPatch? {\n        val decoded = BitmapFactory.decodeByteArray(\n            patch.jpeg,\n            0,\n            patch.jpeg.size\n        ) ?: return null\n\n        val oriented =\n            if (frame.rotation == 0) {\n                decoded\n            } else {\n                runCatching {\n                    val matrix = Matrix().apply {\n                        postRotate(frame.rotation.toFloat())\n                    }\n                    Bitmap.createBitmap(\n                        decoded,\n                        0,\n                        0,\n                        decoded.width,\n                        decoded.height,\n                        matrix,\n                        true\n                    )\n                }.getOrNull()?.also {\n                    if (it !== decoded) decoded.recycle()\n                } ?: decoded\n            }\n\n        val coordinates = when (frame.rotation) {\n            90 ->\n                (frame.height - patch.y - patch.height) to patch.x\n            180 ->\n                (frame.width - patch.x - patch.width) to\n                    (frame.height - patch.y - patch.height)\n            270 ->\n                patch.y to\n                    (frame.width - patch.x - patch.width)\n            else -> patch.x to patch.y\n        }\n\n        return DecodedDeltaPatch(\n            x = coordinates.first,\n            y = coordinates.second,\n            bitmap = oriented\n        )\n    }\n\n    private fun orientedShift(\n        shiftX: Int,\n        shiftY: Int,\n        rotation: Int\n    ): Pair<Int, Int> = when (rotation) {\n        90 -> -shiftY to shiftX\n        180 -> -shiftX to -shiftY\n        270 -> shiftY to -shiftX\n        else -> shiftX to shiftY\n    }\n\n'''.replace('\\n','\n')
          s=s.replace(marker,methods+marker,1)
          p.write_text(s)
          PY

      - name: Bump version and add capability regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          if 'versionCode = 86' not in s or 'versionName = "1.8.38"' not in s:
              raise SystemExit('version anchor missing')
          s=s.replace('versionCode = 86','versionCode = 87',1)
          s=s.replace('versionName = "1.8.38"','versionName = "1.8.39"',1)
          p.write_text(s)
          PY
          cat > app/src/test/java/com/aaris/remoteassist/control/FallbackDeltaCapabilityTest.kt <<'EOF'
          package com.aaris.remoteassist.control

          import org.junit.Assert.assertEquals
          import org.junit.Test

          class FallbackDeltaCapabilityTest {
              @Test
              fun deltaCapabilityRoundTripsWithoutProtocolVersionChange() {
                  val packet = ControlPacket.FallbackDeltaReady(998877L)
                  assertEquals(
                      packet,
                      ControlProtocol.decode(ControlProtocol.encode(packet))
                  )
              }
          }
          EOF

      - name: Verify adaptive delta regression suite
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Commit verified integration
        shell: bash
        run: |
          git config user.name "warishakhan3548-hash"
          git config user.email "warishakhan3548@gmail.com"
          git add app
          git commit -m "v1.8.39: integrate adaptive delta recovery [delta-integrated]"
          git push origin HEAD:upgrade/v1.8.39-adaptive-delta-screen
