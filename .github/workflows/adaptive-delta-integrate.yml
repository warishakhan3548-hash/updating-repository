              is ControlPacket.CommandResult,
          ''',
          '''            is ControlPacket.InteractionState -> {
                  val currentLease = lease ?: return
                  if (
                      packet.leaseSecret !=
                      currentLease.leaseSecret
                  ) {
                      return
                  }
                  updateInteractionPriority(packet.active)
              }

              is ControlPacket.FallbackDeltaReady -> {
                  val currentLease = lease ?: return
                  if (
                      packet.leaseSecret !=
