name: Temporary Aaris autonomous upgrade
on:
  push:
    branches: [aaris-autonomous-brain-audit-20260910]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aaris-autonomous-brain-audit-20260910
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply surgical source upgrade
        run: python3 .github/aaris_upgrade_patch.py
      - name: Format changed Dart sources
        run: dart format lib/domain/medicine.dart lib/domain/ai_protocol.dart lib/domain/local_ai_protocol.dart lib/state/pharmacy_controller.dart lib/ui/ai_screen.dart lib/ui/profile_screen.dart test/removal_recovery_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Focused removal and recovery checks
        run: flutter test test/removal_recovery_test.dart --reporter expanded
      - name: Commit verified upgrade
        shell: bash
        run: |
          rm .github/workflows/aaris-autonomous-upgrade-temp.yml
          rm .github/aaris_upgrade_patch.py
          git config user.name "Aaris Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Upgrade Aaris removal audit and AI recovery safety" -m "Persist durable removal provenance on the authoritative medicine row, centralize archive/restore lifecycle transitions, enable exact reviewed local-AI restore, require explicit selection for high-impact AI lifecycle actions, improve removed-stock recovery UX, and add regression coverage without introducing a second database or unsafe autonomous mutation."
          git push origin HEAD:aaris-autonomous-brain-audit-20260910
