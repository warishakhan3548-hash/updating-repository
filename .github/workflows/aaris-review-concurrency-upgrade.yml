          replace_once(
              'test/fefo_automation_test.dart',
              dedent('''\
              Medicine stock({
                required String id,
                required DateTime? expiry,
                required int? quantity,
                DateTime? mfg,
                String batch = '',
                bool sold = false,
                bool archived = false,
              }) => Medicine(
                id: id,
                name: 'Dolo',
                strength: '650 mg',
              '''),
              dedent('''\
              Medicine stock({
                required String id,
                required DateTime? expiry,
                required int? quantity,
                DateTime? mfg,
                String batch = '',
                String name = 'Dolo',
                String strength = '650 mg',
