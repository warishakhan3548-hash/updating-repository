name: World source checks (no APK)

on:
  push:
    branches: [main]
    paths:
      - 'Assets/Aaris/World/Core/**'
      - 'Assets/GameData/World/**'
      - 'Tools/**'
      - 'global.json'
      - '.github/workflows/world-checks.yml'
  pull_request:
    paths:
      - 'Assets/Aaris/World/Core/**'
      - 'Assets/GameData/World/**'
      - 'Tools/**'
      - 'global.json'
      - '.github/workflows/world-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Compile C# authoring tool
        run: dotnet build Tools/WorldTool/WorldTool.csproj --configuration Release
      - name: Exercise world invariants and editing regressions
        run: dotnet run --project Tools/WorldTool --configuration Release --no-build -- self-test
      - name: Validate checked-in source
        run: dotnet run --project Tools/WorldTool --configuration Release --no-build -- validate
      - name: Generate schematic, cell manifest and estimates
        run: dotnet run --project Tools/WorldTool --configuration Release --no-build -- review
      - name: Verify validation did not rewrite source
        run: git diff --exit-code
      - name: Save small review bundle (no player build)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: world-review-${{ github.sha }}
          path: Review/latest/
          if-no-files-found: error
          retention-days: 3
