name: Disposable AI link UI fixture

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/ai_link_test_phone.py
      - .github/workflows/ai-link-ui-fixture.yml

jobs:
  synthetic-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet "websockets==15.0.1" "Pillow==11.3.0"
      - name: Connect a disposable synthetic phone
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/ai_link_test_phone.py --state-file "$RUNNER_TEMP/ai-link-fixture.json" --seconds 720 --stop-after-actions 5 > "$RUNNER_TEMP/ai-link-fixture.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ai-link-fixture.pid"
          for attempt in $(seq 1 60); do
            if [ -s "$RUNNER_TEMP/ai-link-fixture.json" ]; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/ai-link-fixture.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/ai-link-fixture.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ai-link-fixture.log"
          exit 1
      - name: Save temporary fixture connection
        uses: actions/upload-artifact@v7
        with:
          name: Disposable-AI-Link-Fixture
          path: ${{ runner.temp }}/ai-link-fixture.json
          retention-days: 1
          if-no-files-found: error
      - name: Keep the fixture available for browser inspection
        shell: bash
        run: |
          set -euo pipefail
          while [ -e "$RUNNER_TEMP/ai-link-fixture.json" ] && kill -0 "$(cat "$RUNNER_TEMP/ai-link-fixture.pid")" 2>/dev/null; do
            sleep 5
          done
          cat "$RUNNER_TEMP/ai-link-fixture.log"
          test ! -e "$RUNNER_TEMP/ai-link-fixture.json"
