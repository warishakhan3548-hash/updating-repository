name: Commit validated unified Aaris AI hub patch
on:
  push:
    branches:
      - upgrade/aaris-ops-brain-analytics-20260910
    paths:
      - .github/workflows/aaris_unified_ai_ui_retry4.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/aaris-ops-brain-analytics-20260910
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Fix patch runner replacement semantics
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tool/aaris_unified_ai_ui_patch.py')
          s = p.read_text()
          old = '    "\\n" + brain_runner,\n    brain,\n    count=1,\n    flags=re.S,\n)'
          new = '    lambda _match: "\\n" + brain_runner,\n    brain,\n    count=1,\n    flags=re.S,\n)'
          if old not in s:
              raise SystemExit('brain runner substitution site not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Patch source
        run: python3 tool/aaris_unified_ai_ui_patch.py
      - name: Use resilient source regression test
        run: |
          cat > test/unified_ai_hub_ui_test.dart <<'DART'
          import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('Aaris Brain uses one unified AI composer with six real quick actions', () {
              final brain = File('lib/ui/brain_screen.dart').readAsStringSync();
              final ai = File('lib/ui/ai_screen.dart').readAsStringSync();

              expect(brain, isNot(contains('Aaris App Brain · offline commands')));
              expect(brain, isNot(contains('_brainBar(')));
              expect(ai, contains("hintText: 'Ask AI or paste pharmacy JSON…'"));
              expect(
                RegExp("hintText: 'Ask AI or paste pharmacy JSON…'").allMatches(ai).length,
                1,
              );
              expect(brain, contains('onLocalCommand: _handleUnifiedCommand'));
              expect(brain, contains('onQuickAction: _handleQuickAction'));

              for (final label in <String>[
                "label: 'Sold'",
                "label: 'Removed'",
                "label: 'Stock summary'",
                "label: 'Add'",
                "label: 'Delete'",
                "label: 'Modify'",
              ]) {
                expect(ai, contains(label), reason: label);
              }

              final deleteRoute = RegExp(
                r'AiHubQuickAction\.delete\s*=>\s*_openQuickTargetPicker\(\s*AppBrainAction\.removeMedicine,?\s*\)',
                multiLine: true,
              );
              final modifyRoute = RegExp(
                r'AiHubQuickAction\.modify\s*=>\s*_openQuickTargetPicker\(\s*AppBrainAction\.editMedicine,?\s*\)',
                multiLine: true,
              );
              expect(deleteRoute.hasMatch(brain), isTrue);
              expect(modifyRoute.hasMatch(brain), isTrue);
            });
          }
          DART
      - name: Format
        run: dart format lib/ui/brain_screen.dart lib/ui/ai_screen.dart lib/ui/local_models_panel.dart test/unified_ai_hub_ui_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Focused regression tests
        run: flutter test test/unified_ai_hub_ui_test.dart test/app_brain_test.dart test/brain_analytics_test.dart
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aaris_unified_ai_ui_once.yml
          git rm .github/workflows/aaris_unified_ai_ui_retry.yml
          git rm .github/workflows/aaris_unified_ai_ui_retry2.yml
          git rm .github/workflows/aaris_unified_ai_ui_retry3.yml
          git rm .github/workflows/aaris_unified_ai_ui_retry4.yml
          git rm -f tool/aaris_unified_ai_ui_patch.py
          git add lib/ui/brain_screen.dart lib/ui/ai_screen.dart lib/ui/local_models_panel.dart test/unified_ai_hub_ui_test.dart
          git commit -m "Unify Aaris Brain and AI Controller UI"
          git push origin HEAD:upgrade/aaris-ops-brain-analytics-20260910
