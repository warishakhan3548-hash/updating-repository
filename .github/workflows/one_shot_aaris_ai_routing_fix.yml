name: One-shot Aaris AI routing repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_shot_aaris_ai_routing_fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded routing repair
        run: |
          python3 tool/one_shot_aaris_ai_routing_fix.py
          git diff --check
          git status --short
      - name: Commit repaired app
        run: |
          git config user.name 'warishakhan3548-hash'
          git config user.email 'warishakhan3548@gmail.com'
          git add lib test tool
          git commit -m 'Fix Aaris Brain chat routing and model activation'
          git push origin HEAD:main
