name: Unified V3 cleanup
on:
  push:
    branches: [unified-medicine-evidence-v3]
    paths:
      - .github/workflows/unified-v3-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compile cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/fix_unified_v3_compile.py
          rm .github/workflows/unified-v3-cleanup.yml
          git config user.name "Aaris CI Surgeon"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish unified resolver compile cleanup"
          git push origin HEAD:unified-medicine-evidence-v3
