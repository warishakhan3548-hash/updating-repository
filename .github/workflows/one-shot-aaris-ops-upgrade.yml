name: One-shot Aaris operations upgrade

on:
  push:
    branches:
      - upgrade/aaris-fefo-automation-20260909
    paths:
      - .github/workflows/one-shot-aaris-ops-upgrade.yml

permissions:
  contents: write

concurrency:
  group: one-shot-aaris-ops-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical pharmacy automation upgrade
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
