name: One-shot Aaris operations upgrade
# Revalidated after syncing the latest main lifecycle hardening.

on:
  push:
    branches:
      - upgrade/aaris-fefo-automation-20260909
    paths:
      - .github/workflows/one-shot-aaris-ops-upgrade.yml

permissions:
  contents: write

concurrency:
  group: one-shot-aaris-ops-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical pharmacy automation upgrade
        run: python3 tool/one_shot_aaris_ops_upgrade.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Format upgraded Dart sources
        run: dart format lib/domain/dispensing_plan.dart lib/domain/inventory.dart lib/domain/tracking.dart lib/domain/attention.dart lib/domain/app_brain.dart lib/state/pharmacy_controller.dart lib/ui/attention_screen.dart lib/ui/brain_screen.dart test/app_brain_test.dart test/fefo_automation_test.dart test/operational_safety_upgrade_test.dart

      - name: Resolve pinned dependencies
        run: flutter pub get

      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib

      - name: Full regression suite
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/aaris-regression.log

      - name: Upload regression diagnostics
        if: steps.regression.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aaris-fefo-regression-diagnostics
          path: /tmp/aaris-regression.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop on regression failure
        if: steps.regression.outcome != 'success'
        run: exit 1

      - name: Commit verified upgrade
        if: steps.regression.outcome == 'success'
        shell: bash
        run: |
          rm .github/workflows/one-shot-aaris-ops-upgrade.yml
          rm tool/one_shot_aaris_ops_upgrade.py
          git config user.name "Aaris Pharmacy Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Upgrade Aaris Brain with reviewed FEFO automation" -m "Add deterministic cross-batch FEFO sale planning and one-transaction execution, explicit unit-aware Brain commands, future-MFG dispensing and reorder safety, proactive duplicate/data-quality attention checks, and regression coverage while preserving the single authoritative inventory and human confirmation boundary."
          git push origin HEAD:upgrade/aaris-fefo-automation-20260909
