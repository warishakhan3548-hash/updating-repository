name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - run: gradle :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Print lint report on failure
        if: failure()
        run: |
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - uses: actions/upload-artifact@v7
        with:
          name: AarisRemote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  cloudflare-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live Cloudflare control plane
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://aaris-remote-ice.aaris-remote-wk3548.workers.dev"
          export BASE

          HEALTH="$(curl --retry 3 --retry-all-errors -fsS "$BASE/healthz")"
          printf '%s' "$HEALTH" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          assert d.get("ok") is True
          assert d.get("backend") == "cloudflare-durable-objects"
          assert int(d.get("version",0)) >= 2
          '

          HOST="$(curl --retry 3 --retry-all-errors -fsS -X POST "$BASE/v1/sessions" -H "content-type: application/json" -d "{}")"
          export HOST
          CODE="$(python3 -c 'import json,os; d=json.loads(os.environ["HOST"]); print(d["code"])')"
          SID="$(python3 -c 'import json,os; d=json.loads(os.environ["HOST"]); print(d["sessionId"])')"
          HOST_TOKEN="$(python3 -c 'import json,os; d=json.loads(os.environ["HOST"]); print(d["hostToken"])')"
          export SID HOST_TOKEN
          [[ "$CODE" =~ ^[0-9]{12}$ ]]
          [[ "$SID" =~ ^[a-f0-9]{64}$ ]]

          cleanup() {
            curl -fsS -X POST "$BASE/v1/sessions/$SID/close"               -H "authorization: Bearer $HOST_TOKEN"               -H "content-type: application/json"               -d "{}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          CONTROLLER_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export CONTROLLER_TOKEN
          CONTROLLER="$(curl --retry 3 --retry-all-errors -fsS -X POST "$BASE/v1/sessions/redeem" -H "content-type: application/json" -d "{\"code\":\"$CODE\",\"controllerToken\":\"$CONTROLLER_TOKEN\"}")"
          export CONTROLLER

          state() {
            curl --retry 3 --retry-all-errors -fsS "$BASE/v1/sessions/$SID"               -H "authorization: Bearer $1" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["session"]["state"])'
          }

          test "$(state "$CONTROLLER_TOKEN")" = "PAIR_PENDING"

          curl -fsS -X POST "$BASE/v1/sessions/$SID/state"             -H "authorization: Bearer $HOST_TOKEN"             -H "content-type: application/json"             -d '{"target":"HOST_APPROVED"}' >/dev/null
          test "$(state "$CONTROLLER_TOKEN")" = "HOST_APPROVED"

          # Simulate an ambiguous first redeem response: retry after the host
          # has already advanced the session. The same controller token must
          # still recover the same session instead of becoming "code used".
          RETRY="$(curl --retry 3 --retry-all-errors -fsS -X POST "$BASE/v1/sessions/redeem" -H "content-type: application/json" -d "{\"code\":\"$CODE\",\"controllerToken\":\"$CONTROLLER_TOKEN\"}")"
          export RETRY
          python3 -c 'import json,os; a=json.loads(os.environ["CONTROLLER"]); b=json.loads(os.environ["RETRY"]); assert a["sessionId"]==b["sessionId"]==os.environ["SID"]; assert b["controllerUid"]==a["controllerUid"]'

          OTHER_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          STATUS="$(curl -sS -o /tmp/redeem-other.json -w '%{http_code}' -X POST "$BASE/v1/sessions/redeem" -H "content-type: application/json" -d "{\"code\":\"$CODE\",\"controllerToken\":\"$OTHER_TOKEN\"}")"
          test "$STATUS" = "409"

          # Production invariant: once the host explicitly approves the
          # controller, the controller may prewarm ephemeral TURN and its
          # signaling WebSocket before MediaProjection consent completes.
          PREWARM_ICE="$(curl --retry 3 --retry-all-errors -fsS -X POST "$BASE/v1/sessions/$SID/ice"             -H "authorization: Bearer $CONTROLLER_TOKEN"             -H "content-type: application/json" -d "{}")"
          printf '%s' "$PREWARM_ICE" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          servers=d.get("iceServers",[])
          urls=[]
          for server in servers:
              value=server.get("urls",[])
              urls.extend(value if isinstance(value,list) else [value])
          assert any(isinstance(u,str) and (u.startswith("turn:") or u.startswith("turns:")) for u in urls)
          '

          python3 -m pip install --quiet "websockets==15.0.1"

          # Reproduce the real Android ordering: controller socket first,
          # SCREEN_READY second, host offer third. The already-open controller
          # socket must receive the state transition and first offer.
          python3 - <<'PY'
          import asyncio, json, os, subprocess
          import websockets

          base = os.environ["BASE"]
          sid = os.environ["SID"]
          host_token = os.environ["HOST_TOKEN"]
          controller_token = os.environ["CONTROLLER_TOKEN"]
          ws_base = base.replace("https://", "wss://")

          def curl_json(method, url, token, payload):
              completed = subprocess.run(
                  [
                      "curl", "--retry", "3", "--retry-all-errors", "-fsS",
                      "-X", method, url,
                      "-H", f"authorization: Bearer {token}",
                      "-H", "content-type: application/json",
                      "-d", json.dumps(payload),
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
                  timeout=12,
              )
              if completed.returncode != 0:
                  raise AssertionError(completed.stderr[-300:])
              return json.loads(completed.stdout) if completed.stdout else {}

          async def recv_match(ws, predicate):
              for _ in range(20):
                  raw = await asyncio.wait_for(ws.recv(), timeout=5)
                  if isinstance(raw, bytes):
                      raw = raw.decode()
                  data = json.loads(raw)
                  if predicate(data):
                      return data
              raise AssertionError("Expected prewarm WebSocket event was not delivered")

          async def main():
              headers = {"Authorization": f"Bearer {controller_token}"}
              async with websockets.connect(
                  f"{ws_base}/v1/sessions/{sid}/socket?after=0",
                  additional_headers=headers,
                  open_timeout=8,
                  close_timeout=3,
              ) as controller_ws:
                  initial = await recv_match(
                      controller_ws,
                      lambda x: x.get("kind") == "session",
                  )
                  assert initial["session"]["state"] == "HOST_APPROVED"

                  await asyncio.to_thread(
                      curl_json,
                      "POST",
                      f"{base}/v1/sessions/{sid}/state",
                      host_token,
                      {"target": "SCREEN_READY"},
                  )
                  ready = await recv_match(
                      controller_ws,
                      lambda x: (
                          x.get("kind") == "session"
                          and x.get("session", {}).get("state") == "SCREEN_READY"
                      ),
                  )
                  assert ready["session"]["state"] == "SCREEN_READY"

                  await asyncio.to_thread(
                      curl_json,
                      "POST",
                      f"{base}/v1/sessions/{sid}/events",
                      host_token,
                      {
                          "kind": "description",
                          "payload": {
                              "type": "offer",
                              "sdp": "v=0",
                              "negotiationId": "ci-prewarm:1",
                          },
                      },
                  )
                  offer = await recv_match(
                      controller_ws,
                      lambda x: (
                          x.get("kind") == "signal_event"
                          and x.get("event", {}).get("kind") == "description"
                          and x.get("event", {}).get("senderRole") == "host"
                          and x.get("event", {}).get("payload", {}).get("negotiationId")
                              == "ci-prewarm:1"
                      ),
                  )
                  assert offer["event"]["payload"]["type"] == "offer"

          asyncio.run(main())
          PY

          test "$(state "$CONTROLLER_TOKEN")" = "SCREEN_READY"

          curl -fsS -X POST "$BASE/v1/sessions/$SID/events"             -H "authorization: Bearer $HOST_TOKEN"             -H "content-type: application/json"             -d '{"kind":"description","payload":{"type":"offer","sdp":"v=0","negotiationId":"smoke:1"}}' >/dev/null

          EVENTS="$(curl -fsS "$BASE/v1/sessions/$SID/events?after=0" -H "authorization: Bearer $CONTROLLER_TOKEN")"
          printf '%s' "$EVENTS" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          events=d.get("events",[])
          assert any(e.get("kind")=="description" and e.get("senderRole")=="host" for e in events)
          '
          python3 - <<'PY'
          import asyncio, json, os, subprocess
          import websockets

          base = os.environ["BASE"]
          sid = os.environ["SID"]
          host_token = os.environ["HOST_TOKEN"]
          controller_token = os.environ["CONTROLLER_TOKEN"]
          ws_base = base.replace("https://", "wss://")

          async def recv_match(ws, predicate):
              for _ in range(20):
                  raw = await asyncio.wait_for(ws.recv(), timeout=5)
                  if isinstance(raw, bytes):
                      raw = raw.decode()
                  data = json.loads(raw)
                  if predicate(data):
                      return data
              raise AssertionError("Expected WebSocket event was not delivered")

          def post_event(token, kind, payload):
              body = json.dumps({
                  "kind": kind,
                  "payload": payload
              })
              completed = subprocess.run(
                  [
                      "curl",
                      "--retry", "3",
                      "--retry-all-errors",
                      "-fsS",
                      "-X", "POST",
                      f"{base}/v1/sessions/{sid}/events",
                      "-H", f"authorization: Bearer {token}",
                      "-H", "content-type: application/json",
                      "-d", body,
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
                  timeout=12,
              )
              if completed.returncode != 0:
                  raise AssertionError(
                      "HTTP event publication failed: " +
                      completed.stderr[-300:]
                  )

          async def main():
              host_headers = {"Authorization": f"Bearer {host_token}"}
              controller_headers = {"Authorization": f"Bearer {controller_token}"}
              async with websockets.connect(
                  f"{ws_base}/v1/sessions/{sid}/socket?after=0",
                  additional_headers=host_headers,
                  open_timeout=8,
                  close_timeout=3,
              ) as host_ws, websockets.connect(
                  f"{ws_base}/v1/sessions/{sid}/socket?after=0",
                  additional_headers=controller_headers,
                  open_timeout=8,
                  close_timeout=3,
              ) as controller_ws:
                  await recv_match(host_ws, lambda x: x.get("kind") == "session")
                  await recv_match(controller_ws, lambda x: x.get("kind") == "session")

                  await asyncio.to_thread(
                      post_event,
                      host_token,
                      "presence",
                      {"online": True, "probe": "ci-websocket"},
                  )
                  presence = await recv_match(
                      controller_ws,
                      lambda x: (
                          x.get("kind") == "signal_event"
                          and x.get("event", {}).get("kind") == "presence"
                          and x.get("event", {}).get("senderRole") == "host"
                          and x.get("event", {}).get("payload", {}).get("probe")
                              == "ci-websocket"
                      ),
                  )
                  assert presence["event"]["seq"] > 0

                  offer_id = "ci-host-offer:1"
                  answer_id = "ci-controller-answer:1"

                  await asyncio.to_thread(
                      post_event,
                      host_token,
                      "description",
                      {
                          "type": "offer",
                          "sdp": "v=0\\r\\n",
                          "negotiationId": offer_id,
                      },
                  )
                  offer = await recv_match(
                      controller_ws,
                      lambda x: (
                          x.get("kind") == "signal_event"
                          and x.get("event", {}).get("kind") == "description"
                          and x.get("event", {}).get("senderRole") == "host"
                          and x.get("event", {}).get("payload", {}).get("negotiationId")
                              == offer_id
                      ),
                  )
                  assert offer["event"]["payload"]["type"] == "offer"

                  await asyncio.to_thread(
                      post_event,
                      controller_token,
                      "description",
                      {
                          "type": "answer",
                          "sdp": "v=0\\r\\n",
                          "negotiationId": answer_id,
                          "replyToNegotiationId": offer_id,
                      },
                  )
                  answer = await recv_match(
                      host_ws,
                      lambda x: (
                          x.get("kind") == "signal_event"
                          and x.get("event", {}).get("kind") == "description"
                          and x.get("event", {}).get("senderRole") == "controller"
                          and x.get("event", {}).get("payload", {}).get("negotiationId")
                              == answer_id
                      ),
                  )
                  assert answer["event"]["payload"]["replyToNegotiationId"] == offer_id

                  await asyncio.to_thread(
                      post_event,
                      host_token,
                      "candidate",
                      {
                          "mid": "0",
                          "mLine": 0,
                          "sdp": "candidate:ci-host 1 udp 1 192.0.2.1 9 typ host",
                          "negotiationId": offer_id,
                      },
                  )
                  await recv_match(
                      controller_ws,
                      lambda x: (
                          x.get("kind") == "signal_event"
                          and x.get("event", {}).get("kind") == "candidate"
                          and x.get("event", {}).get("senderRole") == "host"
                          and x.get("event", {}).get("payload", {}).get("negotiationId")
                              == offer_id
                      ),
                  )

                  await asyncio.to_thread(
                      post_event,
                      controller_token,
                      "candidate",
                      {
                          "mid": "0",
                          "mLine": 0,
                          "sdp": "candidate:ci-controller 1 udp 1 192.0.2.2 9 typ host",
                          "negotiationId": answer_id,
                      },
                  )
                  await recv_match(
                      host_ws,
                      lambda x: (
                          x.get("kind") == "signal_event"
                          and x.get("event", {}).get("kind") == "candidate"
                          and x.get("event", {}).get("senderRole") == "controller"
                          and x.get("event", {}).get("payload", {}).get("negotiationId")
                              == answer_id
                      ),
                  )

          asyncio.run(main())
          PY

          check_turn() {
            TOKEN="$1"
            ICE="$(curl --retry 3 --retry-all-errors -fsS -X POST "$BASE/v1/sessions/$SID/ice"               -H "authorization: Bearer $TOKEN"               -H "content-type: application/json" -d "{}")"
            printf '%s' "$ICE" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          servers=d.get("iceServers",[])
          urls=[]
          for item in servers:
              value=item.get("urls",[])
              urls.extend(value if isinstance(value,list) else [value])
          assert any(isinstance(u,str) and (u.startswith("turn:") or u.startswith("turns:")) for u in urls)
          '
          }

          check_turn "$HOST_TOKEN"
          check_turn "$CONTROLLER_TOKEN"

          curl -fsS -X POST "$BASE/v1/sessions/$SID/state"             -H "authorization: Bearer $HOST_TOKEN"             -H "content-type: application/json"             -d '{"target":"LIVE"}' >/dev/null
          test "$(state "$CONTROLLER_TOKEN")" = "LIVE"

          cleanup
          trap - EXIT
          test "$(state "$CONTROLLER_TOKEN")" = "CLOSED"

          # Backward compatibility: the first 1.8.0 client asked the server
          # to mint the controller token instead of supplying a stable token.
          LEGACY_HOST="$(curl --retry 3 --retry-all-errors -fsS -X POST "$BASE/v1/sessions" -H "content-type: application/json" -d "{}")"
          export LEGACY_HOST
          LEGACY_CODE="$(python3 -c 'import json,os; print(json.loads(os.environ["LEGACY_HOST"])["code"])')"
          LEGACY_SID="$(python3 -c 'import json,os; print(json.loads(os.environ["LEGACY_HOST"])["sessionId"])')"
          LEGACY_HOST_TOKEN="$(python3 -c 'import json,os; print(json.loads(os.environ["LEGACY_HOST"])["hostToken"])')"
          LEGACY_CONTROLLER="$(curl --retry 3 --retry-all-errors -fsS -X POST "$BASE/v1/sessions/redeem" -H "content-type: application/json" -d "{\"code\":\"$LEGACY_CODE\"}")"
          export LEGACY_CONTROLLER
          LEGACY_CONTROLLER_TOKEN="$(python3 -c 'import json,os; print(json.loads(os.environ["LEGACY_CONTROLLER"])["controllerToken"])')"
          test -n "$LEGACY_CONTROLLER_TOKEN"
          test "$(curl -fsS "$BASE/v1/sessions/$LEGACY_SID" -H "authorization: Bearer $LEGACY_CONTROLLER_TOKEN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["session"]["state"])')" = "PAIR_PENDING"
          curl -fsS -X POST "$BASE/v1/sessions/$LEGACY_SID/close" -H "authorization: Bearer $LEGACY_HOST_TOKEN" -H "content-type: application/json" -d "{}" >/dev/null
