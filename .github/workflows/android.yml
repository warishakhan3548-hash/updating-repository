name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Restore Firebase config when configured
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          fi
      - run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Print lint report on failure
        if: failure()
        run: |
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: AarisRemote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
