name: Evidence foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13.15'
      - name: Install pinned foundation verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-foundation.txt
      - name: Trusted content-pack public-key policy
        run: python tools/pack_signing.py policy/trusted_pack_keys.json
      - name: Source Vault gate
        run: python tools/vault_gate.py source-vault/registry.json
      - name: Content pack promotion gate
        run: python tools/pack_gate.py source-vault/registry.json
      - name: SQLite schema validation
        run: python tools/validate_schemas.py
      - name: Foundation unit tests
        run: python -m unittest discover -s tests -v
