name: Evidence foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Source Vault gate
        run: python tools/vault_gate.py source-vault/registry.json
      - name: Content pack promotion gate
        run: python tools/pack_gate.py source-vault/registry.json
      - name: SQLite schema validation
        run: python tools/validate_schemas.py
      - name: Foundation unit tests
        run: python -m unittest discover -s tests -v
