name: Android Quran reader checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/android-reader/**'
      - 'content-packs/quran-core/1.0.4/**'
      - 'source-vault/registry.json'
      - 'tools/pack_gate.py'
      - '.github/workflows/android-reader.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/android-reader/**'
      - 'content-packs/quran-core/1.0.4/**'
      - 'source-vault/registry.json'
      - 'tools/pack_gate.py'
      - '.github/workflows/android-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Verify pinned Quran pack
        run: python tools/pack_gate.py source-vault/registry.json content-packs/quran-core/1.0.4/manifest.json

      - name: Build and test debug reader
        run: gradle -p apps/android-reader :app:testDebugUnitTest :app:assembleDebug --stacktrace
