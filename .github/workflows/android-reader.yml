name: Android reader checks

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'content-packs/quran-core/1.0.3/**'
      - 'tests/test_android_reader_contract.py'
      - '.github/workflows/android-reader.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'content-packs/quran-core/1.0.3/**'
      - 'tests/test_android_reader_contract.py'
      - '.github/workflows/android-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Evidence foundation checks
        run: |
          python tools/vault_gate.py source-vault/registry.json
          python tools/pack_gate.py source-vault/registry.json
          python tools/validate_schemas.py
          python -m unittest discover -s tests -v

      - name: Reader unit tests and debug build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
