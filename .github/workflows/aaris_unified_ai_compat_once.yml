name: Restore unified composer command accessibility contract
on:
  push:
    branches:
      - upgrade/aaris-ops-brain-analytics-20260910
    paths:
      - .github/workflows/aaris_unified_ai_compat_once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/aaris-ops-brain-analytics-20260910
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Add command tooltip to the single composer send target
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/ui/ai_screen.dart')
          s = p.read_text()
          old = """                    : const Icon(\n                        Icons.arrow_upward_rounded,\n                        color: Colors.white,\n                      ),\n"""
          new = """                    : const Tooltip(\n                        message: 'Run command',\n                        child: Icon(\n                          Icons.arrow_upward_rounded,\n                          color: Colors.white,\n                        ),\n                      ),\n"""
          if s.count(old) != 1:
              raise SystemExit(f'expected one unified composer send icon, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format
        run: dart format lib/ui/ai_screen.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Brain widget regressions
        run: flutter test test/brain_screen_test.dart test/brain_command_safety_widget_test.dart test/unified_ai_hub_ui_test.dart
      - name: Commit validated compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aaris_unified_ai_compat_once.yml
          git add lib/ui/ai_screen.dart
          git commit -m "Preserve Brain command accessibility in unified composer"
          git push origin HEAD:upgrade/aaris-ops-brain-analytics-20260910
