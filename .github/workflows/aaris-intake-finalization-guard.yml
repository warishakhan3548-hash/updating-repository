name: Aaris intake finalization guard

on:
  push:
    branches:
      - aaris-intake-finalization-guard
    paths:
      - .github/workflows/aaris-intake-finalization-guard.yml

permissions:
  contents: write

concurrency:
  group: aaris-intake-finalization-guard
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Run Aaris intake finalization guard'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical source patch
        run: python3 tool/one_shot_intake_finalization_guard.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Format and verify full application
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/domain/medicine_intake.dart lib/services/medicine_intake_service.dart test/medicine_intake_concurrency_test.dart
          flutter pub get
          dart analyze lib test tool third_party/lib_llama_cpp/lib
          flutter test test/medicine_intake_concurrency_test.dart --reporter expanded
          flutter test --reporter expanded
          flutter build apk --debug --no-pub

      - name: Commit verified surgical patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock 2>/dev/null || true
          git config user.name 'Aaris Pharmacy Upgrade Bot'
          git config user.email 'warishakhan3548@gmail.com'
          git rm .github/workflows/aaris-intake-finalization-guard.yml tool/one_shot_intake_finalization_guard.py
          git add lib/domain/medicine_intake.dart lib/services/medicine_intake_service.dart test/medicine_intake_concurrency_test.dart docs/CODEBASE_TREE.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source upgrade diff produced'; exit 1; }
          git commit -m 'Serialize intake terminal actions with worker finalization'
          git push origin HEAD:aaris-intake-finalization-guard
