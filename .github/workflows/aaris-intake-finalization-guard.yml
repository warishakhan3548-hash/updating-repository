name: Aaris intake finalization guard
on:
  push:
    branches: [aaris-intake-finalization-guard]
    paths:
      - .github/workflows/aaris-intake-finalization-guard.yml
permissions:
  contents: write
concurrency:
  group: aaris-intake-finalization-guard
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.event.head_commit.message == 'Run Aaris intake finalization guard'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact-job finalization barrier
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          domain = Path('lib/domain/medicine_intake.dart')
          text = domain.read_text()
          import_anchor = "import 'medicine.dart';"
          if text.count(import_anchor) != 1:
              raise SystemExit('medicine_intake.dart import anchor mismatch')
          text = text.replace(import_anchor, "import 'dart:async';\n\nimport 'medicine.dart';", 1)
          scheduler_anchor = "/// Alternate durable OCR/capture work with Local AI reasoning when both are\n"
          if text.count(scheduler_anchor) != 1:
              raise SystemExit('medicine_intake.dart scheduler anchor mismatch')
          barrier = r'''/// Coordinates one worker-owned capture with user terminal actions.
///
/// OCR/video processing deliberately checkpoints durable review state before
/// private source cleanup finishes. The UI can therefore observe `review` or
/// `failed` for a few asynchronous instructions while the worker still owns the
/// same row. Retry/Dismiss must wait for that exact ownership lease to end; a
/// global queue lock would unnecessarily block unrelated captures.
class MedicineIntakeWorkBarrier {
  String? _activeId;
  Completer<void>? _released;

  bool owns(String id) => _activeId == id;

  void begin(String id) {
    if (_released != null) {
      throw StateError('A medicine intake worker lease is already active.');
    }
    _activeId = id;
    _released = Completer<void>();
  }

  Future<void> wait(String id) {
    final released = _activeId == id ? _released : null;
    return released?.future ?? Future<void>.value();
  }

  void finish(String id) {
    // A stale finalizer can never release a newer capture's lease.
    if (_activeId != id) return;
    final released = _released;
    _activeId = null;
    _released = null;
    if (released != null && !released.isCompleted) released.complete();
  }
}

'''
          text = text.replace(scheduler_anchor, barrier + scheduler_anchor, 1)
          domain.write_text(text)

          service = Path('lib/services/medicine_intake_service.dart')
          text = service.read_text()
          field_anchor = "  Future<void> _intakeWrites = Future.value();\n  bool _running = false, _paused = false, _appActive = true;"
          field_replacement = "  Future<void> _intakeWrites = Future.value();\n  final _workBarrier = MedicineIntakeWorkBarrier();\n  bool _running = false, _paused = false, _appActive = true;"
          if text.count(field_anchor) != 1:
              raise SystemExit('medicine_intake_service.dart field anchor mismatch')
          text = text.replace(field_anchor, field_replacement, 1)

          pump_anchor = r'''        try {
          if (job.status == 'reasoning') {
            _preferReasoning = false;
            await _reason(job);
          } else {
            _preferReasoning = true;
            job.status = 'processing';
            await _persist(job);
            if (job.kind == 'video') {
              await _videoStep(job);
            } else {
              await _photoStep(job);
            }
          }
          await _persist(job);
        } catch (e) {
          job.status = 'failed';
          job.error = e.toString();
          await _persist(job);
        }
'''
          pump_replacement = r'''        _workBarrier.begin(job.id);
        try {
          try {
            if (job.status == 'reasoning') {
              _preferReasoning = false;
              await _reason(job);
            } else {
              _preferReasoning = true;
              job.status = 'processing';
              await _persist(job);
              if (job.kind == 'video') {
                await _videoStep(job);
              } else {
                await _photoStep(job);
              }
            }
            await _persist(job);
          } catch (e) {
            job.status = 'failed';
            job.error = e.toString();
            await _persist(job);
          }
        } finally {
          // Terminal state may have been checkpointed earlier by the OCR/video
          // step. Release only after the worker's final row write/cleanup path is
          // completely finished so Retry/Dismiss cannot delete beneath it.
          _workBarrier.finish(job.id);
        }
'''
          if text.count(pump_anchor) != 1:
              raise SystemExit('medicine_intake_service.dart pump anchor mismatch')
          text = text.replace(pump_anchor, pump_replacement, 1)

          terminal_anchor = r'''  Future<void> retry(MedicineIntakeJob job) async {
    if (!job.terminal) return;
    if (job.kind == 'video' &&
        job.path.isNotEmpty &&
        job.cursorMs < job.durationMs) {
      job.status = 'queued';
    } else if (job.drafts.isNotEmpty) {
      job.modelId = await LocalBrainRoutePolicy.captureModelId(
        LocalAiService.instance,
      );
      job.aiIndex = 0;
      job.status = job.modelId == null ? 'review' : 'reasoning';
    } else {
      job.status = 'queued';
    }
    job.error = '';
    persistenceError = '';
    await _persist(job);
    _kick();
  }

  Future<void> dismiss(MedicineIntakeJob job) async {
    if (!job.terminal) {
      throw StateError('Pause/finish processing before dismissing a capture.');
    }
    await _database!.delete('jobs', where: 'id=?', whereArgs: [job.id]);
    _jobs.remove(job);
    if (job.path.isNotEmpty && job.path == _capturePath(job.id, job.kind)) {
      final file = File(job.path);
      if (await file.exists()) await file.delete();
    }
    notifyListeners();
  }
'''
          terminal_replacement = r'''  Future<void> retry(MedicineIntakeJob job) async {
    // A durable terminal checkpoint can become visible before the worker has
    // finished source cleanup/final persistence. Wait only for this exact job;
    // unrelated captures continue to enqueue and process independently.
    await _workBarrier.wait(job.id);
    await _enqueue(() async {
      if (!_jobs.contains(job) || !job.terminal) return;
      if (job.kind == 'video' &&
          job.path.isNotEmpty &&
          job.cursorMs < job.durationMs) {
        job.status = 'queued';
      } else if (job.drafts.isNotEmpty) {
        job.modelId = await LocalBrainRoutePolicy.captureModelId(
          LocalAiService.instance,
        );
        job.aiIndex = 0;
        job.status = job.modelId == null ? 'review' : 'reasoning';
      } else {
        job.status = 'queued';
      }
      job.error = '';
      persistenceError = '';
      await _persist(job);
    });
    _kick();
  }

  Future<void> dismiss(MedicineIntakeJob job) async {
    await _workBarrier.wait(job.id);
    await _enqueue(() async {
      if (!_jobs.contains(job)) return;
      if (!job.terminal) {
        throw StateError('Pause/finish processing before dismissing a capture.');
      }
      final deleted = await _database!.delete(
        'jobs',
        where: 'id=?',
        whereArgs: [job.id],
      );
      if (deleted != 1) {
        throw StateError('Capture draft could not be dismissed safely.');
      }
      _jobs.remove(job);

      // SQLite owns dismissal. Source-file cleanup is housekeeping and must not
      // turn a successfully removed durable job into a false dismissal failure.
      if (job.path.isNotEmpty && job.path == _capturePath(job.id, job.kind)) {
        try {
          final file = File(job.path);
          if (await file.exists()) await file.delete();
        } catch (_) {}
      }
      notifyListeners();
    });
  }
'''
          if text.count(terminal_anchor) != 1:
              raise SystemExit('medicine_intake_service.dart terminal-action anchor mismatch')
          text = text.replace(terminal_anchor, terminal_replacement, 1)
          service.write_text(text)

          test = Path('test/medicine_intake_concurrency_test.dart')
          test.write_text(r'''import 'package:flutter_test/flutter_test.dart';

import '../lib/domain/medicine_intake.dart';

void main() {
  test('terminal action waits for the exact worker-owned capture', () async {
    final barrier = MedicineIntakeWorkBarrier();
    barrier.begin('capture-a');

    var released = false;
    final waiter = barrier.wait('capture-a').then((_) => released = true);
    await Future<void>.delayed(Duration.zero);
    expect(released, isFalse);

    barrier.finish('capture-a');
    await waiter;
    expect(released, isTrue);
  });

  test('unrelated capture never waits behind the active worker lease', () async {
    final barrier = MedicineIntakeWorkBarrier();
    barrier.begin('capture-a');

    await barrier
        .wait('capture-b')
        .timeout(const Duration(milliseconds: 100));
    barrier.finish('capture-a');
  });

  test('stale finalizer cannot release a newer capture lease', () async {
    final barrier = MedicineIntakeWorkBarrier();
    barrier.begin('capture-a');
    barrier.finish('capture-a');
    barrier.begin('capture-b');

    var released = false;
    final waiter = barrier.wait('capture-b').then((_) => released = true);
    barrier.finish('capture-a');
    await Future<void>.delayed(Duration.zero);
    expect(released, isFalse);

    barrier.finish('capture-b');
    await waiter;
    expect(released, isTrue);
  });
}
''')

          doc = Path('docs/CODEBASE_TREE.md')
          text = doc.read_text()
          heading = '## Intake finalization intersection\n'
          if heading not in text:
              text += r'''

## Intake finalization intersection

The capture queue has an intentional two-phase durability boundary:

`OCR/video evidence -> durable terminal/reasoning checkpoint -> private source cleanup -> final row checkpoint -> worker lease release -> Retry/Dismiss`

A terminal card may render after the first checkpoint, before the worker has
finished the final cleanup/write. `MedicineIntakeWorkBarrier` binds that tiny
window to the exact job ID. Retry/Dismiss wait only for that job and then enter
the existing serialized intake-write lane, preventing delete/update races without
blocking unrelated captures or adding a second queue engine. Dismissal treats
SQLite row removal as authoritative and source-file deletion as best-effort
housekeeping.
'''
          doc.write_text(text)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format and verify full application
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/domain/medicine_intake.dart lib/services/medicine_intake_service.dart test/medicine_intake_concurrency_test.dart
          flutter pub get
          dart analyze lib test tool third_party/lib_llama_cpp/lib
          flutter test test/medicine_intake_concurrency_test.dart --reporter expanded
          flutter test --reporter expanded
          flutter build apk --debug --no-pub
      - name: Commit verified surgical patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock 2>/dev/null || true
          git config user.name 'Aaris Pharmacy Upgrade Bot'
          git config user.email 'warishakhan3548@gmail.com'
          git rm .github/workflows/aaris-intake-finalization-guard.yml
          git add lib/domain/medicine_intake.dart lib/services/medicine_intake_service.dart test/medicine_intake_concurrency_test.dart docs/CODEBASE_TREE.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source upgrade diff produced'; exit 1; }
          git commit -m 'Serialize intake terminal actions with worker finalization'
          git push origin HEAD:aaris-intake-finalization-guard
