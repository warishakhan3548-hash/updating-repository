name: Build Quran core content pack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-quran-core-pack.yml'
      - 'source-vault/registry.json'
      - 'source-vault/quran/tanzil/1.1/uthmani-marks-sajdah-rub/**'
      - 'schemas/content_v1.sql'
      - 'tools/quran_core.py'
      - 'tools/build_quran_core.py'
      - 'tools/verify_quran_core_pack.py'
      - 'tools/pack_gate.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-quran-core-1-0-2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build and publish only from a stable main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            echo "Quran pack attempt $attempt"

            git fetch origin main
            git reset --hard origin/main
            git clean -fdx -- content-packs/quran-core/1.0.2

            if [[ -f content-packs/quran-core/1.0.2/manifest.json && -f content-packs/quran-core/1.0.2/content.sqlite && -f content-packs/quran-core/1.0.2/NOTICE.txt ]]; then
              echo 'Quran core pack already exists on current main; validating existing immutable pack.'
              python tools/vault_gate.py source-vault/registry.json
              python tools/pack_gate.py \
                source-vault/registry.json \
                content-packs/quran-core/1.0.2/manifest.json
              exit 0
            fi

            if [[ -e content-packs/quran-core/1.0.2/manifest.json || -e content-packs/quran-core/1.0.2/content.sqlite || -e content-packs/quran-core/1.0.2/NOTICE.txt ]]; then
              echo 'Partial Quran core pack detected; rebuilding the derived pack from pinned inputs.'
              rm -rf content-packs/quran-core/1.0.2
            fi

            python tools/vault_gate.py source-vault/registry.json
            python tools/validate_schemas.py
            python -m unittest discover -s tests -v
            python tools/build_quran_core.py
            python tools/pack_gate.py \
              source-vault/registry.json \
              content-packs/quran-core/1.0.2/manifest.json

            BASE_SHA="$(git rev-parse HEAD)"
            git fetch origin main
            REMOTE_SHA="$(git rev-parse origin/main)"

            if [[ "$BASE_SHA" != "$REMOTE_SHA" ]]; then
              echo "main moved during build ($BASE_SHA -> $REMOTE_SHA); rebuilding from latest main."
              continue
            fi

            git add content-packs/quran-core/1.0.2/manifest.json
            git add content-packs/quran-core/1.0.2/NOTICE.txt
            git add -f content-packs/quran-core/1.0.2/content.sqlite
            git commit -m 'Build Quran core content pack 1.0.2'

            if git push origin HEAD:main; then
              exit 0
            fi

            echo 'Push raced with another main update; rebuilding from latest main.'
          done

          echo 'Could not obtain a stable main window after 5 attempts.' >&2
          exit 1
