name: Build Quran core content pack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-quran-core-pack.yml'
      - 'source-vault/registry.json'
      - 'source-vault/quran/tanzil/1.1/uthmani-marks-sajdah-rub/**'
      - 'schemas/content_v1.sql'
      - 'tools/quran_core.py'
      - 'tools/quran_canonical.py'
      - 'tools/build_quran_canonical.py'
      - 'tools/build_quran_core.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-quran-core-1-1-0
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'

      - name: Build and publish only from a stable main
        shell: bash
        run: |
          set -euo pipefail

          CANONICAL_DIR='canonical/quran-core/1.0.0'
          PACK_DIR='content-packs/quran-core/1.1.0'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            echo "Quran canonical/pack attempt $attempt"

            git fetch origin main
            git reset --hard origin/main
            git clean -fdx -- "$CANONICAL_DIR" "$PACK_DIR"

            canonical_complete=false
            pack_complete=false
            if [[ -f "$CANONICAL_DIR/manifest.json" && -f "$CANONICAL_DIR/ayahs.jsonl" ]]; then
              canonical_complete=true
            fi
            if [[ -f "$PACK_DIR/manifest.json" && -f "$PACK_DIR/content.sqlite" && -f "$PACK_DIR/NOTICE.txt" ]]; then
              pack_complete=true
            fi

            if [[ "$canonical_complete" == true && "$pack_complete" == true ]]; then
              echo 'Canonical Quran layer and Quran core 1.1.0 already exist; validating immutable outputs.'
              python tools/vault_gate.py source-vault/registry.json
              python tools/pack_gate.py source-vault/registry.json "$PACK_DIR/manifest.json"
              exit 0
            fi

            if [[ -e "$CANONICAL_DIR" || -e "$PACK_DIR" ]]; then
              echo 'Partial derived Quran outputs detected; rebuilding them from pinned Source Vault bytes.'
              rm -rf "$CANONICAL_DIR" "$PACK_DIR"
            fi

            python tools/vault_gate.py source-vault/registry.json
            python tools/validate_schemas.py
            python -m unittest discover -s tests -v
            python tools/build_quran_canonical.py
            python tools/build_quran_core.py
            python tools/pack_gate.py source-vault/registry.json "$PACK_DIR/manifest.json"

            BASE_SHA="$(git rev-parse HEAD)"
            git fetch origin main
            REMOTE_SHA="$(git rev-parse origin/main)"

            if [[ "$BASE_SHA" != "$REMOTE_SHA" ]]; then
              echo "main moved during build ($BASE_SHA -> $REMOTE_SHA); rebuilding from latest main."
              continue
            fi

            git add "$CANONICAL_DIR/manifest.json" "$CANONICAL_DIR/ayahs.jsonl"
            git add "$PACK_DIR/manifest.json" "$PACK_DIR/NOTICE.txt"
            git add -f "$PACK_DIR/content.sqlite"
            git commit -m 'Build Quran canonical layer and core pack 1.1.0'

            if git push origin HEAD:main; then
              exit 0
            fi

            echo 'Push raced with another main update; rebuilding from latest main.'
          done

          echo 'Could not obtain a stable main window after 5 attempts.' >&2
          exit 1
