name: Aaris expiry-risk intelligence upgrade
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
concurrency:
  group: aaris-expiry-risk-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  upgrade-and-verify:
    if: github.head_ref == 'upgrade/aaris-operational-brain-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/aaris-operational-brain-20260910
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply surgical expiry-risk source upgrade
        run: python3 tool/aaris_expiry_risk_upgrade.py
      - name: Remove one-shot upgrade machinery
        run: git rm tool/aaris_expiry_risk_upgrade.py .github/workflows/aaris-expiry-risk-upgrade.yml
      - name: Format changed Dart sources
        run: dart format lib/domain/attention.dart lib/domain/stock_risk.dart lib/ui/attention_screen.dart lib/ui/brain_screen.dart test/stock_risk_test.dart
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Full regression suite
        run: flutter test --reporter expanded
      - name: Remove generated untracked Android registrant
        run: rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
      - name: Commit verified risk engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add deterministic FEFO expiry-waste intelligence"
          git push origin "HEAD:upgrade/aaris-operational-brain-20260910"
