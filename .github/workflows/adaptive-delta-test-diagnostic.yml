name: Adaptive Delta Test Diagnostic

on:
  push:
    branches:
      - upgrade/v1.8.39-adaptive-delta-screen

permissions:
  contents: read

jobs:
  test-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/v1.8.39-adaptive-delta-screen
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6

      - name: Replay verified integration patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/adaptive-delta-integrate.yml').read_text().splitlines()
          names = [
              'Patch control capability protocol',
              'Patch controller capability advertisement',
              'Patch host adaptive recovery policy',
              'Patch fallback WebRTC transport',
              'Harden authoritative fallback reference model',
              'Patch controller atomic delta compositor',
              'Bump version and add capability regression test',
          ]
          for name in names:
              marker = f'      - name: {name}'
              start = workflow.index(marker)
              run_index = None
              for i in range(start + 1, len(workflow)):
                  if workflow[i].startswith('      - name:'):
                      break
                  if workflow[i] == '        run: |':
                      run_index = i
                      break
              if run_index is None:
                  raise SystemExit(f'missing run block: {name}')
              body = []
              for line in workflow[run_index + 1:]:
                  if line.startswith('      - name:'):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif line.strip() == '':
                      body.append('')
                  else:
                      break
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', '\n'.join(body) + '\n'],
                  check=True
              )
          PY

      - name: Run unit tests with focused diagnostics
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest --stacktrace > /tmp/tests.log 2>&1
          code=$?
          echo "=== focused test diagnostics ==="
          grep -E "(FAILED|AssertionError|expected:<|expected:|but was|FrameDelta|FallbackDelta|CapabilityTest|tests completed|There were failing tests|FAILURE:)" /tmp/tests.log | tail -n 220 || true
          echo "=== final gradle lines ==="
          tail -n 80 /tmp/tests.log
          exit "$code"
