name: Aaris post-upgrade Android verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aaris-post-upgrade-android-verify.yml
permissions:
  contents: write
concurrency:
  group: aaris-post-upgrade-android-verify
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.head_commit.message == 'Verify Aaris Brain upgrade on Android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Brain safety regressions
        run: flutter test test/aaris_brain_command_safety_test.dart test/brain_command_safety_widget_test.dart test/app_brain_test.dart test/brain_screen_test.dart --reporter expanded
      - name: Compile Android integration
        run: flutter build apk --debug --no-pub
      - name: Verify clean source tree
        run: git diff --check
      - name: Remove one-shot verification workflow
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo 'main advanced during verification; refusing to overwrite concurrent work.' >&2
            exit 1
          }
          rm .github/workflows/aaris-post-upgrade-android-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/aaris-post-upgrade-android-verify.yml
          git commit -m 'Remove one-shot Android verification workflow [skip ci]'
          git push origin HEAD:main