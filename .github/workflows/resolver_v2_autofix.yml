name: Resolver V2 Autofix
on:
  push:
    branches:
      - aaris-medicine-resolver-v2
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aaris-medicine-resolver-v2
          fetch-depth: 0
      - name: Apply exact patches
        run: python3 tool/resolver_v2_autofix.py
      - name: Commit patched branch
        run: |
          git config user.name "Aaris Pharmacy CI Surgeon"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden resolver V2 safety and runtime teardown"
          git push origin HEAD:aaris-medicine-resolver-v2
