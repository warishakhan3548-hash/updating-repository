name: Temporary verified release APK

on:
  push:
    branches: [ temp-build-release-23b91031-20260923 ]
    paths:
      - '.github/workflows/temp-release-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify repository-local content contracts
        run: |
          python3 tools/check_offline_contract.py
          python3 tools/check.py

      - name: Make release variant installable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          old="buildTypes { release { minifyEnabled false; debuggable false } }"
          new="buildTypes { release { minifyEnabled false; debuggable false; signingConfig signingConfigs.debug } }"
          if old not in s:
              raise SystemExit("Expected release buildTypes block not found")
          p.write_text(s.replace(old,new,1))
          PY

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify release APK and offline audio boundary
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          ! grep -q "application-debuggable" /tmp/badging.txt
          unzip -l "$APK" | tee /tmp/apk-files.txt
          grep -q "assets/quran-audio-word-catalog.json" /tmp/apk-files.txt
          ! grep -E "assets/.*\.(aqp|opus|pack|pb)$" /tmp/apk-files.txt
          mkdir -p release-apk
          cp "$APK" release-apk/Aaris-Quran-0.4.0-release.apk
          sha256sum release-apk/Aaris-Quran-0.4.0-release.apk | tee release-apk/SHA256.txt
          ls -lh release-apk/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aaris-quran-0.4.0-release
          path: release-apk/
          if-no-files-found: error
          retention-days: 7
