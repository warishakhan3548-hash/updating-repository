name: Temporary release APK build

on:
  pull_request:
    branches: [ main ]

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          chmod +x gradlew

      - name: Verify source and Android compilation
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/build_content.py
          python3 tools/check.py \
            --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" \
            --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon :app:assembleRelease
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -ls

      - name: Align release APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          mkdir -p /tmp/aaris-release
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 "$APK" /tmp/aaris-release/Aaris-Quran-0.4.0-release-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 /tmp/aaris-release/Aaris-Quran-0.4.0-release-aligned-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/aaris-release/apksigner.jar
          sha256sum /tmp/aaris-release/* > /tmp/aaris-release/SHA256SUMS.txt

      - name: Upload unsigned release handoff
        uses: actions/upload-artifact@v4
        with:
          name: aaris-quran-0.4.0-unsigned-handoff
          path: /tmp/aaris-release/
          if-no-files-found: error
          retention-days: 1
