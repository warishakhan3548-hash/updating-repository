name: Aaris conversational autonomy upgrade
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aaris-conversational-autonomy-upgrade.yml
permissions:
  contents: write
concurrency:
  group: aaris-conversational-autonomy-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.event.head_commit.message == 'Start Aaris conversational autonomy upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply conversational autonomy and safety upgrade
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one patch anchor, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          clarification = dedent(r'''
          import 'app_brain.dart';
          import 'medicine.dart';

          enum BrainChoiceResolutionKind {
            noMatch,
            ambiguous,
            cancelled,
            stale,
            resolved,
          }

          class BrainChoiceResolution {
            const BrainChoiceResolution(this.kind, {this.stockId});

            final BrainChoiceResolutionKind kind;
            final String? stockId;
          }

          class BrainChoiceCandidate {
            BrainChoiceCandidate._({
              required this.id,
              required this.revision,
              required this.title,
              required this.brand,
              required this.batchNumber,
              required this.barcode,
              required this.block,
              required this.row,
              required this.vertical,
              required this.location,
              required this.address,
            }) : selectorTokens = Set.unmodifiable(
                   _selectorTokens(<String>[
                     title,
                     brand,
                     batchNumber,
                     barcode,
                     block,
                     row,
                     vertical,
                     location,
                     address,
                   ]),
                 );

            factory BrainChoiceCandidate.fromMedicine(Medicine medicine) =>
                BrainChoiceCandidate._(
                  id: medicine.id,
                  revision: medicine.revision,
                  title: medicine.title,
                  brand: medicine.brand,
                  batchNumber: medicine.batchNumber,
                  barcode: medicine.barcode,
                  block: medicine.block,
                  row: medicine.row,
                  vertical: medicine.vertical,
                  location: medicine.location,
                  address: medicine.address,
                );

            final String id;
            final int revision;
            final String title;
            final String brand;
            final String batchNumber;
            final String barcode;
            final String block;
            final String row;
            final String vertical;
            final String location;
            final String address;
            final Set<String> selectorTokens;

            String get displayCue {
              final facts = <String>[
                title,
                if (batchNumber.trim().isNotEmpty) 'Batch ${batchNumber.trim()}',
                if (barcode.trim().isNotEmpty) 'Barcode ${barcode.trim()}',
                if (address.trim().isNotEmpty) address.trim(),
              ];
              return facts.join(' · ');
            }
          }

          /// Session-only clarification for an already-ranked local candidate set.
          ///
          /// Aaris never fuzzy-selects from this object. The user must choose an
          /// exact displayed ordinal or an exact discriminator such as batch,
          /// barcode, block/row/vertical or a unique visible cue. Every candidate
          /// is revision-bound; any candidate-row change invalidates the whole
          /// pending choice so a stale ordinal can never target a different state.
          class PendingBrainChoice {
            PendingBrainChoice({
              required this.intent,
              required Iterable<Medicine> candidates,
              required this.createdAt,
              this.ttl = const Duration(minutes: 5),
            }) : candidates = List.unmodifiable(
                   candidates.map(BrainChoiceCandidate.fromMedicine),
                 ) {
              if (this.candidates.length < 2 || this.candidates.length > 12) {
                throw const FormatException(
                  'Aaris clarification needs between 2 and 12 exact candidates.',
                );
              }
              if (ttl <= Duration.zero || ttl > const Duration(minutes: 15)) {
                throw const FormatException('Invalid Aaris clarification lifetime.');
              }
              final ids = this.candidates.map((candidate) => candidate.id).toSet();
              if (ids.length != this.candidates.length) {
                throw const FormatException(
                  'Aaris clarification cannot contain duplicate stock IDs.',
                );
              }
              if (this.candidates.any((candidate) => candidate.revision < 1)) {
                throw const FormatException(
                  'Aaris clarification requires revisioned stock rows.',
                );
              }
              if (intent.action != AppBrainAction.search &&
                  !intent.needsMedicineTarget) {
                throw const FormatException(
                  'This Aaris action cannot be resumed from a medicine choice.',
                );
              }
            }

            final AppBrainIntent intent;
            final List<BrainChoiceCandidate> candidates;
            final DateTime createdAt;
            final Duration ttl;

            BrainChoiceResolution resolve(
              String raw, {
              required Map<String, Medicine> records,
              required DateTime now,
            }) {
              final text = _choiceText(raw);
              if (text.isEmpty || raw.length > 240) {
                return const BrainChoiceResolution(
                  BrainChoiceResolutionKind.noMatch,
                );
              }
              if (_isCancelChoice(text)) {
                return const BrainChoiceResolution(
                  BrainChoiceResolutionKind.cancelled,
                );
              }

              final age = now.difference(createdAt);
              if (age.isNegative || age > ttl || !_isCurrent(records)) {
                return const BrainChoiceResolution(
                  BrainChoiceResolutionKind.stale,
                );
              }

              final ordinal = _choiceOrdinal(text);
              if (ordinal != null) {
                if (ordinal < 1 || ordinal > candidates.length) {
                  return const BrainChoiceResolution(
                    BrainChoiceResolutionKind.noMatch,
                  );
                }
                return BrainChoiceResolution(
                  BrainChoiceResolutionKind.resolved,
                  stockId: candidates[ordinal - 1].id,
                );
              }

              final constrained = _labelledMatches(text);
              if (constrained != null) return _resultFor(constrained);

              final cueTokens = _genericCueTokens(text);
              if (cueTokens.isEmpty || cueTokens.join().length < 3) {
                return const BrainChoiceResolution(
                  BrainChoiceResolutionKind.noMatch,
                );
              }
              final matches = candidates
                  .where(
                    (candidate) =>
                        cueTokens.every(candidate.selectorTokens.contains),
                  )
                  .toList(growable: false);
              return _resultFor(matches);
            }

            bool _isCurrent(Map<String, Medicine> records) {
              for (final candidate in candidates) {
                final live = records[candidate.id];
                if (live == null ||
                    live.archived ||
                    live.revision != candidate.revision) {
                  return false;
                }
              }
              return true;
            }

            List<BrainChoiceCandidate>? _labelledMatches(String text) {
              final constraints = <String, String>{};

              void capture(String key, RegExp expression) {
                final matches = expression.allMatches(text).toList(growable: false);
                if (matches.length > 1) {
                  constraints['__ambiguous__'] = '1';
                  return;
                }
                if (matches.isEmpty) return;
                final value = _trimChoiceGlue(matches.single.group(1) ?? '');
                if (value.isNotEmpty) constraints[key] = value;
              }

              capture(
                'batch',
                RegExp(
                  r'(?:^| )(?:batch|बैच)(?: (?:no|number|नंबर))?[:# -]*([a-z0-9ऀ-ॿ._/-]{1,60})',
                  caseSensitive: false,
                  unicode: true,
                ),
              );
              capture(
                'barcode',
                RegExp(
                  r'(?:^| )(?:barcode|bar code|बारकोड)[:# -]*([a-z0-9._/-]{1,80})',
                  caseSensitive: false,
                  unicode: true,
                ),
              );
              capture(
                'block',
                RegExp(
                  r'(?:^| )(?:block|ब्लॉक)[:# -]*([a-z0-9ऀ-ॿ._/-]{1,40})',
                  caseSensitive: false,
                  unicode: true,
                ),
              );
              capture(
                'row',
                RegExp(
                  r'(?:^| )(?:row|रो|पंक्ति)[:# -]*([a-z0-9ऀ-ॿ._/-]{1,40})',
                  caseSensitive: false,
                  unicode: true,
                ),
              );
              capture(
                'vertical',
                RegExp(
                  r'(?:^| )(?:vertical|vert|वर्टिकल)[:# -]*([a-z0-9ऀ-ॿ._/-]{1,40})',
                  caseSensitive: false,
                  unicode: true,
                ),
              );
              capture(
                'location',
                RegExp(
                  r'(?:^| )(?:location|rack|shelf|लोकेशन|रैक|शेल्फ|जगह)[:# -]*([a-z0-9ऀ-ॿ._/-]{1,80})',
                  caseSensitive: false,
                  unicode: true,
                ),
              );

              if (constraints.containsKey('__ambiguous__')) {
                return const <BrainChoiceCandidate>[];
              }
              if (constraints.isEmpty) return null;

              bool exact(String left, String right) =>
                  _choiceText(left) == _choiceText(right);
              bool locationMatches(BrainChoiceCandidate candidate, String cue) {
                final normalized = _choiceText(cue);
                if (normalized.isEmpty) return false;
                final values = <String>[
                  candidate.location,
                  candidate.address,
                  candidate.block,
                  candidate.row,
                  candidate.vertical,
                ];
                for (final value in values) {
                  final clean = _choiceText(value);
                  if (clean == normalized || clean.split(' ').contains(normalized)) {
                    return true;
                  }
                }
                return false;
              }

              return candidates.where((candidate) {
                final batch = constraints['batch'];
                if (batch != null && !exact(candidate.batchNumber, batch)) return false;
                final barcode = constraints['barcode'];
                if (barcode != null && !exact(candidate.barcode, barcode)) return false;
                final block = constraints['block'];
                if (block != null && !exact(candidate.block, block)) return false;
                final row = constraints['row'];
                if (row != null && !exact(candidate.row, row)) return false;
                final vertical = constraints['vertical'];
                if (vertical != null && !exact(candidate.vertical, vertical)) {
                  return false;
                }
                final location = constraints['location'];
                if (location != null && !locationMatches(candidate, location)) {
                  return false;
                }
                return true;
              }).toList(growable: false);
            }

            BrainChoiceResolution _resultFor(
              List<BrainChoiceCandidate> matches,
            ) {
              if (matches.length == 1) {
                return BrainChoiceResolution(
                  BrainChoiceResolutionKind.resolved,
                  stockId: matches.single.id,
                );
              }
              if (matches.length > 1) {
                return const BrainChoiceResolution(
                  BrainChoiceResolutionKind.ambiguous,
                );
              }
              return const BrainChoiceResolution(
                BrainChoiceResolutionKind.noMatch,
              );
            }
          }

          String _choiceText(String raw) => _asciiDigits(
                raw.toLowerCase(),
              )
              .replaceAll(
                RegExp(r'[^a-z0-9ऀ-ॿ._/-]+', unicode: true),
                ' ',
              )
              .replaceAll(RegExp(r'\s+'), ' ')
              .trim();

          String _asciiDigits(String value) {
            const devanagari = '०१२३४५६७८९';
            final out = StringBuffer();
            for (final rune in value.runes) {
              final char = String.fromCharCode(rune);
              final index = devanagari.indexOf(char);
              out.write(index < 0 ? char : index.toString());
            }
            return out.toString();
          }

          bool _isCancelChoice(String text) {
            final reduced = text
                .split(' ')
                .where((token) => !_cancelGlue.contains(token))
                .join(' ');
            return _cancelChoices.contains(text) || _cancelChoices.contains(reduced);
          }

          int? _choiceOrdinal(String text) {
            final reduced = text
                .split(' ')
                .where((token) => !_ordinalGlue.contains(token))
                .join(' ');
            return _ordinals[reduced];
          }

          String _trimChoiceGlue(String value) {
            final tokens = _choiceText(value).split(' ').toList();
            while (tokens.isNotEmpty && _trailingChoiceGlue.contains(tokens.last)) {
              tokens.removeLast();
            }
            return tokens.join(' ');
          }

          Set<String> _genericCueTokens(String text) => text
              .split(' ')
              .where(
                (token) =>
                    token.isNotEmpty &&
                    !_genericChoiceGlue.contains(token) &&
                    !_ordinals.containsKey(token),
              )
              .toSet();

          Set<String> _selectorTokens(Iterable<String> values) {
            final output = <String>{};
            for (final value in values) {
              final clean = _choiceText(value);
              if (clean.isEmpty) continue;
              output.add(clean);
              output.addAll(
                clean.split(' ').where(
                  (token) => token.isNotEmpty && !_selectorNoise.contains(token),
                ),
              );
            }
            return output;
          }

          const _cancelChoices = <String>{
            'cancel',
            'cancel it',
            'never mind',
            'nevermind',
            'leave it',
            'rehne do',
            'rehne dena',
            'chhodo',
            'chhod do',
            'रहने दो',
            'छोड़ो',
            'छोड़ दो',
            'कैंसल',
          };

          const _cancelGlue = <String>{
            'please',
            'plz',
            'bas',
            'ab',
            'karo',
            'kar',
            'do',
            'कृपया',
            'बस',
            'अब',
            'करो',
            'कर',
            'दो',
          };

          const _ordinals = <String, int>{
            '1': 1,
            '1st': 1,
            'first': 1,
            'pehla': 1,
            'pehli': 1,
            'पहला': 1,
            'पहली': 1,
            '2': 2,
            '2nd': 2,
            'second': 2,
            'dusra': 2,
            'dusri': 2,
            'doosra': 2,
            'doosri': 2,
            'दूसरा': 2,
            'दूसरी': 2,
            '3': 3,
            '3rd': 3,
            'third': 3,
            'teesra': 3,
            'teesri': 3,
            'तीसरा': 3,
            'तीसरी': 3,
            '4': 4,
            '4th': 4,
            'fourth': 4,
            'chautha': 4,
            'चौथा': 4,
            '5': 5,
            '5th': 5,
            'fifth': 5,
            'paanchva': 5,
            'पांचवां': 5,
            '6': 6,
            '6th': 6,
            'sixth': 6,
            'chhatha': 6,
            'छठा': 6,
            '7': 7,
            '7th': 7,
            'seventh': 7,
            'saatva': 7,
            'सातवां': 7,
            '8': 8,
            '8th': 8,
            'eighth': 8,
            'aathva': 8,
            'आठवां': 8,
            '9': 9,
            '9th': 9,
            'ninth': 9,
            'nauva': 9,
            'नौवां': 9,
            '10': 10,
            '10th': 10,
            'tenth': 10,
            '11': 11,
            '11th': 11,
            'eleventh': 11,
            '12': 12,
            '12th': 12,
            'twelfth': 12,
          };

          const _ordinalGlue = <String>{
            'option',
            'number',
            'no',
            'one',
            'the',
            'choose',
            'select',
            'pick',
            'medicine',
            'stock',
            'entry',
            'wali',
            'waali',
            'wala',
            'waala',
            'ko',
            'please',
            'karo',
            'kar',
            'do',
            'ऑप्शन',
            'नंबर',
            'वाली',
            'वाला',
            'मेडिसिन',
            'स्टॉक',
            'एंट्री',
            'को',
            'चुनो',
            'सेलेक्ट',
            'सिलेक्ट',
            'करो',
            'कर',
            'दो',
          };

          const _genericChoiceGlue = <String>{
            ..._ordinalGlue,
            'batch',
            'barcode',
            'bar',
            'code',
            'block',
            'row',
            'vertical',
            'vert',
            'location',
            'rack',
            'shelf',
            'with',
            'has',
            'jo',
            'jisme',
            'jis',
            'ka',
            'ki',
            'mein',
            'me',
            'par',
            'pe',
            'बैच',
            'बारकोड',
            'ब्लॉक',
            'रो',
            'पंक्ति',
            'वर्टिकल',
            'लोकेशन',
            'रैक',
            'शेल्फ',
            'जगह',
            'जिसमें',
            'जिस',
            'का',
            'की',
            'में',
            'पर',
            'पे',
          };

          const _trailingChoiceGlue = <String>{
            'wali',
            'waali',
            'wala',
            'waala',
            'one',
            'medicine',
            'stock',
            'entry',
            'choose',
            'select',
            'karo',
            'kar',
            'do',
            'वाली',
            'वाला',
            'मेडिसिन',
            'स्टॉक',
            'एंट्री',
            'चुनो',
            'सेलेक्ट',
            'सिलेक्ट',
            'करो',
            'कर',
            'दो',
          };

          const _selectorNoise = <String>{
            'batch',
            'barcode',
            'block',
            'row',
            'vertical',
            'location',
            'rack',
            'shelf',
            'batch',
            'बैच',
            'बारकोड',
            'ब्लॉक',
            'रो',
            'वर्टिकल',
            'लोकेशन',
            'रैक',
            'शेल्फ',
          };
          ''').lstrip()
          Path('lib/domain/brain_clarification.dart').write_text(
              clarification,
              encoding='utf-8',
          )

          brain = 'lib/ui/brain_screen.dart'
          replace_once(
              brain,
              "import '../domain/brain_operations.dart';\n",
              "import '../domain/brain_clarification.dart';\nimport '../domain/brain_operations.dart';\n",
          )
          replace_once(
              brain,
              "  bool _busy = false, _voiceOpening = false;\n  String _reply =\n",
              "  bool _busy = false, _voiceOpening = false;\n  PendingBrainChoice? _pendingChoice;\n  String _reply =\n",
          )
          replace_once(
              brain,
              dedent('''\
                final intent = parseAppBrainIntent(raw);
                setState(() {
                  _busy = true;
                  _reply = 'Understanding command…';
                  if (supplied != null) _command.text = supplied;
                });
                try {
                  await _execute(intent, raw);
              '''),
              dedent('''\
                setState(() {
                  _busy = true;
                  _reply = 'Understanding command…';
                  if (supplied != null) _command.text = supplied;
                });
                try {
                  if (await _continuePendingChoice(raw)) return;
                  final intent = parseAppBrainIntent(raw);
                  await _execute(intent, raw);
              '''),
          )

          continuation_methods = dedent('''\
            Future<bool> _continuePendingChoice(String raw) async {
              final pending = _pendingChoice;
              if (pending == null) return false;
              final result = pending.resolve(
                raw,
                records: widget.controller.snapshot.records,
                now: widget.controller.clock(),
              );
              switch (result.kind) {
                case BrainChoiceResolutionKind.cancelled:
                  _pendingChoice = null;
                  if (mounted) {
                    setState(
                      () => _reply =
                          'Pending medicine choice cancelled. Nothing changed.',
                    );
                  }
                  return true;
                case BrainChoiceResolutionKind.stale:
                  _pendingChoice = null;
                  if (mounted) {
                    setState(
                      () => _reply =
                          'That candidate list is no longer current because one of its stock rows changed or the choice expired. Run the medicine command again; Aaris will rank the live database instead of reusing a stale option number.',
                    );
                  }
                  return true;
                case BrainChoiceResolutionKind.resolved:
                  final stockId = result.stockId;
                  final record = stockId == null
                      ? null
                      : widget.controller.snapshot.records[stockId];
                  _pendingChoice = null;
                  if (record == null || record.archived) {
                    if (mounted) {
                      setState(
                        () => _reply =
                            'That exact stock row is no longer active. Nothing changed; run the command again against the live Medicine Database.',
                      );
                    }
                    return true;
                  }
                  await _resumePendingChoice(pending.intent, record);
                  return true;
                case BrainChoiceResolutionKind.ambiguous:
                  if (mounted) {
                    setState(
                      () => _reply =
                          '${_pendingChoicePrompt(pending)} That cue still matches more than one displayed row, so Aaris did not guess.',
                    );
                  }
                  return true;
                case BrainChoiceResolutionKind.noMatch:
                  final newIntent = parseAppBrainIntent(raw);
                  if (newIntent.action != AppBrainAction.unknown) {
                    // A fresh explicit app command replaces the old clarification.
                    // A bare ordinal/cue is consumed above before this branch.
                    _pendingChoice = null;
                    return false;
                  }
                  if (mounted) {
                    setState(() => _reply = _pendingChoicePrompt(pending));
                  }
                  return true;
              }
            }

            Future<void> _resumePendingChoice(
              AppBrainIntent intent,
              Medicine record,
            ) async {
              _remember(record);
              final focus = intent.briefFocus;
              if (focus != null) {
                _answerOperationalBrief(record, focus);
                return;
              }
              if (intent.action == AppBrainAction.search) {
                widget.onOpenSection(AppSection.stock);
                if (mounted) {
                  setState(
                    () => _reply =
                        '${record.title} selected from the exact pending options. This row is now the session context.',
                  );
                }
                await Future<void>.delayed(Duration.zero);
                if (mounted) {
                  await openEditor(context, widget.controller, record: record);
                }
                return;
              }
              await _openActionTarget(
                intent.action,
                record,
                requestedQuantity: intent.quantity,
                locationPatch: intent.locationPatch,
                removalReason: intent.removalReason,
              );
            }

            String _pendingChoicePrompt(PendingBrainChoice pending) {
              final cues = <String>[];
              for (var i = 0; i < pending.candidates.length && i < 4; i++) {
                cues.add('${i + 1}: ${pending.candidates[i].displayCue}');
              }
              final more = pending.candidates.length > 4
                  ? ' · +${pending.candidates.length - 4} more'
                  : '';
              return 'Aaris still has ${pending.candidates.length} exact local candidates waiting. Say “first one”, “second one”, an exact batch/barcode/block/row/location, or “cancel”. ${cues.join(' · ')}$more';
            }

          ''')
          replace_once(
              brain,
              '  Future<void> _execute(AppBrainIntent intent, String raw) async {\n',
              continuation_methods +
                  '  Future<void> _execute(AppBrainIntent intent, String raw) async {\n',
          )

          replace_once(
              brain,
              dedent('''\
                if (records.isEmpty) {
                  widget.onOpenSection(AppSection.stock);
                  if (mounted) setState(() => _reply = emptyReply);
                  return;
                }
                setState(
              '''),
              dedent('''\
                if (records.isEmpty) {
                  widget.onOpenSection(AppSection.stock);
                  if (mounted) setState(() => _reply = emptyReply);
                  return;
                }
                if (records.length > 1) {
                  _pendingChoice = PendingBrainChoice(
                    intent: AppBrainIntent(
                      action: action,
                      quantity: requestedQuantity,
                      briefFocus: briefFocus,
                      locationPatch: locationPatch,
                      removalReason: removalReason,
                    ),
                    candidates: records,
                    createdAt: widget.controller.clock(),
                  );
                } else {
                  _pendingChoice = null;
                }
                setState(
              '''),
          )

          replace_once(
              brain,
              dedent('''\
                          child: Column(
                            children: [
                              Padding(
                                padding: const EdgeInsets.fromLTRB(20, 16, 12, 10),
              '''),
              dedent('''\
                          child: Column(
                            children: [
                              Padding(
                                padding: const EdgeInsets.fromLTRB(20, 16, 12, 10),
              '''),
          )
          # Insert a hands-free clarification hint after the sheet header row.
          sheet_anchor = dedent('''\
