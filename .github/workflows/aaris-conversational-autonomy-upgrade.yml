"""
          new_item = """                  itemBuilder: (_, index) {
                    final record = records[index];
                    return Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        if (records.length > 1)
                          Padding(
                            padding: const EdgeInsets.fromLTRB(4, 7, 4, 2),
