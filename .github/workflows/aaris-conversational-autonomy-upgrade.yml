name: Aaris conversational autonomy upgrade
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aaris-conversational-autonomy-upgrade.yml
permissions:
  contents: write
concurrency:
  group: aaris-conversational-autonomy-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply surgical source upgrade
        shell: bash
        run: python3 tool/aaris_conversational_autonomy_upgrade.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format and verify the complete application
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/domain/brain_clarification.dart lib/domain/app_brain.dart lib/ui/brain_screen.dart test/brain_clarification_test.dart test/aaris_brain_command_safety_test.dart
          flutter pub get
          dart analyze lib test tool third_party/lib_llama_cpp/lib
          flutter test test/brain_clarification_test.dart test/aaris_brain_command_safety_test.dart test/brain_screen_test.dart --reporter expanded
          flutter test --reporter expanded
          flutter build apk --debug --no-pub
      - name: Commit only verified production source
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock 2>/dev/null || true
          git config user.name 'Aaris Pharmacy Upgrade Bot'
          git config user.email 'warishakhan3548@gmail.com'
          git rm -f tool/aaris_conversational_autonomy_upgrade.py .github/workflows/aaris-conversational-autonomy-upgrade.yml
          git add lib/domain/brain_clarification.dart lib/domain/app_brain.dart lib/ui/brain_screen.dart test/brain_clarification_test.dart test/aaris_brain_command_safety_test.dart docs/AARIS_CONVERSATIONAL_AUTONOMY_2026_09_10.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source upgrade diff produced'; exit 1; }
          git commit -m 'Upgrade Aaris Brain revision-safe conversational control [skip ci]'
          git push origin HEAD:main
