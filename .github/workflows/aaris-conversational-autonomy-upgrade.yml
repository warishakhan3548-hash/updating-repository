          # Aaris conversational autonomy upgrade — 10 September 2026

          ## Goal

          Make Aaris Brain behave more like a careful pharmacist assistant when language is
          natural or a medicine name resolves to several physical stock rows, without allowing
          AI/OCR/fuzzy search to gain mutation authority.

          ## Exact multi-turn clarification

          A ranked result list can now become a short-lived clarification context containing
          only the exact local stock IDs that were visibly offered. Each candidate carries its
          medicine-row revision. The user can close the list and answer with an option number
          (English/Hinglish/Hindi), or an exact batch, barcode, block, row, vertical or location
          cue. Resolution is deterministic exact matching only. A shared cue remains ambiguous.
          If any candidate row changes, disappears, is archived, the clock moves backwards, or
          the five-minute window expires, the whole clarification fails closed and must be
          rebuilt from the live Medicine Database.

          The pending context stores no inventory copy, quantity, price or hidden AI state and
          is never persisted. Resolving it only resumes the original existing Brain route; all
          Remove, SOLD, stock-adjustment, relocation and sale confirmations remain unchanged.

          ## Autonomous next-safe-task handoff

          The dependency-aware operating plan still decides what is ready. When the next ready
          task refers to one exact active stock row, Aaris Brain opens that row immediately
          instead of stopping at the queue. Deterministically expired stock may open its existing
          protected Expired-removal review with the reason preselected, but no write occurs until
          the pharmacist confirms. Reorder tasks open Order Review; multi-row integrity work stays
          in Needs Attention.

          ## Intent-firewall hardening

          Negative wording now includes avoid/refrain/leave-unchanged forms, and the removal
          grammar understands common gerunds/discard wording so those negatives cannot slip past
          the mutation-family detector. Deferred writes also fail closed for 24-hour clock times,
          calendar dates, relative durations, weekdays and common lunch/evening/daypart wording.
          These checks run before target search or navigation.

          ## Verification gate

          The upgrade workflow formats the touched Dart source, runs static analysis over app,
          tests, tools and vendored local-AI Dart code, runs the targeted Brain safety and
          clarification tests, runs the complete Flutter test suite, and builds a debug Android
          APK as a compile/integration gate before committing the source upgrade.
          ''').lstrip()
