name: Acquire Tanzil Quran source snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/acquire-tanzil-quran.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acquire-tanzil-quran-v1-1
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download exact official source and licence snapshot
        shell: bash
        run: |
          set -euo pipefail

          DEST='source-vault/quran/tanzil/1.1/uthmani-marks-sajdah-rub'
          ARTIFACT="$DEST/quran-uthmani.txt"
          LICENCE="$DEST/LICENSE_SOURCE.html"
          SOURCE_URL='https://tanzil.net/pub/download/index.php?quranType=uthmani&outType=txt-2&agree=true&marks=true&sajdah=true&rub=true'
          LICENCE_URL='https://tanzil.net/docs/Text_License'

          if [[ -e "$ARTIFACT" || -e "$LICENCE" ]]; then
            echo 'Refusing to overwrite an existing immutable Tanzil snapshot.' >&2
            exit 1
          fi

          mkdir -p "$DEST"

          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 --max-time 60 --retry 2 \
            --max-filesize 5000000 \
            "$SOURCE_URL" -o "$ARTIFACT"

          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 --max-time 60 --retry 2 \
            --max-filesize 1000000 \
            "$LICENCE_URL" -o "$LICENCE"

          bytes="$(wc -c < "$ARTIFACT" | tr -d ' ')"
          if (( bytes < 500000 || bytes > 5000000 )); then
            echo "Unexpected Tanzil artifact size: $bytes bytes" >&2
            exit 1
          fi

          grep -Fq 'Tanzil Quran Text (Uthmani, Version 1.1)' "$ARTIFACT"
          grep -Fq 'Creative Commons Attribution 3.0' "$ARTIFACT"
          grep -Fq 'CHANGING IT IS NOT ALLOWED' "$ARTIFACT"
          grep -Fq 'Creative Commons Attribution 3.0' "$LICENCE"
          grep -Fq 'CHANGING IT IS NOT ALLOWED' "$LICENCE"

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("source-vault/quran/tanzil/1.1/uthmani-marks-sajdah-rub/quran-uthmani.txt")
          text = path.read_text(encoding="utf-8")
          rows = []
          for line in text.splitlines():
              match = re.match(r"^(\d+)\|(\d+)\|(.*)$", line)
              if match:
                  rows.append((int(match.group(1)), int(match.group(2)), match.group(3)))

          if len(rows) != 6236:
              raise SystemExit(f"Expected 6236 ayah rows, found {len(rows)}")
          if rows[0][:2] != (1, 1):
              raise SystemExit(f"Unexpected first coordinate: {rows[0][:2]}")
          if rows[-1][:2] != (114, 6):
              raise SystemExit(f"Unexpected final coordinate: {rows[-1][:2]}")
          if any(not arabic.strip() for _, _, arabic in rows):
              raise SystemExit("Encountered empty ayah text")
          PY

      - name: Create checksum and provenance, then promote registry entry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          dest = Path("source-vault/quran/tanzil/1.1/uthmani-marks-sajdah-rub")
          artifact = dest / "quran-uthmani.txt"
          licence = dest / "LICENSE_SOURCE.html"
          provenance_path = dest / "provenance.json"
          checksum_path = dest / "sha256.txt"
          registry_path = Path("source-vault/registry.json")

          source_url = (
              "https://tanzil.net/pub/download/index.php?"
              "quranType=uthmani&outType=txt-2&agree=true&"
              "marks=true&sajdah=true&rub=true"
          )
          licence_url = "https://tanzil.net/docs/Text_License"

          raw = artifact.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          size = len(raw)
          retrieved_at = datetime.now(timezone.utc).isoformat(timespec="seconds")

          checksum_path.write_text(
              f"{digest}  {artifact.name}\n",
              encoding="utf-8",
          )

          provenance = {
              "schema_version": 1,
              "source_id": "quran.tanzil.uthmani.v1.1",
              "source_project": "Tanzil Project",
              "source_name": "Tanzil Quran Text",
              "original_url": source_url,
              "download_page": "https://tanzil.net/download/",
              "licence_url": licence_url,
              "version": "1.1",
              "edition": "Uthmani",
              "retrieved_at": retrieved_at,
              "sha256": digest,
              "byte_size": size,
              "licence_id": "CC-BY-3.0-with-source-specific-no-modification-terms",
              "redistribution_allowed": True,
              "modification_allowed": False,
              "attribution_required": True,
              "attribution": "Tanzil Project; link to https://tanzil.net/",
              "known_restrictions": [
                  "Distribute the Quran text verbatim; changing the text is not allowed.",
                  "Clearly indicate Tanzil Project as the source and link to tanzil.net.",
                  "Preserve the copyright notice in verbatim copies and derived files containing a substantial portion.",
              ],
              "download_configuration": {
                  "quranType": "uthmani",
                  "outType": "txt-2",
                  "agree": True,
                  "marks": True,
                  "sajdah": True,
                  "rub": True,
                  "sequential_tanween": False,
                  "tatweel_below_superscript_alef": False,
              },
              "vault_artifact": artifact.as_posix(),
              "licence_snapshot": licence.as_posix(),
              "checksum_file": checksum_path.as_posix(),
              "project_mirror": artifact.as_posix(),
          }
          provenance_path.write_text(
              json.dumps(provenance, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          source = next(
              item
              for item in registry["sources"]
              if item["source_id"] == "quran.tanzil.uthmani.v1.1"
          )
          if source["status"] == "production-approved":
              raise SystemExit("Refusing to mutate an already production-approved source")

          source.update(
              {
                  "original_url": source_url,
                  "status": "production-approved",
                  "redistribution_allowed": True,
                  "modification_allowed": False,
                  "attribution_required": True,
                  "vault_artifact": artifact.as_posix(),
                  "licence_snapshot": licence.as_posix(),
                  "provenance": provenance_path.as_posix(),
                  "sha256": digest,
                  "byte_size": size,
                  "notes": (
                      "Exact Tanzil Uthmani v1.1 txt-2 artifact preserved from the "
                      "official Tanzil endpoint with pause marks, sajdah signs and "
                      "rub-el-hizb signs. Sequential tanween and optional tatweel "
                      "features were not requested."
                  ),
              }
          )
          registry["verified_at"] = retrieved_at[:10]
          registry_path.write_text(
              json.dumps(registry, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python tools/vault_gate.py source-vault/registry.json
          python tools/validate_schemas.py
          python -m unittest discover -s tests -v

      - name: Commit immutable source snapshot
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- source-vault; then
            echo 'No Source Vault changes to commit.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-vault
          git commit -m 'Mirror Tanzil Quran Text v1.1 Uthmani source'
          git pull --rebase origin main
          git push origin HEAD:main
