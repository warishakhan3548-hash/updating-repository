name: Backfill Tanzil metadata hashes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-tanzil-metadata-hashes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-tanzil-metadata-hashes
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Move to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Bind exact licence and provenance SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          registry_path = Path("source-vault/registry.json")
          licence = Path("source-vault/quran/tanzil/1.1/uthmani-marks-sajdah-rub/LICENSE_SOURCE.html")
          provenance = Path("source-vault/quran/tanzil/1.1/uthmani-marks-sajdah-rub/provenance.json")

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          data = json.loads(registry_path.read_text(encoding="utf-8"))
          source = next(
              item
              for item in data["sources"]
              if item["source_id"] == "quran.tanzil.uthmani.v1.1"
          )
          source["licence_sha256"] = sha256(licence)
          source["provenance_sha256"] = sha256(provenance)
          registry_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python tools/vault_gate.py source-vault/registry.json
          python -m unittest discover -s tests -v

      - name: Commit registry hash bindings
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- source-vault/registry.json; then
            echo 'Registry already contains the exact metadata hashes.'
            exit 0
          fi

          BASE_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [[ "$BASE_SHA" != "$REMOTE_SHA" ]]; then
            echo "main moved during hash binding ($BASE_SHA -> $REMOTE_SHA); refusing stale registry update." >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-vault/registry.json
          git commit -m 'Bind Tanzil licence and provenance SHA-256'
          git push origin HEAD:main
