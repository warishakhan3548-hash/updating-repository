name: Aaris Quick Intake Upgrade

on:
  push:
    branches:
      - upgrade/aaris-brain-quick-intake-20260910

permissions:
  contents: write

concurrency:
  group: aaris-quick-intake-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve pinned dependencies
        run: flutter pub get

      - name: Apply surgical quick-intake upgrade
        run: python3 tool/upgrade_aaris_quick_intake.py

      - name: Format changed Dart
        run: |
          dart format \
            lib/domain/medicine_entry_prefill.dart \
            lib/domain/app_brain.dart \
            lib/ui/brain_screen.dart \
            lib/ui/editor_screen.dart \
            test/medicine_entry_prefill_test.dart

      - name: Reject whitespace damage
        run: git diff --check

      - name: Static safety gate
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib

      - name: Full pharmacy regression gate
        run: flutter test --reporter expanded

      - name: Commit only verified production changes
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            tool/upgrade_aaris_quick_intake.py \
            .github/workflows/upgrade-aaris-quick-intake.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "aaris-upgrade-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Upgrade Aaris Brain with reviewed pharmacist quick intake"
          git push origin "HEAD:${GITHUB_REF_NAME}"
