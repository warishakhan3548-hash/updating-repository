name: Aaris Offline V9 Level 6 Upgrade

on:
  push:
    branches:
      - 'upgrade/offline-engine-v9-level6'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/offline-engine-v9-level6
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply Level 6 source surgeon
        run: python3 tool/level6_source_surgeon.py
      - name: Format intended files only
        run: dart format lib/domain/medicine_confusion_firewall.dart lib/domain/regulatory_medicine_code.dart lib/domain/spatial_traceability.dart lib/domain/medicine_resolution_v2.dart lib/services/scan_service.dart test/offline_level6_reasoning_test.dart
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Focused Level 6 regressions
        run: flutter test --reporter expanded test/offline_level6_reasoning_test.dart test/offline_level5_reasoning_test.dart test/medicine_resolution_v2_test.dart test/offline_decision_engine_test.dart test/offline_search_evidence_v5_test.dart test/retrieval_fusion_test.dart
      - name: Full regression suite
        run: flutter test --reporter expanded
      - name: Android debug integration build
        run: flutter build apk --debug --no-pub
      - name: Commit verified Level 6 patch
        shell: bash
        run: |
          rm -f .github/workflows/aaris-offline-v9-level6-upgrade.yml tool/level6_source_surgeon.py
          git config user.name "Aaris Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade offline medicine engine to V9 Level 6"
          git push origin HEAD:upgrade/offline-engine-v9-level6
