name: Resolver V3 safety surgery
on:
  push:
    branches: [unified-medicine-evidence-v3]
    paths:
      - .github/workflows/resolver-v3-safety.yml
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply resolver safety patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/one_shot_resolver_v3_safety.py
          rm .github/workflows/resolver-v3-safety.yml
          git config user.name "Aaris CI Surgeon"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden duplicate GTIN and GS1 evidence conflicts"
          git push origin HEAD:unified-medicine-evidence-v3
