name: Apply realtime 1.9.6 upgrade

on:
  push:
    branches: [ upgrade/realtime-196 ]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/realtime-196
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Apply surgical realtime and AI-hand upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str, label: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))
              print(f"patched {label}")

          def sub_once(path: str, pattern: str, replacement: str, label: str):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one regex match in {path}, found {count}")
              p.write_text(updated)
              print(f"patched {label}")

          replace_once(
              "app/build.gradle.kts",
              '        versionCode = 93\n        versionName = "1.9.5"',
              '        versionCode = 94\n        versionName = "1.9.6"',
              "version"
          )

          controller = "app/src/main/java/com/aaris/remoteassist/webrtc/ControllerWebRtcSession.kt"
          replace_once(
              controller,
              '''    fun sendPresentationFeedback(window: PresentationCadenceWindow): Boolean {
                  if (closed.get()) return false
                  val lease = leaseSecret ?: return false
                  val display = geometry ?: return false
                  return peer.sendControl(
                      ControlProtocol.encode(
                          ControlPacket.PresentationFeedback(
                              leaseSecret = lease,
                              generation = display.generation,
                              sequence = feedbackSequence.incrementAndGet(),
                              intervalMs = window.intervalMs,
                              renderedFrames = window.renderedFrames,
                              maxGapMs = window.maxGapMs
                          )
                      )
                  )
              }''',
              '''    fun sendPresentationFeedback(window: PresentationCadenceWindow): Boolean {
                  if (closed.get()) return false
                  val lease = leaseSecret ?: return false
                  val display = geometry ?: return false
                  return peer.sendControl(
                      bytes = ControlProtocol.encode(
                          ControlPacket.PresentationFeedback(
                              leaseSecret = lease,
                              generation = display.generation,
                              sequence = feedbackSequence.incrementAndGet(),
                              intervalMs = window.intervalMs,
                              renderedFrames = window.renderedFrames,
                              maxGapMs = window.maxGapMs
                          )
                      ),
                      // Render cadence is freshness telemetry, not an authoritative command.
                      // Keep retransmission/HOL delay away from the next tap or gesture edge.
                      freshnessSensitive = true
                  )
              }''',
              "presentation feedback freshness lane"
          )

          sub_once(
              controller,
              r'''            peer\.sendControl\(ControlProtocol\.encode\(ControlPacket\.VideoFeedback\(lease, display\.generation,\n[ \t]+feedbackSequence\.incrementAndGet\(\), recent\.intervalMs, recent\.frames,\n[ \t]+recent\.processingMs\?\.toFloat\(\) \?: -1f, recent\.jitterMs\?\.toFloat\(\) \?: -1f,\n[ \t]+recent\.dropped \?: -1, recent\.freezes \?: -1\)\)\)''',
              '''            peer.sendControl(
                  bytes = ControlProtocol.encode(
                      ControlPacket.VideoFeedback(
                          lease,
                          display.generation,
                          feedbackSequence.incrementAndGet(),
                          recent.intervalMs,
                          recent.frames,
                          recent.processingMs?.toFloat() ?: -1f,
                          recent.jitterMs?.toFloat() ?: -1f,
                          recent.dropped ?: -1,
                          recent.freezes ?: -1
                      )
                  ),
                  // Decoder samples age quickly; stale telemetry may be dropped rather
                  // than queueing ahead of authoritative user input on control-v1.
                  freshnessSensitive = true
              )''',
              "decoder feedback freshness lane"
          )

          observation = "app/src/main/java/com/aaris/remoteassist/ai/AiObservationEngine.kt"
          replace_once(
              observation,
              '''    private suspend fun settle() {
                  val start = now()
                  pause(80)
                  while (now() - start < 320 && now() - ledger.changedAtMs < 100) pause(40)
              }''',
              '''    private suspend fun settle() {
                  val start = now()
                  while (true) {
                      val current = now()
                      val elapsed = current - start
                      val quietFor = current - ledger.changedAtMs
                      if (quietFor >= QUIET_WINDOW_MS || elapsed >= MAX_SETTLE_MS) return

                      val remainingQuiet = (QUIET_WINDOW_MS - quietFor).coerceAtLeast(1L)
                      val remainingBudget = (MAX_SETTLE_MS - elapsed).coerceAtLeast(1L)
                      pause(minOf(SETTLE_POLL_MS, remainingQuiet, remainingBudget))
                  }
              }''',
              "adaptive observation settling"
          )
          replace_once(
              observation,
              '''        val action = args.getString("action")
                  val navigation = action in setOf("home", "back", "recents", "open_app")''',
              '''        val action = args.getString("action")
                  if (action == "tap") snapTapToClickableTarget(args, observed)
                  val navigation = action in setOf("home", "back", "recents", "open_app")''',
              "tap target snap hook"
          )
          replace_once(
              observation,
              '''    private fun actionScope(args: JSONObject, ui: AiUiSnapshot): AiActionScope? {''',
              '''    private fun snapTapToClickableTarget(args: JSONObject, ui: AiUiSnapshot) {
                  val x = args.optDouble("x", Double.NaN)
                  val y = args.optDouble("y", Double.NaN)
                  if (!x.isFinite() || !y.isFinite() || x !in 0.0..1.0 || y !in 0.0..1.0) return
                  if (width <= 0 || height <= 0) return

                  // Preserve coordinate taps as the universal canvas/custom-view fallback.
                  // If Accessibility exposes a stable clickable target under the point,
                  // center the tap inside the smallest enabled target to reduce edge misses.
                  val target = ui.nodes.asSequence()
                      .filter { node ->
                          node.enabled && node.clickable && node.area > 0L &&
                              node.contains(x * width, y * height)
                      }
                      .minByOrNull { it.area }
                      ?: return

                  args.put("x", ((target.left + target.right) / 2.0 / width).coerceIn(0.0, 1.0))
                  args.put("y", ((target.top + target.bottom) / 2.0 / height).coerceIn(0.0, 1.0))
              }

              private fun actionScope(args: JSONObject, ui: AiUiSnapshot): AiActionScope? {''',
              "semantic tap centering"
          )
          replace_once(
              observation,
              '''    private fun error(code: String) = JSONObject().put("error", code).put("applied", false)
              }''',
              '''    private fun error(code: String) = JSONObject().put("error", code).put("applied", false)

                  private companion object {
                      const val QUIET_WINDOW_MS = 100L
                      const val MAX_SETTLE_MS = 320L
                      const val SETTLE_POLL_MS = 40L
                  }
              }''',
              "settle constants"
          )

          Path("app/src/main/java/com/aaris/remoteassist/ai/AiAppLauncher.kt").write_text('''package com.aaris.remoteassist.ai

          import android.content.Context
          import android.content.Intent

          object AiAppLauncher {
              @Suppress("DEPRECATION")
              fun launch(context: Context, query: String): Boolean {
                  val raw = query.trim()
                  if (raw.isEmpty() || raw.length > 160) return false
                  val packageManager = context.packageManager

                  fun launchIntent(intent: Intent): Boolean {
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)
                      return runCatching {
                          context.startActivity(intent)
                          true
                      }.getOrDefault(false)
                  }

                  // A package name is already an exact unique target. Avoid enumerating
                  // every launcher activity when the model/tool supplied one directly.
                  packageManager.getLaunchIntentForPackage(raw)?.let { intent ->
                      return launchIntent(intent)
                  }

                  val launcherQuery = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val candidates = packageManager.queryIntentActivities(launcherQuery, 0).mapNotNull { info ->
                      val activity = info.activityInfo ?: return@mapNotNull null
                      val label = runCatching { info.loadLabel(packageManager)?.toString() }.getOrNull().orEmpty()
                      if (label.isBlank()) return@mapNotNull null
                      AiLaunchCandidate(label, activity.packageName, activity.name)
                  }
                  val selected = AiAppMatcher.choose(raw, candidates) ?: return false
                  val intent = packageManager.getLaunchIntentForPackage(selected.packageName)
                      ?: Intent(Intent.ACTION_MAIN)
                          .addCategory(Intent.CATEGORY_LAUNCHER)
                          .setClassName(selected.packageName, selected.activityName)
                  return launchIntent(intent)
              }
          }
          '''.replace("\n          ", "\n").lstrip())
          print("patched exact-package app launch fast path")

          test_path = "app/src/test/java/com/aaris/remoteassist/ai/AiObservationEngineTest.kt"
          replace_once(
              test_path,
              '''    @Test fun privacyContextChangingDuringCaptureNeverReturnsUnmaskedImage() = runBlocking {''',
              '''    @Test fun quietScreensAvoidFixedDelayAndRecentChangesWaitOnlyForQuiescence() = runBlocking {
                  val quietStart = clock
                  val first = engine.observe()
                  assertFalse(first.has("error"))
                  assertEquals(quietStart, clock)

                  engine.invalidate()
                  val changedAt = clock
                  val second = engine.observe()
                  assertFalse(second.has("error"))
                  assertEquals(100L, clock - changedAt)
              }

              @Test fun tapCoordinatesSnapToSmallestEnabledClickableTargetCenter() = runBlocking {
                  val observed = engine.observe()
                  val args = action(observed).put("x", 0.72).put("y", 0.72)
                  val validation = engine.validate(args)
                  assertNull(validation.error)
                  assertEquals(0.8, args.getDouble("x"), 0.0001)
                  assertEquals(0.8, args.getDouble("y"), 0.0001)
                  assertTrue(validation.stillValid())
              }

              @Test fun privacyContextChangingDuringCaptureNeverReturnsUnmaskedImage() = runBlocking {''',
              "AI latency and targeting regression tests"
          )

          replace_once(
              "docs/ARCHITECTURE.md",
              '''  - unordered, non-retransmitted `control-live-v1` lane for freshness-only drag
                CONTINUE packets;''',
              '''  - unordered, non-retransmitted `control-live-v1` lane for freshness-only drag
                CONTINUE packets plus stale-safe decoder/presentation telemetry;''',
              "architecture transport map"
          )

          Path("docs/RTC_AND_AI_196.md").write_text('''# Aaris Remote 1.9.6 — input-first realtime + faster AI targeting

          ## Realtime transport

          Screen pixels continue to use WebRTC directly or through TURN. Cloudflare Workers remain the authentication, signaling, and TURN-credential control plane; they do not proxy steady-state screen video.

          Decoder-health and EGL-presentation telemetry now use the existing unordered, non-retransmitted `control-live-v1` freshness lane after it opens. Startup keeps the reliable fallback. Old telemetry therefore cannot sit in retransmission head-of-line ahead of a newer authoritative tap, gesture START/END, navigation, or text command. Host feedback remains lease/display-generation bound and replay protected.

          ## AI hands

          AI tap coordinates remain universal, including custom views and canvases. When the fresh Accessibility snapshot exposes an enabled clickable node under the requested point, the tap is centered inside the smallest matching target before the existing semantic and fresh-pixel revalidation. This reduces tiny-icon and edge-tap misses without introducing a second execution path.

          `open_app` now fast-paths an exact launcher package before enumerating launcher labels; conservative label matching remains the fallback.

          ## Observation latency

          `phone_observe` no longer pays an unconditional 80 ms delay on an already-quiet screen. It returns immediately when the UI is already quiescent, otherwise waits for 100 ms of quiet with the existing 320 ms ceiling. Privacy masking, fresh capture, one-use tickets, target revalidation, and the one-action contract stay intact.

          ## Regression gates

          - Deterministic tests cover zero synthetic delay on quiet screens and bounded settling after invalidation.
          - AI target-centering is verified against the smallest enabled clickable node.
          - MCP protocol tests, Android unit tests, debug/release lint, and debug/release builds are required before commit.
          - Cloudflare production topology is intentionally unchanged because Workers are not the video data plane.
          '''.replace("\n          ", "\n").lstrip())

          Path(".github/workflows/apply-realtime-196.yml").unlink()
          print("patch complete; self-removing surgeon workflow")
          PY

      - name: MCP protocol regression
        run: node cloudflare/mcp-worker.test.mjs

      - name: Android unit, lint, and build regression
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Commit verified upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v1.9.6: input-first realtime and faster AI targeting"
          git push origin HEAD:upgrade/realtime-196
