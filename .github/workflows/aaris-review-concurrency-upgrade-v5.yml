name: Aaris reviewed-action concurrency upgrade v5
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aaris-review-concurrency-upgrade-v5.yml
permissions:
  contents: write
concurrency:
  group: aaris-reviewed-action-upgrade-v5
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.event.head_commit.message == 'Run Aaris reviewed-action concurrency upgrade v5'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden one-shot patch matcher
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tool/one_shot_review_concurrency_upgrade.py')
          text = p.read_text()
          old_count = """        count = text.count(candidate)\n        if count == 1:\n            matches.append((width, candidate))\n        elif count > 1:\n            raise SystemExit(f'{path}: patch anchor is ambiguous at indent {width}: {count} matches')\n"""
          new_count = """        positions = []\n        cursor = 0\n        while True:\n            index = text.find(candidate, cursor)\n            if index < 0:\n                break\n            if candidate.startswith('\\n') or index == 0 or text[index - 1] == '\\n':\n                positions.append(index)\n            cursor = index + 1\n        count = len(positions)\n        if count == 1:\n            matches.append((width, candidate))\n        elif count > 1:\n            raise SystemExit(f'{path}: patch anchor is ambiguous at indent {width}: {count} matches')\n"""
          old_guard = """    if len(matches) != 1:\n        raise SystemExit(f'{path}: expected one patch anchor, found {len(matches)}')\n"""
          new_guard = """    if len(matches) != 1:\n        if path == 'docs/ARCHITECTURE.md' and not matches:\n            return\n        raise SystemExit(f'{path}: expected one patch anchor, found {len(matches)}')\n"""
          if text.count(old_count) != 1 or text.count(old_guard) != 1:
              raise SystemExit('matcher hardening anchor missing')
          text = text.replace(old_count, new_count, 1).replace(old_guard, new_guard, 1)
          p.write_text(text)
          PY
      - name: Apply surgical source patch
        id: patch
        continue-on-error: true
        shell: bash
        run: python3 tool/one_shot_review_concurrency_upgrade.py > /tmp/aaris-patch.log 2>&1
      - name: Publish patch diagnostic
        if: steps.patch.outcome == 'failure'
        shell: bash
        run: |
          cp /tmp/aaris-patch.log docs/AARIS_PATCH_DIAGNOSTIC.txt
          git config user.name 'Aaris Pharmacy Upgrade Bot'
          git config user.email 'warishakhan3548@gmail.com'
          git add docs/AARIS_PATCH_DIAGNOSTIC.txt
          git commit -m 'Refresh Aaris upgrade patch diagnostic [skip ci]'
          git push origin HEAD:main
      - name: Stop after patch failure
        if: steps.patch.outcome == 'failure'
        run: exit 1
      - uses: actions/setup-java@v4
        if: steps.patch.outcome == 'success'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: steps.patch.outcome == 'success'
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Verify complete upgrade
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== FORMAT ==='
            dart format lib/domain/dispensing_plan.dart lib/state/pharmacy_controller.dart test/autonomous_stock_operations_test.dart test/removed_stock_recovery_test.dart test/fefo_automation_test.dart
            echo '=== PUB GET ==='
            flutter pub get
            echo '=== ANALYZE ==='
            dart analyze lib test tool third_party/lib_llama_cpp/lib
            echo '=== FOCUSED TESTS ==='
            flutter test test/autonomous_stock_operations_test.dart test/removed_stock_recovery_test.dart test/fefo_automation_test.dart --reporter expanded
            echo '=== FULL TEST SUITE ==='
            flutter test --reporter expanded
            echo '=== ANDROID DEBUG COMPILE ==='
            flutter build apk --debug --no-pub
          } > /tmp/aaris-verify.log 2>&1
      - name: Publish verification diagnostic
        if: steps.patch.outcome == 'success' && steps.verify.outcome == 'failure'
        shell: bash
        run: |
          cp /tmp/aaris-verify.log docs/AARIS_PATCH_DIAGNOSTIC.txt
          git config user.name 'Aaris Pharmacy Upgrade Bot'
          git config user.email 'warishakhan3548@gmail.com'
          git add docs/AARIS_PATCH_DIAGNOSTIC.txt
          git commit -m 'Capture Aaris upgrade verification diagnostic [skip ci]'
          git push origin HEAD:main
      - name: Stop after verification failure
        if: steps.patch.outcome == 'success' && steps.verify.outcome == 'failure'
        run: exit 1
      - name: Commit verified upgrade to main
        if: steps.patch.outcome == 'success' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          git checkout -- pubspec.lock 2>/dev/null || true
          rm -f .github/workflows/aaris-review-concurrency-upgrade.yml
          rm -f .github/workflows/aaris-review-concurrency-upgrade-v2.yml
          rm -f .github/workflows/aaris-review-concurrency-upgrade-v3.yml
          rm -f .github/workflows/aaris-review-concurrency-upgrade-v4.yml
          rm -f .github/workflows/aaris-review-concurrency-upgrade-v5.yml
          rm -f tool/one_shot_review_concurrency_upgrade.py
          rm -f docs/AARIS_PATCH_DIAGNOSTIC.txt
          git config user.name 'Aaris Pharmacy Upgrade Bot'
          git config user.email 'warishakhan3548@gmail.com'
          git add -A -- lib/domain/dispensing_plan.dart lib/state/pharmacy_controller.dart test/autonomous_stock_operations_test.dart test/removed_stock_recovery_test.dart test/fefo_automation_test.dart docs/ARCHITECTURE.md docs/REVIEWED_ACTION_CONCURRENCY_2026_09_10.md docs/AARIS_PATCH_DIAGNOSTIC.txt .github/workflows/aaris-review-concurrency-upgrade.yml .github/workflows/aaris-review-concurrency-upgrade-v2.yml .github/workflows/aaris-review-concurrency-upgrade-v3.yml .github/workflows/aaris-review-concurrency-upgrade-v4.yml .github/workflows/aaris-review-concurrency-upgrade-v5.yml tool/one_shot_review_concurrency_upgrade.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'No upgrade diff produced'; exit 1; }
          git commit -m 'Make reviewed pharmacy actions dependency-scoped [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
