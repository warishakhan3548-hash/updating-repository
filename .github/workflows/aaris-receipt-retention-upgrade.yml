name: Aaris receipt retention upgrade

on:
  push:
    branches:
      - upgrade/aaris-autonomous-safety-20260910

permissions:
  contents: write

concurrency:
  group: aaris-receipt-retention-upgrade-20260910
  cancel-in-progress: false

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/aaris-autonomous-safety-20260910
          fetch-depth: 0

      - name: Apply bounded receipt retention
        run: python3 tool/aaris_receipt_retention_upgrade.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Format upgraded Dart
        run: dart format lib/data/inventory_database.dart test/operation_receipt_retention_test.dart

      - name: Resolve pinned dependencies
        run: flutter pub get

      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib

      - name: Receipt retention regression tests
        run: flutter test test/operation_receipt_retention_test.dart test/reviewed_operation_idempotency_test.dart --reporter expanded

      - name: Full Flutter regression suite
        run: flutter test --reporter expanded

      - name: Remove runner-generated migration drift
        run: |
          git checkout HEAD -- analysis_options.yaml android/gradle.properties 2>/dev/null || true
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java

      - name: Remove one-shot hardening machinery
        run: |
          rm -f tool/aaris_receipt_retention_upgrade.py
          rm -f .github/workflows/aaris-receipt-retention-upgrade.yml
          git diff --check

      - name: Verify surgical product diff
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(lib/data/inventory_database\.dart|test/operation_receipt_retention_test\.dart|docs/PROGRESS\.md|tool/aaris_receipt_retention_upgrade\.py|\.github/workflows/aaris-receipt-retention-upgrade\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Commit verified hardening
        run: |
          git config user.name "Aaris Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bound exactly-once receipt retention for long-running pharmacies"
          git push origin HEAD:upgrade/aaris-autonomous-safety-20260910
