name: Aaris guarded autofix verification

on:
  push:
    branches:
      - autofix/aaris-pharmacy-20260907

permissions:
  contents: write

concurrency:
  group: aaris-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify autofix runner
        shell: bash
        run: |
          set -euo pipefail
          cat .autofix/chunk-0.b64 .autofix/chunk-1.b64 .autofix/chunk-2.b64 .autofix/chunk-3.b64 > /tmp/runner.b64
          printf '%s  %s\n' '8ddab374b397abb0c122a0150ff403195c1ac9c1375d98dcaad4844e3d153073' '/tmp/runner.b64' | sha256sum -c -
          base64 --decode /tmp/runner.b64 > /tmp/runner.z
          python3 - <<'PY'
          import hashlib, pathlib, zlib
          packed = pathlib.Path('/tmp/runner.z').read_bytes()
          runner = zlib.decompress(packed)
          expected = '729b7abfa27a6d1f3c4aee29bc8f7b0cb5040217d41c5c15d43477a871f34a5f'
          actual = hashlib.sha256(runner).hexdigest()
          if actual != expected:
              raise SystemExit(f'runner checksum mismatch: {actual}')
          pathlib.Path('/tmp/aaris_autofix_runner.py').write_bytes(runner)
          PY

      - name: Apply guarded patch in runner workspace
        run: python3 /tmp/aaris_autofix_runner.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve pinned dependencies
        run: flutter pub get

      - name: Static checks
        run: dart analyze lib test

      - name: Full Flutter tests
        run: flutter test --reporter expanded

      - name: Verify and stage only guarded outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s .autofix/changed.txt
          while IFS= read -r path; do
            test -n "$path"
            git add -- "$path"
          done < .autofix/changed.txt
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          echo 'Staged files:'
          git diff --cached --name-only

      - name: Commit verified autofix to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: apply guarded Aaris Pharmacy autofix'
          git push origin HEAD:autofix/aaris-pharmacy-20260907
