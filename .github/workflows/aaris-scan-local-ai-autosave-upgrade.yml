name: Aaris scan Local AI autosave upgrade
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aaris-scan-local-ai-autosave-upgrade.yml
permissions:
  contents: write
concurrency:
  group: aaris-scan-local-ai-autosave-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.event.head_commit.message == 'Start Aaris scan Local AI autosave upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply surgical scan automation upgrade
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              print(f'[{label}] anchor count={count}')
              if count != 1:
                  raise SystemExit(f'{label}: {path}: expected exactly one patch anchor, found {count}')
              file.write_text(text.replace(old, new))

          def insert_before_once(path: str, marker: str, addition: str, label: str) -> None:
              replace_once(path, marker, addition + marker, label)

          def insert_after_once(path: str, marker: str, addition: str, label: str) -> None:
              replace_once(path, marker, marker + addition, label)

          quick_class_tail = dedent('''\
            String get actionLabel =>
                isNewBatch ? 'Confirm & add new batch' : 'Confirm & add';
          }
          ''')
          auto_class = dedent('''\

          /// Stronger gate used only by the explicit direct-camera automation path.
          ///
          /// The Local LLM is an evidence resolver, never the inventory writer.
          /// Automatic persistence is unlocked only after the existing domain
          /// gate passes AND a scan-verified on-device model reviewed this exact
          /// draft. The .88 floor matches validateLocalScan(): a field repaired by
          /// the model reaches .88 only after its quote is proven inside OCR SOURCE.
          class ScanAutoSaveDecision {
            const ScanAutoSaveDecision._({
              required this.allowed,
              required this.isNewBatch,
              required this.reason,
            });

            const ScanAutoSaveDecision.allowed({bool isNewBatch = false})
                : this._(allowed: true, isNewBatch: isNewBatch, reason: '');

            const ScanAutoSaveDecision.blocked(String reason)
                : this._(allowed: false, isNewBatch: false, reason: reason);

            final bool allowed;
            final bool isNewBatch;
            final String reason;
          }
          ''')
          insert_after_once(
              'lib/domain/medicine_scan_commit.dart',
              quick_class_tail,
              auto_class,
              'domain-auto-decision-type',
          )

          auto_function = dedent('''\
          ScanAutoSaveDecision scanAutoSaveDecision(
            MedicineScanDraft draft,
            IntakeResolution resolution, {
            required bool localAiVerified,
          }) {
            if (!localAiVerified) {
              return const ScanAutoSaveDecision.blocked(
                'A scan-verified Local AI did not verify this exact OCR draft. Review it before saving.',
              );
            }

            final quick = scanQuickAddDecision(draft, resolution);
            if (!quick.allowed) {
              return ScanAutoSaveDecision.blocked(quick.reason);
            }
            if (draft.rawText.trim().isEmpty) {
              return const ScanAutoSaveDecision.blocked(
                'Raw packaging evidence is missing, so automatic save is disabled.',
              );
            }
            if (draft.overallConfidence < .88) {
              return const ScanAutoSaveDecision.blocked(
                'The verified medicine identity is below the automatic-save confidence floor.',
              );
            }

            for (final requirement in const <(String, String)>[
              ('brand', 'Brand'),
              ('salt', 'Salt'),
              ('strength', 'Strength'),
              ('form', 'Dosage form'),
            ]) {
              final field = draft.field(requirement.$1);
              if (field.value.trim().isEmpty ||
                  field.conflicted ||
                  field.confidence < .88) {
                return ScanAutoSaveDecision.blocked(
                  '${requirement.$2} is not strongly source-verified enough for automatic save.',
                );
              }
            }

            return ScanAutoSaveDecision.allowed(isNewBatch: quick.isNewBatch);
          }

          ''')
          insert_before_once(
              'lib/domain/medicine_scan_commit.dart',
              'bool _hasTrustedBatchAnchor(MedicineScanDraft draft) {',
              auto_function,
              'domain-auto-decision-function',
          )

          replace_once(
              'lib/ui/import_screen.dart',
              'MaterialPageRoute(builder: (_) => const ScannerScreen()),',
              'MaterialPageRoute(builder: (_) => const ScannerScreen(autoSubmit: true)),',
              'scanner-auto-submit',
          )

          old_scan_tail = dedent('''\
                    ],
              );
            }

            Future<void> _photo() async {
          ''')
          new_scan_tail = dedent('''\
                    ],
                autoSaveReadyDrafts: true,
              );
            }

            Future<void> _photo() async {
          ''')
          replace_once(
              'lib/ui/import_screen.dart',
              old_scan_tail,
              new_scan_tail,
              'scanner-enables-auto-save',
          )

          replace_once(
              'lib/ui/import_screen.dart',
              '  Future<void> _openInbox(List<ScanEvidence> evidence) async {',
              dedent('''\
                Future<void> _openInbox(
                  List<ScanEvidence> evidence, {
                  bool autoSaveReadyDrafts = false,
                }) async {
              ''').rstrip(),
              'open-inbox-option',
          )

          replace_once(
              'lib/ui/import_screen.dart',
              dedent('''\
                      builder: (_) => ImportInboxScreen(
                        controller: widget.controller,
                        evidence: evidence,
                      ),
              '''),
              dedent('''\
                      builder: (_) => ImportInboxScreen(
                        controller: widget.controller,
                        evidence: evidence,
                        autoSaveReadyDrafts: autoSaveReadyDrafts,
                      ),
              '''),
              'open-inbox-forwards-option',
          )

          replace_once(
              'lib/ui/import_screen.dart',
              '    this.preparedDrafts,\n  });',
              '    this.preparedDrafts,\n    this.autoSaveReadyDrafts = false,\n  });',
              'inbox-constructor-option',
          )
          replace_once(
              'lib/ui/import_screen.dart',
              '  final List<MedicineScanDraft>? preparedDrafts;\n',
              dedent('''\
                final List<MedicineScanDraft>? preparedDrafts;

                /// True only for the direct camera scanner. Photo/video/text and
                /// prepared batch imports preserve explicit review semantics.
                final bool autoSaveReadyDrafts;
              '''),
              'inbox-option-field',
          )
          replace_once(
              'lib/ui/import_screen.dart',
              '  bool _localBrainScanActive = false;\n  int? _savingDraftIndex;\n',
              '  bool _localBrainScanActive = false;\n  int? _savingDraftIndex;\n  bool _autoSaveAttempted = false;\n',
              'inbox-auto-attempt-state',
          )

          replace_once(
              'lib/ui/import_screen.dart',
              '      var localBrainUsed = false;\n',
              '      var localBrainUsed = false;\n      var localBrainAutoSaveVerified = false;\n',
              'local-ai-auto-verification-state',
          )
          replace_once(
              'lib/ui/import_screen.dart',
              '                  localBrainUsed = true;\n                  scanModelId = routedModelId;\n',
              dedent('''\
                                localBrainUsed = true;
                                localBrainAutoSaveVerified =
                                    local.isModelScanVerified(routedModelId);
                                scanModelId = routedModelId;
              '''),
              'capture-scan-verified-model-proof',
          )

          old_prepare_commit = dedent('''\
                if (mounted && generation == _generation) {
                  setState(() {
                    _drafts = reviews;
                    _ignoredFrames = understanding.ignoredFrames;
                    _localBrainScanActive = localBrainUsed;
                    _loading = false;
                  });
                }
          ''')
          new_prepare_commit = dedent('''\
                if (mounted && generation == _generation) {
                  setState(() {
                    _drafts = reviews;
                    _ignoredFrames = understanding.ignoredFrames;
                    _localBrainScanActive = localBrainUsed;
                    _loading = false;
                  });
                  if (widget.autoSaveReadyDrafts &&
                      reviews.length == 1 &&
                      !_autoSaveAttempted) {
                    unawaited(
                      _attemptScannerAutoSave(
                        generation,
                        reviews.single,
                        localBrainVerified: localBrainAutoSaveVerified,
                      ),
                    );
                  }
                }
          ''')
          replace_once(
              'lib/ui/import_screen.dart',
              old_prepare_commit,
              new_prepare_commit,
              'start-auto-save-after-preview',
          )

          auto_save_method = dedent('''\
            Future<void> _attemptScannerAutoSave(
              int preparedGeneration,
              _ImportDraftReview review, {
              required bool localBrainVerified,
            }) async {
              if (!widget.autoSaveReadyDrafts ||
                  _autoSaveAttempted ||
                  !mounted ||
                  preparedGeneration != _generation) {
                return;
              }
              _autoSaveAttempted = true;

              var resolution = _resolve(review.draft);
              var decision = scanAutoSaveDecision(
                review.draft,
                resolution,
                localAiVerified: localBrainVerified,
              );
              if (!decision.allowed) {
                setState(() {
                  _semanticWarning = 'Auto-save paused · ${decision.reason}';
                });
                return;
              }

              setState(() => _savingDraftIndex = 0);
              try {
                // Re-resolve against the live DB immediately before the CAS write.
                // A duplicate, lot conflict or concurrent inventory change fails
                // closed instead of turning an AI result into a second stock row.
                resolution = _resolve(review.draft);
                decision = scanAutoSaveDecision(
                  review.draft,
                  resolution,
                  localAiVerified: localBrainVerified,
                );
                if (!decision.allowed) throw StateError(decision.reason);

                final expectedRevision = widget.controller.snapshot.revision;
                final medicine = medicineFromConfirmedScan(review.draft);
                await widget.controller.save(
                  medicine,
                  expectedRevision: expectedRevision,
                );
                if (!mounted) return;
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text(
                      decision.isNewBatch
                          ? '${medicine.title} auto-saved as a verified new batch.'
                          : '${medicine.title} verified by Local AI and auto-saved.',
                    ),
                  ),
                );
              } catch (error) {
                if (mounted) {
                  setState(() {
                    _semanticWarning = 'Auto-save paused safely · $error';
                  });
                }
              } finally {
                if (mounted && _savingDraftIndex == 0) {
                  setState(() => _savingDraftIndex = null);
                }
              }
            }

          ''')
          insert_before_once(
              'lib/ui/import_screen.dart',
              '  Future<void> _confirmAndAdd(\n',
              auto_save_method,
              'insert-auto-save-method',
          )

          old_brain_banner = dedent('''\
                        if (_localBrainScanActive)
                          const Padding(
                            padding: EdgeInsets.only(top: 10),
                            child: Text(
                              'Aaris Brain · raw OCR was handed to the active Local AI on-device before this preview. Confirmed fields still require your tap before inventory changes.',
                              style: TextStyle(
                                color: primary,
                                fontSize: 11.5,
                                fontWeight: FontWeight.w700,
                              ),
                            ),
                          ),
          ''')
          new_brain_banner = dedent('''\
                        if (_localBrainScanActive)
                          Padding(
                            padding: const EdgeInsets.only(top: 10),
                            child: Text(
                              widget.autoSaveReadyDrafts
                                  ? 'Aaris Brain · raw OCR was handed to the active Local AI on-device. A single scan-verified medicine may save automatically; uncertainty and duplicates still stop here for review.'
                                  : 'Aaris Brain · raw OCR was handed to the active Local AI on-device before this preview. Confirmed fields still require your tap before inventory changes.',
                              style: const TextStyle(
                                color: primary,
                                fontSize: 11.5,
                                fontWeight: FontWeight.w700,
                              ),
                            ),
                          ),
          ''')
          replace_once(
              'lib/ui/import_screen.dart',
              old_brain_banner,
              new_brain_banner,
              'automation-aware-brain-banner',
          )

          replace_once(
              'lib/services/local_ai_service_io.dart',
              "      _status = 'AI scan preview ready · confirm before adding';",
              "      _status = 'AI scan evidence verified · deterministic save gate deciding next step';",
              'local-ai-status',
          )

          Path('test/scan_auto_save_decision_test.dart').write_text(dedent('''\
          import 'package:aaris_pharmacy/domain/intake_resolution.dart';
          import 'package:aaris_pharmacy/domain/medicine.dart';
          import 'package:aaris_pharmacy/domain/medicine_scan_commit.dart';
          import 'package:aaris_pharmacy/domain/medicine_understanding.dart';
          import 'package:flutter_test/flutter_test.dart';

          ExtractedMedicineField _field(
            String value, {
            double confidence = .95,
          }) => ExtractedMedicineField(
            value: value,
            confidence: confidence,
            support: 2,
            conflicted: false,
          );

          MedicineScanDraft _draft({
            double coreConfidence = .95,
            double overall = .95,
            String batch = 'B-100',
          }) => MedicineScanDraft(
            fields: <String, ExtractedMedicineField>{
              'name': _field('Dolo 650'),
              'brand': _field('Dolo 650', confidence: coreConfidence),
              'salt': _field('Paracetamol', confidence: coreConfidence),
              'strength': _field('650 mg', confidence: coreConfidence),
              'form': _field('Tablet', confidence: coreConfidence),
              'batchNumber': _field(batch),
              'barcode': _field('8901234567890'),
              'expiry': _field('2027-12'),
              'mfg': _field('2026-01'),
            },
            rawText:
                'DOLO 650 TABLETS COMPOSITION Paracetamol IP 650 mg Batch B-100 MFG 01/2026 EXP 12/2027',
            searchKeywords: 'dolo 650 paracetamol',
            frameSequences: const <int>[1],
            expiryMonthOnly: true,
            mfgMonthOnly: true,
            overallConfidence: overall,
          );

          Medicine _savedLot() => Medicine.fromJson(<String, dynamic>{
            'id': 'lot-a',
            'name': 'Dolo 650',
            'brand': 'Dolo 650',
            'salt': 'Paracetamol',
            'strength': '650 mg',
            'form': 'Tablet',
            'batchNumber': 'B-100',
            'barcode': '8901234567890',
            'expiry': '2027-12',
            'mfg': '2026-01',
            'quantity': 10,
          });

          void main() {
            final today = DateTime(2026, 9, 11);

            test('new stock needs scan-verified Local AI before auto-save', () {
              final draft = _draft();
              final resolution = resolveIntakeDraft(
                draft: draft,
                records: const <Medicine>[],
                today: today,
              );
              expect(
                scanAutoSaveDecision(
                  draft,
                  resolution,
                  localAiVerified: false,
                ).allowed,
                isFalse,
              );
              expect(
                scanAutoSaveDecision(
                  draft,
                  resolution,
                  localAiVerified: true,
                ).allowed,
                isTrue,
              );
            });

            test('machine commit has a stronger 0.88 core confidence floor', () {
              final draft = _draft(coreConfidence: .87);
              final resolution = resolveIntakeDraft(
                draft: draft,
                records: const <Medicine>[],
                today: today,
              );
              final decision = scanAutoSaveDecision(
                draft,
                resolution,
                localAiVerified: true,
              );
              expect(decision.allowed, isFalse);
              expect(decision.reason, contains('source-verified'));
            });

            test('exact existing lot can never silently become a duplicate row', () {
              final draft = _draft();
              final resolution = resolveIntakeDraft(
                draft: draft,
                records: <Medicine>[_savedLot()],
                today: today,
              );
              expect(resolution.kind, IntakeResolutionKind.exactLot);
              final decision = scanAutoSaveDecision(
                draft,
                resolution,
                localAiVerified: true,
              );
              expect(decision.allowed, isFalse);
              expect(decision.reason, contains('existing stock row'));
            });

            test('trusted different batch may auto-save as a distinct batch', () {
              final draft = _draft(batch: 'B-200');
              final resolution = resolveIntakeDraft(
                draft: draft,
                records: <Medicine>[_savedLot()],
                today: today,
              );
              expect(resolution.kind, IntakeResolutionKind.sameProduct);
              final decision = scanAutoSaveDecision(
                draft,
                resolution,
                localAiVerified: true,
              );
              expect(decision.allowed, isTrue);
              expect(decision.isNewBatch, isTrue);
            });
          }
          '''))

          Path('docs/AARIS_SCAN_LOCAL_AI_AUTOSAVE_2026_09_11.md').write_text(dedent('''\
          # Aaris Scanner → Local AI → Safe Auto-Save

          ## Dependency tree

          `ScannerScreen` captures one still frame → `MedicineVisionService` runs OCR/barcode → `understandMedicineEvidenceMessage` creates deterministic medicine drafts → `ImportInboxScreen` captures the active Aaris Brain route → `LocalBrainRoutePolicy` verifies the owner switch, model identity, scan readiness and native lease → `LocalAiService.understand` sends bounded raw OCR to the selected on-device GGUF → `LocalScanHandoff` + `validateLocalScan` accept only exact source-backed facts → `resolveIntakeDraft` checks the live Medicine Database for product/lot collisions → `scanAutoSaveDecision` applies the stronger machine-commit gate → `medicineFromConfirmedScan` revalidates domain invariants → `PharmacyController.save(expectedRevision)` performs serialized CAS persistence.

          ## UI / state map

          User opens **Scan medicine** → points at one medicine → taps **Capture text** → still-frame OCR completes → scanner auto-submits without a second **Use scan** tap → review state immediately leases the active Local AI when Aaris Brain is enabled → validated AI evidence is merged into the deterministic draft → exactly one safe new-stock/new-batch draft auto-saves → the controller revision changes → UI refreshes from the authoritative database.

          If Local AI is absent/off, its scan smoke test is not verified, more than one medicine is detected, evidence conflicts, core confidence is below 0.88, an exact lot already exists, or inventory changes during reasoning, automatic save stops and the existing review UI remains authoritative.

          ## Surgical intersection

          The LLM never presses a database button and never receives mutation authority. Automation is injected after validated Local-AI enrichment and immediately before the existing CAS save boundary. OCR/LLM work remains probabilistic upstream; duplicate detection, lot integrity, chronology, confidence and persistence stay deterministic.

          ## Safety invariants

          - Direct camera scanner only; photo/video/text/prepared batch imports keep explicit review.
          - Exactly one medicine draft for automatic commit.
          - Aaris Brain must be enabled and the active Local AI must be scan-verified and must successfully review this exact draft.
          - Brand, Salt, Strength and Form must each be non-conflicting and at least 0.88 confidence.
          - Existing `scanQuickAddDecision` must also pass.
          - Exact saved lots and ambiguous matches never auto-create duplicate rows.
          - Live inventory is re-resolved immediately before commit.
          - `expectedRevision` CAS remains the final persistence authority.
          - One scanner screen gets one auto-save attempt; any race/failure falls back to review rather than silently retrying a write.
          '''))
          PY

      - name: Format patched Dart
        run: dart format lib/domain/medicine_scan_commit.dart lib/ui/import_screen.dart lib/services/local_ai_service_io.dart test/scan_auto_save_decision_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Focused scanner automation tests
        run: flutter test --reporter expanded test/scan_auto_save_decision_test.dart test/intake_resolution_test.dart test/local_ai_resilience_test.dart test/medicine_intake_concurrency_test.dart
      - name: Commit verified upgrade and remove one-shot surgeon
        shell: bash
        run: |
          rm -f .github/workflows/aaris-scan-local-ai-autosave-upgrade.yml
          git config user.name 'Aaris Upgrade Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No upgrade changes produced.' >&2
            exit 1
          fi
          git commit -m 'Upgrade scanner Local AI safe autosave'
          git push origin HEAD:main
