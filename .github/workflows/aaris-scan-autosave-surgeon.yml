name: Aaris scan autosave surgeon
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aaris-scan-autosave-surgeon.yml
permissions:
  contents: write
concurrency:
  group: aaris-scan-autosave-surgeon
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.event.head_commit.message == 'Start Aaris scan autosave surgeon'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply exact surgical stages
        run: |
          python3 tool/aaris_scan_autosave_stage1.py
          python3 tool/aaris_scan_autosave_stage2.py
          python3 tool/aaris_scan_autosave_stage3.py
          python3 tool/aaris_scan_autosave_stage4.py
      - name: Format
        run: dart format lib/domain/medicine_scan_commit.dart lib/ui/import_screen.dart lib/ui/scanner_screen.dart lib/services/local_ai_service_io.dart test/scan_auto_save_decision_test.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Focused tests
        run: flutter test --reporter expanded test/scan_auto_save_decision_test.dart test/intake_resolution_test.dart test/local_ai_resilience_test.dart test/medicine_intake_concurrency_test.dart
      - name: Full regression tests
        run: flutter test
      - name: Android debug integration build
        run: flutter build apk --debug
      - name: Commit verified upgrade
        run: |
          rm -f tool/aaris_scan_autosave_stage1.py tool/aaris_scan_autosave_stage2.py tool/aaris_scan_autosave_stage3.py tool/aaris_scan_autosave_stage4.py
          rm -f .github/workflows/aaris-scan-local-ai-autosave-upgrade.yml
          rm -f .github/workflows/aaris-scan-autosave-surgeon.yml
          git config user.name 'Aaris Upgrade Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No verified changes produced'; exit 1; }
          git commit -m 'Upgrade scanner Local AI safe autosave'
          git push origin HEAD:main
