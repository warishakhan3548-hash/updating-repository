name: Build audited release APK

on:
  push:
    branches:
      - build/release-apk-audit-20260925
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audited-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify offline corpus and Android sources
        run: |
          set -euo pipefail
          python3 tools/build_content.py
          python3 tools/prepare_open_hadith_data.py
          python3 tools/build_hadith.py --source build/generated/hadith-source
          ANDROID_JAR="${ANDROID_HOME}/platforms/android-35/android.jar"
          AAPT2="${ANDROID_HOME}/build-tools/35.0.0/aapt2"
          python3 tools/check.py --android-jar "$ANDROID_JAR" --aapt2 "$AAPT2"
          python3 tools/check_hadith.py
      - name: Build release variant
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
      - name: Sign installable audited release APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          PASS="$(openssl rand -hex 20)"
          keytool -genkeypair -noprompt             -keystore "$RUNNER_TEMP/aaris-audited-release.keystore"             -storepass "$PASS" -keypass "$PASS"             -alias aaris-audited-release -keyalg RSA -keysize 2048 -validity 3650             -dname "CN=Aaris Quran Audited Release,O=Aaris,C=IN"
          mkdir -p release-output
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" release-output/AarisQuran-audited-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign             --ks "$RUNNER_TEMP/aaris-audited-release.keystore"             --ks-key-alias aaris-audited-release             --ks-pass "pass:$PASS" --key-pass "pass:$PASS"             --out release-output/AarisQuran-audited-release.apk             release-output/AarisQuran-audited-release-aligned.apk
          rm release-output/AarisQuran-audited-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release-output/AarisQuran-audited-release.apk             | tee release-output/signing-verification.txt
          sha256sum release-output/AarisQuran-audited-release.apk | tee release-output/SHA256.txt
          printf 'source_commit=3366740c3b22cd14962eb26ff3fd80f3ea628681\nvariant=release\nsigning=ephemeral-ci-test-key\n'             > release-output/build-info.txt
      - name: Upload audited release APK
        uses: actions/upload-artifact@v4
        with:
          name: AarisQuran-audited-release
          path: release-output/
          if-no-files-found: error
          retention-days: 7
