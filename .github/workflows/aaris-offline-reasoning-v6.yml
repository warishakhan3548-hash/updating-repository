name: Aaris offline reasoning engine v6
on:
  push:
    branches:
      - upgrade/offline-reasoning-v6
    paths:
      - .github/workflows/aaris-offline-reasoning-v6.yml
permissions:
  contents: write
concurrency:
  group: aaris-offline-reasoning-v6
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.event.head_commit.message == 'Run Aaris offline reasoning upgrade v6'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: upgrade/offline-reasoning-v6
      - name: Apply V6 surgical core patch
        run: python3 tool/one_shot_offline_reasoning_v6.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format and verify focused engine
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/domain/medicine_resolution_v2.dart test/medicine_resolution_v2_test.dart
          flutter pub get
          dart analyze lib test tool third_party/lib_llama_cpp/lib
          flutter test test/medicine_resolution_v2_test.dart test/offline_decision_engine_test.dart test/offline_search_evidence_v4_test.dart --reporter expanded
      - name: Run complete regression suite
        run: flutter test --reporter expanded
      - name: Verify Android integration build
        run: flutter build apk --debug --no-pub
      - name: Commit verified V6 engine to branch
        shell: bash
        run: |
          git checkout -- pubspec.lock 2>/dev/null || true
          git config user.name 'Aaris Pharmacy Upgrade Bot'
          git config user.email 'warishakhan3548@gmail.com'
          git add lib/domain/medicine_resolution_v2.dart test/medicine_resolution_v2_test.dart docs/OFFLINE_DECISION_ENGINE_MAP.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No V6 source diff produced'; exit 1; }
          git commit -m 'Upgrade offline medicine reasoning engine to V6 [skip ci]'
          git push origin HEAD:upgrade/offline-reasoning-v6
