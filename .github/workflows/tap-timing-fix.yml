name: Tap Timing Fix

permissions:
  contents: write

on:
  push:
    branches:
      - fix/v1.8.37-tap-timing

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Apply clock-domain fix and regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui = Path("app/src/main/java/com/aaris/remoteassist/ui/InlineRemoteControllerView.kt")
          text = ui.read_text()

          assert text.count("import android.os.SystemClock\n") == 1
          text = text.replace("import android.os.SystemClock\n", "")

          old_finish_call = '''                    finishSingleGesture(\n                        session = s,\n                        geometry = g,\n                        upX = event.x,\n                        upY = event.y\n                    )'''
          new_finish_call = '''                    finishSingleGesture(\n                        session = s,\n                        geometry = g,\n                        upX = event.x,\n                        upY = event.y,\n                        upEventTimeMs = event.eventTime\n                    )'''
          assert text.count(old_finish_call) == 1
          text = text.replace(old_finish_call, new_finish_call)

          assert text.count("sendMultiTouchGesture(s, g)") == 2
          text = text.replace(
              "sendMultiTouchGesture(s, g)",
              "sendMultiTouchGesture(s, g, event.eventTime)"
          )

          old_finish_sig = '''    private fun finishSingleGesture(\n        session: ControllerWebRtcSession,\n        geometry: RemoteGeometry,\n        upX: Float,\n        upY: Float\n    ) {\n        val rawDuration =\n            (\n                SystemClock.elapsedRealtime() - downAt\n                ).toInt()\n                .coerceIn(1, 2_500)'''
          new_finish_sig = '''    private fun finishSingleGesture(\n        session: ControllerWebRtcSession,\n        geometry: RemoteGeometry,\n        upX: Float,\n        upY: Float,\n        upEventTimeMs: Long\n    ) {\n        val rawDuration =\n            RemoteGestureTiming.durationMs(\n                startEventTimeMs = downAt,\n                endEventTimeMs = upEventTimeMs,\n                minMs = 1,\n                maxMs = 2_500\n            )'''
          assert text.count(old_finish_sig) == 1
          text = text.replace(old_finish_sig, new_finish_sig)

          old_multi = '''    private fun sendMultiTouchGesture(\n        session: ControllerWebRtcSession,\n        geometry: RemoteGeometry\n    ) {'''
          new_multi = '''    private fun sendMultiTouchGesture(\n        session: ControllerWebRtcSession,\n        geometry: RemoteGeometry,\n        eventTimeMs: Long\n    ) {'''
          assert text.count(old_multi) == 1
          text = text.replace(old_multi, new_multi)

          old_multi_duration = '''        val rawDuration =\n            (\n                SystemClock.elapsedRealtime() - multiDownAt\n                ).toInt()\n                .coerceIn(80, 2_500)'''
          new_multi_duration = '''        val rawDuration =\n            RemoteGestureTiming.durationMs(\n                startEventTimeMs = multiDownAt,\n                endEventTimeMs = eventTimeMs,\n                minMs = 80,\n                maxMs = 2_500\n            )'''
          assert text.count(old_multi_duration) == 1
          text = text.replace(old_multi_duration, new_multi_duration)

          ui.write_text(text)

          timing = Path("app/src/main/java/com/aaris/remoteassist/ui/RemoteGestureTiming.kt")
          timing.write_text('''package com.aaris.remoteassist.ui\n\n/**\n * Computes remote gesture durations only from MotionEvent.eventTime values.\n *\n * MotionEvent.eventTime uses the uptime clock. Mixing it with\n * SystemClock.elapsedRealtime includes time spent in deep sleep and can turn a\n * short physical tap into an apparent multi-second press. Keeping both ends in\n * the same clock domain preserves the user's real touch duration.\n */\ninternal object RemoteGestureTiming {\n    fun durationMs(\n        startEventTimeMs: Long,\n        endEventTimeMs: Long,\n        minMs: Int,\n        maxMs: Int\n    ): Int {\n        require(minMs >= 0)\n        require(maxMs >= minMs)\n\n        val elapsed =\n            (endEventTimeMs - startEventTimeMs)\n                .coerceAtLeast(0L)\n                .coerceAtMost(Int.MAX_VALUE.toLong())\n\n        return elapsed.toInt().coerceIn(minMs, maxMs)\n    }\n}\n''')

          test = Path("app/src/test/java/com/aaris/remoteassist/ui/RemoteGestureTimingTest.kt")
          test.write_text('''package com.aaris.remoteassist.ui\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Test\n\nclass RemoteGestureTimingTest {\n    @Test\n    fun shortTapKeepsActualEventDuration() {\n        assertEquals(\n            120,\n            RemoteGestureTiming.durationMs(\n                startEventTimeMs = 10_000L,\n                endEventTimeMs = 10_120L,\n                minMs = 1,\n                maxMs = 2_500\n            )\n        )\n    }\n\n    @Test\n    fun sub300msTapNeverBecomesLongPressBecauseOfClockOffset() {\n        assertEquals(\n            240,\n            RemoteGestureTiming.durationMs(\n                startEventTimeMs = 4_000_000L,\n                endEventTimeMs = 4_000_240L,\n                minMs = 1,\n                maxMs = 2_500\n            )\n        )\n    }\n\n    @Test\n    fun longPressKeepsRealHoldDuration() {\n        assertEquals(\n            700,\n            RemoteGestureTiming.durationMs(\n                startEventTimeMs = 1_000L,\n                endEventTimeMs = 1_700L,\n                minMs = 1,\n                maxMs = 2_500\n            )\n        )\n    }\n\n    @Test\n    fun multiTouchUsesSameEventClockAndBounds() {\n        assertEquals(\n            80,\n            RemoteGestureTiming.durationMs(\n                startEventTimeMs = 3_000L,\n                endEventTimeMs = 3_030L,\n                minMs = 80,\n                maxMs = 2_500\n            )\n        )\n        assertEquals(\n            2_500,\n            RemoteGestureTiming.durationMs(\n                startEventTimeMs = 3_000L,\n                endEventTimeMs = 9_000L,\n                minMs = 80,\n                maxMs = 2_500\n            )\n        )\n    }\n\n    @Test\n    fun outOfOrderEventIsFailSafeNotHugeDuration() {\n        assertEquals(\n            1,\n            RemoteGestureTiming.durationMs(\n                startEventTimeMs = 5_000L,\n                endEventTimeMs = 4_900L,\n                minMs = 1,\n                maxMs = 2_500\n            )\n        )\n    }\n}\n''')

          gradle = Path("app/build.gradle.kts")
          build = gradle.read_text()
          assert "versionCode = 84" in build
          assert 'versionName = "1.8.36"' in build
          build = build.replace("versionCode = 84", "versionCode = 85")
          build = build.replace('versionName = "1.8.36"', 'versionName = "1.8.37"')
          gradle.write_text(build)
          PY

      - name: Verify regression fix
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aaris/remoteassist/ui/InlineRemoteControllerView.kt \
                  app/src/main/java/com/aaris/remoteassist/ui/RemoteGestureTiming.kt \
                  app/src/test/java/com/aaris/remoteassist/ui/RemoteGestureTimingTest.kt \
                  app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: preserve real remote tap duration"
          git push origin HEAD:fix/v1.8.37-tap-timing
