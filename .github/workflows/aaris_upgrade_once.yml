name: One-shot Aaris operations upgrade
on:
  push:
    branches:
      - upgrade/aaris-ops-brain-analytics-20260910
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/aaris-ops-brain-analytics-20260910
          fetch-depth: 0
      - name: Apply asserted surgical patches
        run: python3 tool/one_shot_aaris_ops_upgrade.py
      - name: Remove one-shot machinery
        run: |
          rm -f tool/one_shot_aaris_ops_upgrade.py
          rm -f .github/workflows/aaris_upgrade_once.yml
      - name: Commit upgraded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Upgrade Aaris Brain analytics and ordering safety"
          git push origin HEAD:upgrade/aaris-ops-brain-analytics-20260910
