name: Verify offline trusted translations

on:
  push:
    branches:
      - 'upgrade/**'
      - 'audit/**'
    paths:
      - '.github/workflows/verify-offline-translations.yml'
      - 'tools/**'
      - 'source-vault/translations/**'
      - 'source-vault/hadith/hadeethenc/**'
      - 'source-vault/hadith/open-hadith-data/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/wrapper/**'
      - 'app/build.gradle'
      - 'core/**'
      - 'app/src/main/java/com/aaris/quran/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-offline-translations.yml'
      - 'tools/**'
      - 'source-vault/translations/**'
      - 'source-vault/hadith/hadeethenc/**'
      - 'source-vault/hadith/open-hadith-data/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/wrapper/**'
      - 'app/build.gradle'
      - 'core/**'
      - 'app/src/main/java/com/aaris/quran/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
  workflow_dispatch:

concurrency:
  # A branch push and its PR event describe the same code. Key both by the head branch so the
  # expensive evidence rebuild + Android verification runs once instead of twice per checkpoint.
  group: offline-translations-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Rebuild all local evidence from checked-in sources
        run: |
          set -euo pipefail
          python3 tools/build_content.py
          python3 tools/prepare_open_hadith_data.py
          python3 tools/build_hadith.py --source build/generated/hadith-source
      - name: Run offline integrity and search regressions
        run: |
          set -euo pipefail
          ANDROID_JAR="${ANDROID_HOME:-}/platforms/android-35/android.jar"
          AAPT2="${ANDROID_HOME:-}/build-tools/35.0.0/aapt2"
          if [[ -f "$ANDROID_JAR" && -x "$AAPT2" ]]; then
            python3 tools/check.py --android-jar "$ANDROID_JAR" --aapt2 "$AAPT2"
          else
            python3 tools/check.py
          fi
          python3 tools/check_hadith.py
      - name: Verify Android debug and release packaging and lint
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug :app:lintDebug \
            :app:assembleRelease :app:bundleRelease :app:lintRelease
