name: Harden Brain Command Error Boundary

on:
  push:
    branches:
      - upgrade/aaris-brain-quick-intake-20260910

permissions:
  contents: write

concurrency:
  group: harden-brain-command-error-boundary
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard command parsing failures
        run: python3 tool/harden_brain_command_error_boundary.py

      - name: Reject whitespace damage
        run: git diff --check

      - name: Commit hardened production change
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            tool/harden_brain_command_error_boundary.py \
            .github/workflows/harden-brain-command-error-boundary.yml
          git add lib/ui/brain_screen.dart
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "aaris-upgrade-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Guard Aaris Brain command parsing failures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
