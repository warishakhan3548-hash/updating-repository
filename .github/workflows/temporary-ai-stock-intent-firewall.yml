name: Temporary AI stock-intent firewall verification
on:
  push:
    branches: [upgrade/ai-stock-intent-firewall-20260910]
permissions:
  contents: write
concurrency:
  group: ai-stock-intent-firewall
  cancel-in-progress: false
jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[ai-stock-intent-firewall]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/ai-stock-intent-firewall-20260910
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply guarded surgery
        run: python3 tool/temporary_ai_stock_intent_firewall.py
      - name: Format changed Dart
        run: dart format lib/domain/ai_protocol.dart lib/ui/ai_screen.dart test/ai_stock_intent_firewall_test.dart
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Focused AI stock firewall tests
        run: flutter test test/ai_stock_intent_firewall_test.dart --reporter expanded
      - name: Full regression suite
        run: flutter test --reporter expanded
      - name: Diff whitespace integrity
        run: |
          git checkout -- pubspec.lock 2>/dev/null || true
          git diff --check
      - name: Commit verified production changes
        run: |
          rm tool/temporary_ai_stock_intent_firewall.py
          rm .github/workflows/temporary-ai-stock-intent-firewall.yml
          git config user.name "Aaris Pharmacy Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/domain/ai_protocol.dart lib/ui/ai_screen.dart test/ai_stock_intent_firewall_test.dart
          git add -u tool/temporary_ai_stock_intent_firewall.py .github/workflows/temporary-ai-stock-intent-firewall.yml
          git diff --cached --check
          git commit -m "Make AI stock quantities explicit and review-gated [ai-stock-intent-firewall]"
          git push origin HEAD:upgrade/ai-stock-intent-firewall-20260910
