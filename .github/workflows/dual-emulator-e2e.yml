name: Dual Emulator Real E2E

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

jobs:
  dual-emulator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager             "platform-tools"             "emulator"             "platforms;android-36"             "system-images;android-33;google_apis;x86_64"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Create two Android phones
        shell: bash
        run: |
          set -euo pipefail
          echo no | avdmanager create avd             -n aaris-host             -k "system-images;android-33;google_apis;x86_64"             --force
          echo no | avdmanager create avd             -n aaris-controller             -k "system-images;android-33;google_apis;x86_64"             --force

          sudo chmod 666 /dev/kvm || true

          nohup emulator @aaris-host             -port 5554             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             -accel on             -memory 1536             -cores 2             > host-emulator.log 2>&1 &

          nohup emulator @aaris-controller             -port 5556             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             -accel on             -memory 1536             -cores 2             > controller-emulator.log 2>&1 &

          wait_boot() {
            serial="$1"
            adb -s "$serial" wait-for-device
            for _ in $(seq 1 120); do
              if [ "$(adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                return 0
              fi
              sleep 2
            done
            echo "$serial did not boot" >&2
            return 1
          }

          wait_boot emulator-5554 &
          p1=$!
          wait_boot emulator-5556 &
          p2=$!
          wait "$p1"
          wait "$p2"

      - name: Install and prepare both phones
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SERVICE="com.aaris.remoteassist/com.aaris.remoteassist.accessibility.AssistAccessibilityService"

          for serial in emulator-5554 emulator-5556; do
            adb -s "$serial" install -r "$APK"
            adb -s "$serial" shell settings put global window_animation_scale 0
            adb -s "$serial" shell settings put global transition_animation_scale 0
            adb -s "$serial" shell settings put global animator_duration_scale 0
            adb -s "$serial" shell pm grant               com.aaris.remoteassist               android.permission.POST_NOTIFICATIONS || true
            adb -s "$serial" shell settings put secure enabled_accessibility_services "$SERVICE"
            adb -s "$serial" shell settings put secure accessibility_enabled 1
            adb -s "$serial" shell input keyevent KEYCODE_WAKEUP || true
            adb -s "$serial" shell wm dismiss-keyguard || true
          done

      - name: Run real screen-share and remote-gesture matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dual-e2e
          python3 tools/dual_emulator_e2e.py             --host emulator-5554             --controller emulator-5556             --out dual-e2e

      - name: Print E2E summary
        if: always()
        shell: bash
        run: |
          cat dual-e2e/summary.txt 2>/dev/null || true
          echo
          echo "===== HOST EMULATOR TAIL ====="
          tail -120 host-emulator.log 2>/dev/null || true
          echo
          echo "===== CONTROLLER EMULATOR TAIL ====="
          tail -120 controller-emulator.log 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Aaris-Dual-Emulator-Real-E2E
          path: |
            dual-e2e
            host-emulator.log
            controller-emulator.log
          if-no-files-found: warn
