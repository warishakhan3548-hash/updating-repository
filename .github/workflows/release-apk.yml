name: Aaris Pharmacy release signing guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-release-location:
    runs-on: ubuntu-latest
    steps:
      - name: Production releases are built in Codemagic
        run: |
          echo "Production APK/AAB signing is owned by codemagic.yaml."
          echo "Upload the permanent JKS to Codemagic with reference: aaris_permanent."
          echo "GitHub Actions intentionally does not hold or produce production signing keys."
