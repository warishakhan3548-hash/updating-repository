name: Aaris Pharmacy Release APK
# Release builder: committed repository source is authoritative. CI never rewrites
# production Dart code before analysis, tests, or APK generation.
# Release verification refreshed after Local AI/scanner static-gate cleanup.

on:
  push:
    branches:
      - build/final-apk-20260907
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'third_party/lib_llama_cpp/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aaris-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve pinned dependencies
        run: flutter pub get

      - name: Verify authoritative release source
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code

      # A production artifact must never be published from source that did not
      # pass the same deterministic safety gates as the application CI.
      - name: Static safety gate
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib

      - name: Full pharmacy regression gate
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release APK
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee build/app-release.sha256
          printf '%s\n' \
            "base_commit=${GITHUB_SHA}" \
            "ref=${GITHUB_REF_NAME}" \
            "source_mode=committed-repository-source-no-runtime-patches" \
            > build/app-release-source.txt

      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: Aaris-Pharmacy-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app-release.sha256
            build/app-release-source.txt
          if-no-files-found: error
          retention-days: 30
