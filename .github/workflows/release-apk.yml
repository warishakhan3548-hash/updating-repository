name: Aaris Pharmacy Release APK
# Rebuild marker for latest main APK generation (2026-09-08 16:12 UTC)

on:
  push:
    branches:
      - build/final-apk-20260907
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aaris-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release APK
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee build/app-release.sha256

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Aaris-Pharmacy-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app-release.sha256
          if-no-files-found: error
          retention-days: 30
