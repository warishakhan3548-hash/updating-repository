name: Aaris Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Sign installable release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/aaris-test-release.jks" \
            -storepass aaris-test-release \
            -keypass aaris-test-release \
            -alias aaris \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Aaris Test Release,O=Aaris,C=IN"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/Aaris-Quran-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/aaris-test-release.jks" \
            --ks-pass pass:aaris-test-release \
            --key-pass pass:aaris-test-release \
            --out "$GITHUB_WORKSPACE/Aaris-Quran-release.apk" \
            "$RUNNER_TEMP/Aaris-Quran-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/Aaris-Quran-release.apk"
          ls -lh "$GITHUB_WORKSPACE/Aaris-Quran-release.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Aaris-Quran-release
          path: Aaris-Quran-release.apk
          if-no-files-found: error
          retention-days: 7
