name: Aaris final exact verification
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
concurrency:
  group: aaris-final-exact-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify-exact-source:
    if: github.head_ref == 'upgrade/aaris-operational-brain-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/aaris-operational-brain-20260910
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Verify Dart formatting without rewriting source
        run: dart format --output=none --set-exit-if-changed lib test third_party/lib_llama_cpp/lib
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Full regression suite
        run: flutter test --reporter expanded
      - name: Restore tool-generated migration noise
        run: |
          git checkout -- analysis_options.yaml
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
      - name: Assert production source stayed byte-for-byte unchanged
        run: git diff --exit-code -- lib test docs pubspec.yaml pubspec.lock analysis_options.yaml android
      - name: Remove verifier after successful exact run
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aaris-final-exact-verification.yml
          git commit -m "Remove completed exact verification workflow"
          git push origin "HEAD:upgrade/aaris-operational-brain-20260910"
