name: Capture QuranEnc arabic_seraj v1.0.0 snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/capture-quranenc-api-snapshot.yml'
      - 'tools/capture_quranenc_gloss.py'
      - 'tools/verify_quranenc_gloss_snapshot.py'
      - 'tests/test_quranenc_gloss_capture.py'

permissions:
  contents: write

concurrency:
  group: capture-quranenc-api-snapshot-v1-0-0
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'quranenc-offline-snapshot-verification-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13.15'

      - name: Validate acquisition and offline-verification code
        run: python -m unittest tests/test_quranenc_gloss_capture.py -v

      - name: Capture exact QuranEnc API bytes once
        shell: bash
        run: |
          set -euo pipefail
          VAULT='source-vault/quran-gloss/quranenc/arabic-seraj/1.0.0'

          if [[ -d "$VAULT" ]]; then
            echo 'Immutable QuranEnc snapshot already exists; validating only.'
            python tools/verify_quranenc_gloss_snapshot.py
            exit 0
          fi

          python tools/capture_quranenc_gloss.py
          python tools/verify_quranenc_gloss_snapshot.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$VAULT"
          git commit -m 'Capture QuranEnc arabic_seraj v1.0.0 source snapshot'

          # Revalidate the exact tree that is about to be pushed.
          python tools/verify_quranenc_gloss_snapshot.py
          python -m unittest tests/test_quranenc_gloss_capture.py -v

          if [[ -n "$(git status --porcelain)" ]]; then
            echo 'Validation changed the committed capture; refusing to push.' >&2
            git status --short >&2
            exit 1
          fi

          git push origin "HEAD:${GITHUB_HEAD_REF}"
