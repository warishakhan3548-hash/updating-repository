name: Signed Android Release

# Run only on the protected main branch. Never expose signing secrets to PR builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CM_KEY_ALIAS: upload
      CM_KEYSTORE_PASSWORD: ${{ secrets.AARIS_UPLOAD_STORE_PASSWORD }}
      CM_KEY_PASSWORD: ${{ secrets.AARIS_UPLOAD_KEY_PASSWORD }}
      UPLOAD_KEYSTORE_B64: ${{ secrets.AARIS_UPLOAD_KEYSTORE_BASE64 }}
      EXPECTED_CERT_SHA256: "33:0D:16:11:84:9C:7C:9B:1F:9F:59:2C:45:89:32:F2:5A:E6:F3:AB:A1:BC:7E:8A:BF:BC:9E:68:68:EF:00:4F"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Restore and verify private release signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${UPLOAD_KEYSTORE_B64}" || -z "${CM_KEYSTORE_PASSWORD}" || -z "${CM_KEY_PASSWORD}" ]]; then
            echo "Release signing secrets are missing. See docs/RELEASE_SIGNING.md."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/aaris-upload.jks"
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          # Make path visible to later steps; passwords remain GitHub secrets.
          echo "CM_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

          # Refuse to sign with any certificate other than the user-supplied key.
          if ! keytool -list -v \
            -alias "$CM_KEY_ALIAS" \
            -keystore "$KEYSTORE" \
            -storepass:env CM_KEYSTORE_PASSWORD \
            | grep -Fq "SHA256: $EXPECTED_CERT_SHA256"; then
            echo "Keystore alias, password or certificate fingerprint does not match."
            exit 1
          fi

      - name: Build signed release APK (CI tests run separately)
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease \
            -PrequireReleaseSigning=true --stacktrace

      - name: Validate, fingerprint, and stage signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          SDK_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools"
          APKSIGNER="$(find "$SDK_TOOLS" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$SDK_TOOLS" -type f -name zipalign | sort -V | tail -1)"
          AAPT="$(find "$SDK_TOOLS" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -x "$AAPT"

          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Eq 'Verified using v(2|3) scheme.*true'
          EXPECTED_HEX="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Fiq "certificate SHA-256 digest: $EXPECTED_HEX"
          "$ZIPALIGN" -c 4 "$APK"

          PACKAGE="$("$AAPT" dump badging "$APK" | grep -m1 "^package: ")"
          printf '%s\n' "$PACKAGE" | grep -Fq "name='com.aaris.remoteassist'"
          VERSION_NAME="$(printf '%s\n' "$PACKAGE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test -n "$VERSION_NAME"

          mkdir -p signed-release
          FINAL_APK="signed-release/AarisRemote-${VERSION_NAME}-signed-release.apk"
          cp "$APK" "$FINAL_APK"
          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK" >/dev/null
          sha256sum "$FINAL_APK" > "$FINAL_APK.sha256"
          echo "Signed and validated release APK: $FINAL_APK"

      - name: Publish signed APK as private workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: AarisRemote-signed-release
          path: signed-release/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary private key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/aaris-upload.jks"
