name: Release APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/release-apk-bootstrap.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Restore Firebase config when configured
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          fi
      - name: Test, lint and assemble release
        run: gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace
      - name: Record release metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/AarisRemote-1.5.0-release-unsigned.apk"
          sha256sum "$RUNNER_TEMP/AarisRemote-1.5.0-release-unsigned.apk" > "$RUNNER_TEMP/release-unsigned-sha256.txt"
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: AarisRemote-1.5.0-release-unsigned
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/AarisRemote-1.5.0-release-unsigned.apk
            ${{ runner.temp }}/release-unsigned-sha256.txt
