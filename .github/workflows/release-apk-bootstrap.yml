name: Release APK Bootstrap

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/release-apk-bootstrap.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore Firebase config when configured
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          fi

      - name: Generate dedicated Aaris Remote release key
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          keytool -genkeypair             -keystore "$RUNNER_TEMP/aaris-remote-release.jks"             -storepass "$PASS"             -keypass "$PASS"             -alias aaris-remote             -keyalg RSA             -keysize 4096             -validity 10000             -dname "CN=Aaris Remote,O=Aaris,C=IN"
          printf '%s\n' "$PASS" > "$RUNNER_TEMP/release-key-password.txt"
          {
            echo "Alias: aaris-remote"
            keytool -list -v               -keystore "$RUNNER_TEMP/aaris-remote-release.jks"               -storepass "$PASS"               -alias aaris-remote | grep -E "Valid from:|SHA256:"
          } > "$RUNNER_TEMP/release-key-info.txt"

      - name: Test, lint and assemble release
        run: gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace

      - name: Zipalign and sign release APK
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(cat "$RUNNER_TEMP/release-key-password.txt")"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="$(find app/build/outputs/apk/release -type f -name '*-unsigned.apk' | head -1)"
          test -n "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -f -p 4             "$UNSIGNED"             "$RUNNER_TEMP/AarisRemote-1.5.0-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign             --ks "$RUNNER_TEMP/aaris-remote-release.jks"             --ks-key-alias aaris-remote             --ks-pass "pass:$PASS"             --key-pass "pass:$PASS"             --out "$RUNNER_TEMP/AarisRemote-1.5.0-release.apk"             "$RUNNER_TEMP/AarisRemote-1.5.0-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs             "$RUNNER_TEMP/AarisRemote-1.5.0-release.apk"             | tee "$RUNNER_TEMP/apk-signature-verification.txt"
          "$BUILD_TOOLS/aapt" dump badging             "$RUNNER_TEMP/AarisRemote-1.5.0-release.apk"             | head -20             | tee "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$RUNNER_TEMP/AarisRemote-1.5.0-release.apk"             | tee "$RUNNER_TEMP/apk-sha256.txt"

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: AarisRemote-1.5.0-release
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/AarisRemote-1.5.0-release.apk
            ${{ runner.temp }}/aaris-remote-release.jks
            ${{ runner.temp }}/release-key-password.txt
            ${{ runner.temp }}/release-key-info.txt
            ${{ runner.temp }}/apk-signature-verification.txt
            ${{ runner.temp }}/apk-badging.txt
            ${{ runner.temp }}/apk-sha256.txt
