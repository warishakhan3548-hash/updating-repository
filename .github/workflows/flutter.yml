name: Pharmacy checks
on:
  push:
    branches: [main, unified-medicine-evidence-v3]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pharmacy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-shot unified evidence surgery
        if: github.ref == 'refs/heads/unified-medicine-evidence-v3'
        run: |
          python3 tool/one_shot_unified_medicine_evidence_v3.py
          git config user.name "Aaris CI Surgeon"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Unify medicine evidence resolution and raw OCR search"
          git push origin HEAD:unified-medicine-evidence-v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Domain, persistence and UI checks
        run: flutter test --reporter expanded
      - name: Compile Android integration
        run: flutter build apk --debug --no-pub
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Aaris-Pharmacy-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload UI review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aaris-Pharmacy-UI-review
          path: |
            build/ui-review/*.png
          if-no-files-found: warn
          retention-days: 30
