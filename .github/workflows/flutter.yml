name: Pharmacy checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pharmacy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aaris-medicine-resolver-v2
          fetch-depth: 0
      - name: Apply resolver V2 one-shot finish
        if: github.event_name == 'pull_request' && github.head_ref == 'aaris-medicine-resolver-v2'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected patch anchor not found: {path}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'lib/domain/medicine_resolution_v2.dart',
              """class _ProductHypothesis {
  const _ProductHypothesis({
    required this.product,
    required this.score,
    required this.channels,
    required this.hardConflicts,
    required this.exactBarcode,
  });

  final CanonicalMedicineProduct product;
  final double score;
  final int channels;
  final int hardConflicts;
  final bool exactBarcode;
}
""",
              """class _ProductHypothesis {
  const _ProductHypothesis({
    required this.product,
    required this.score,
    required this.channels,
    required this.hardConflicts,
    required this.exactBarcode,
    required this.strongIdentity,
  });

  final CanonicalMedicineProduct product;
  final double score;
  final int channels;
  final int hardConflicts;
  final bool exactBarcode;
  final bool strongIdentity;
}
""",
          )

          replace(
              'lib/domain/medicine_resolution_v2.dart',
              """  return _ProductHypothesis(
    product: product,
    score: score.clamp(0, .999).toDouble(),
    channels: channels,
    hardConflicts: hardConflicts,
    exactBarcode: exactBarcode,
  );
""",
              """  return _ProductHypothesis(
    product: product,
    score: score.clamp(0, .999).toDouble(),
    channels: channels,
    hardConflicts: hardConflicts,
    exactBarcode: exactBarcode,
    strongIdentity: bestIdentity >= .88,
  );
""",
          )

          replace(
              'lib/domain/medicine_resolution_v2.dart',
              """    final hypotheses = candidates
        .map((product) => _scoreProduct(product, draft, frames))
        .where((value) => value.score >= .42)
        .toList(growable: false)
""",
              """    final hypotheses = candidates
        .map((product) => _scoreProduct(product, draft, frames))
        // Strong name/brand evidence remains safety-relevant even when a
        // contradictory identity field lowers the aggregate score below the
        // ordinary candidate threshold. Keep such a hypothesis only so the
        // contradiction is surfaced; hard conflicts still block inheritance.
        .where(
          (value) =>
              value.score >= .42 ||
              (value.hardConflicts > 0 &&
                  (value.exactBarcode || value.strongIdentity)),
        )
        .toList(growable: false)
""",
          )

          replace(
              'tool/check_local_ai.dart',
              """    nextMedicineIntakeJob(
          [job, reasoningJob, photoJob],
          allowReasoning: true,
          preferReasoning: true,
        ) ==
        photoJob,
    'Rapid photo OCR has priority over long video and model work',
""",
              """    nextMedicineIntakeJob(
          [job, reasoningJob, photoJob],
          allowReasoning: true,
          preferReasoning: false,
        ) ==
        photoJob,
    'Fresh photo OCR wins the capture lane after a reasoning turn',
""",
          )

          Path('tool/.resolver_v2_ci_recheck').unlink(missing_ok=True)
          Path('.github/workflows/resolver_v2_finish.yml').unlink(missing_ok=True)
          Path('.github/workflows/flutter.yml').write_text("""name: Pharmacy checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pharmacy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Domain, persistence and UI checks
        run: flutter test --reporter expanded
      - name: Compile Android integration
        run: flutter build apk --debug --no-pub
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Aaris-Pharmacy-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload UI review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aaris-Pharmacy-UI-review
          path: |
            build/ui-review/*.png
          if-no-files-found: warn
          retention-days: 30
""")
          PY
          git config user.name "Aaris Pharmacy CI Surgeon"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish resolver V2 conflict and scheduler checks"
          git push origin HEAD:aaris-medicine-resolver-v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Domain, persistence and UI checks
        run: flutter test --reporter expanded
      - name: Compile Android integration
        run: flutter build apk --debug --no-pub
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Aaris-Pharmacy-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload UI review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aaris-Pharmacy-UI-review
          path: |
            build/ui-review/*.png
          if-no-files-found: warn
          retention-days: 30
