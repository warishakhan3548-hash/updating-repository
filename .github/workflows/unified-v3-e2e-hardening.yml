name: Unified V3 E2E hardening
on:
  push:
    branches: [unified-medicine-evidence-v3]
    paths:
      - .github/workflows/unified-v3-e2e-hardening.yml
permissions:
  contents: write
concurrency:
  group: unified-v3-e2e-hardening
  cancel-in-progress: false
jobs:
  harden:
    if: github.event.head_commit.message == 'Run unified V3 E2E hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden patcher for paired raw-focus readers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tool/one_shot_e2e_flow_hardening.py')
          text = p.read_text()
          old = """    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f'{path}: expected one anchor, found {count}')\n    p.write_text(text.replace(old, new, 1), encoding='utf-8')\n"""
          new = """    count = text.count(old)\n    if path == 'lib/domain/medicine_evidence_focus.dart' and 'indexOf(medicineEvidenceFocusMarker)' in old:\n        if count not in (0, 2):\n            raise SystemExit(f'{path}: expected zero-or-two marker anchors, found {count}')\n        if count == 2:\n            p.write_text(text.replace(old, new), encoding='utf-8')\n        return\n    if count != 1:\n        raise SystemExit(f'{path}: expected one anchor, found {count}')\n    p.write_text(text.replace(old, new, 1), encoding='utf-8')\n"""
          if text.count(old) != 1:
              raise SystemExit('patcher guard anchor missing')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply E2E source hardening
        run: python3 tool/one_shot_e2e_flow_hardening.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format and static-check hardening
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/domain/gs1_healthcare.dart \
            lib/domain/medicine_evidence_focus.dart \
            lib/domain/medicine_resolution_v2.dart \
            lib/domain/search.dart \
            lib/services/canonical_medicine_catalog_service.dart \
            lib/services/medicine_intake_service.dart \
            lib/services/scan_service.dart \
            lib/ui/scanner_screen.dart
          flutter pub get
          dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Commit source hardening and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock 2>/dev/null || true
          rm -f .github/workflows/unified-v3-e2e-hardening.yml
          git config user.name 'Aaris CI Surgeon'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source hardening diff produced'; exit 1; }
          git commit -m 'Harden E2E scan and Local AI connectivity [skip ci]'
          git push origin HEAD:unified-medicine-evidence-v3
