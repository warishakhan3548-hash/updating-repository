name: Resolver V3 identity-anchor surgery
on:
  push:
    branches: [unified-medicine-evidence-v3]
    paths:
      - .github/workflows/resolver-v3-identity-anchor.yml
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply identity-anchor hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/one_shot_resolver_v3_identity_anchor.py
          rm .github/workflows/resolver-v3-identity-anchor.yml
          git config user.name "Aaris CI Surgeon"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Require printed identity before canonical brand inheritance"
          git push origin HEAD:unified-medicine-evidence-v3
