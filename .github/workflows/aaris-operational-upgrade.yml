name: Aaris operational Brain upgrade
on:
  push:
    branches:
      - upgrade/aaris-operational-brain-20260910
permissions:
  contents: write
concurrency:
  group: aaris-operational-upgrade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply surgical source upgrade
        run: python3 tool/aaris_operational_brain_upgrade.py
      - name: Remove one-shot upgrade machinery
        run: git rm tool/aaris_operational_brain_upgrade.py .github/workflows/aaris-operational-upgrade.yml
      - name: Format changed Dart sources
        run: dart format lib/domain/app_brain.dart lib/domain/brain_operations.dart lib/state/stock_location_operations.dart lib/ui/brain_screen.dart test/stock_location_operations_test.dart
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Full regression suite
        run: flutter test --reporter expanded
      - name: Commit verified upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Upgrade Aaris Brain with reviewed stock relocation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
