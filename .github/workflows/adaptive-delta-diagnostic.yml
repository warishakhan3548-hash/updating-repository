name: Adaptive Delta Diagnostic

on:
  push:
    branches:
      - upgrade/v1.8.39-adaptive-delta-screen

permissions:
  contents: read

jobs:
  compile-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/v1.8.39-adaptive-delta-screen
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6

      - name: Replay integration patches in worktree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/adaptive-delta-integrate.yml').read_text().splitlines()
          names = [
              'Patch control capability protocol',
              'Patch controller capability advertisement',
              'Patch host adaptive recovery policy',
              'Patch fallback WebRTC transport',
              'Harden authoritative fallback reference model',
              'Patch controller atomic delta compositor',
              'Bump version and add capability regression test',
          ]

          for name in names:
              marker = f'      - name: {name}'
              try:
                  start = workflow.index(marker)
              except ValueError:
                  raise SystemExit(f'missing workflow step: {name}')

              run_index = None
              for i in range(start + 1, len(workflow)):
                  if workflow[i].startswith('      - name:'):
                      break
                  if workflow[i] == '        run: |':
                      run_index = i
                      break
              if run_index is None:
                  raise SystemExit(f'missing run block: {name}')

              body = []
              for line in workflow[run_index + 1:]:
                  if line.startswith('      - name:'):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif line.strip() == '':
                      body.append('')
                  else:
                      break

              script = '\n'.join(body) + '\n'
              print(f'== replay: {name} ==')
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
          PY

      - name: Compile and print focused diagnostics
        shell: bash
        run: |
          set +e
          ./gradlew :app:compileDebugKotlin --stacktrace > /tmp/compile.log 2>&1
          code=$?
          echo "=== focused compiler diagnostics ==="
          grep -E "(^e: | error: |Compilation error|FAILURE:|What went wrong|FAILED|Unresolved reference|Type mismatch|overrides nothing|No value passed)" /tmp/compile.log | tail -n 160 || true
          echo "=== final gradle lines ==="
          tail -n 60 /tmp/compile.log
          exit "$code"
