name: Aaris atomic Brain work-command upgrade

on:
  push:
    branches:
      - aaris/atomic-work-command-20260910
    paths:
      - '.github/workflows/aaris-atomic-work-command-upgrade.yml'

permissions:
  contents: write

concurrency:
  group: aaris-atomic-work-command-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical source upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/aaris_atomic_work_command_upgrade_fix.py
          python3 tool/aaris_atomic_work_command_upgrade.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Format and verify complete application
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/domain/app_brain.dart \
            lib/domain/brain_compound_operations.dart \
            lib/state/pharmacy_controller.dart \
            lib/ui/brain_screen.dart \
            test/brain_compound_stock_operation_test.dart \
            test/brain_temporal_target_test.dart
          flutter pub get
          dart analyze lib test tool third_party/lib_llama_cpp/lib
          flutter test test/brain_compound_stock_operation_test.dart test/brain_temporal_target_test.dart --reporter expanded
          flutter test --reporter expanded
          flutter build apk --debug --no-pub

      - name: Commit only verified production source
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- pubspec.lock 2>/dev/null || true
          git config user.name 'Aaris Pharmacy Upgrade Bot'
          git config user.email 'warishakhan3548@gmail.com'
          git rm -f \
            tool/aaris_atomic_work_command_upgrade.py \
            tool/aaris_atomic_work_command_upgrade_fix.py \
            .github/workflows/aaris-atomic-work-command-upgrade.yml
          git add \
            lib/domain/app_brain.dart \
            lib/domain/brain_compound_operations.dart \
            lib/state/pharmacy_controller.dart \
            lib/ui/brain_screen.dart \
            test/brain_compound_stock_operation_test.dart \
            test/brain_temporal_target_test.dart \
            docs/ARCHITECTURE.md \
            docs/PROGRESS.md \
            docs/AARIS_ATOMIC_WORK_COMMANDS_2026_09_10.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No verified source diff produced'; exit 1; }
          git commit -m 'Upgrade Aaris Brain atomic stock work commands'
          git push origin HEAD:aaris/atomic-work-command-20260910
