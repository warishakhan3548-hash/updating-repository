name: Local AI smart guard upgrade
on:
  push:
    branches:
      - fix/local-ai-smart-guard-20260910
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-ai-smart-guard-20260910
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Patch core
        run: python3 .github/local_ai_smart_guard_patch.py
      - name: Format
        run: dart format lib/domain/model_catalogue.dart lib/domain/local_model.dart lib/domain/local_model_checks.dart lib/domain/gguf_metadata.dart lib/services/local_ai_runtime.dart lib/services/local_ai_service_io.dart lib/ui/local_models_panel.dart test/local_ai_smart_guard_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Focused smart guard tests
        run: flutter test test/local_ai_smart_guard_test.dart --reporter expanded
      - name: Static checks
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib
      - name: Full tests
        run: flutter test --reporter compact
      - name: Commit verified core upgrade
        run: |
          rm -f .github/workflows/local-ai-smart-guard-once.yml .github/local_ai_smart_guard_patch.py
          git config user.name "Aaris Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Local AI compatibility and adaptive activation"
          git push origin HEAD:fix/local-ai-smart-guard-20260910
