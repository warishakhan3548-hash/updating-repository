name: Local AI smart guard upgrade
on:
  push:
    branches: [fix/local-ai-smart-guard-20260910]
permissions:
  contents: write
jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[local-ai-smart-guard]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-ai-smart-guard-20260910
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Patch Local AI core
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              if n != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {n} for {old[:80]!r}')
              p.write_text(text.replace(old, new, count))

          # 1) Never surface auxiliary GGUF artifacts as standalone chat models.
          replace('lib/domain/model_catalogue.dart',
          """  if (RegExp(\n    r'(^|[_.-])(mmproj|projector|adapter|lora|tokenizer|vocab)([_.-]|$)',\n  ).hasMatch(base))\n    return 'Companion weights; not a standalone chat model';\n""",
          """  if (RegExp(\n    r'(^|[_.-])(mmproj|projector|adapter|lora|tokenizer|vocab|imatrix|importance|calibration)([_.-]|$)',\n  ).hasMatch(base))\n    return 'Companion or calibration data; not a standalone chat model';\n""")
          replace('lib/domain/local_model.dart',
          """        r'((^|[_.-])(mmproj|projector|adapter|lora|tokenizer|vocab)([_.-]|$)|\\d{5}-of-\\d{5})',\n""",
          """        r'((^|[_.-])(mmproj|projector|adapter|lora|tokenizer|vocab|imatrix|importance|calibration)([_.-]|$)|\\d{5}-of-\\d{5})',\n""")

          # 2) Separate technical runtime readiness from pharmacy semantic QA.
          p = Path('lib/domain/local_model_checks.dart')
          text = p.read_text()
          anchor = """const localSetupCheckVersion = 2;\n"""
          insert = """const localSetupCheckVersion = 2;\n\n/// Technical activation probe only. Pharmacy extraction quality is validated\n/// at the feature boundary, not confused with whether the native model loaded.\nconst localRuntimeProbeSystem =\n    'This is a device readiness check. Return one short non-empty reply.';\nconst localRuntimeProbeInput = 'Reply with READY.';\n\nbool passesLocalRuntimeProbe(String output) => output.trim().isNotEmpty;\n"""
          if text.count(anchor) != 1:
              raise SystemExit('local_model_checks anchor mismatch')
          p.write_text(text.replace(anchor, insert, 1))

          # 3) Allow low-context operation on memory-constrained phones.
          replace('lib/services/local_ai_runtime.dart',
          """    if (contextTokens < 2048 || contextTokens > 8192)\n      throw ArgumentError('Unsupported context budget.');\n""",
          """    if (contextTokens < 512 || contextTokens > 8192)\n      throw ArgumentError('Unsupported context budget.');\n""")

          # Replace the planner with mmap-aware, soft-admission planning.
          p = Path('lib/domain/gguf_metadata.dart')
          text = p.read_text()
          start = text.index('class LocalExecutionPlan {')
          end = text.index("\n}", text.index("StateError(\n    'Model weights + context cache", start)) + 2
          old = text[start:end]
          new = r'''class LocalExecutionPlan {
  const LocalExecutionPlan({
    required this.contextTokens,
    required this.estimatedBytes,
    required this.estimatedKvBytes,
    required this.geometryKnown,
    this.memoryWarning = false,
    this.budgetBytes,
  });
  final int contextTokens, estimatedBytes, estimatedKvBytes;
  final bool geometryKnown, memoryWarning;
  final int? budgetBytes;

  int get outputTokens => contextTokens <= 512
      ? 160
      : contextTokens <= 1024
      ? 256
      : contextTokens <= 2048
      ? 512
      : contextTokens <= 4096
      ? 1000
      : 1200;
  int get evidenceCharacters => contextTokens <= 512
      ? 700
      : contextTokens <= 1024
      ? 1200
      : contextTokens <= 2048
      ? 1800
      : contextTokens <= 4096
      ? 5000
      : 7000;
  int get inventoryRows => contextTokens <= 1024
      ? 1
      : contextTokens <= 2048
      ? 2
      : contextTokens <= 4096
      ? 3
      : 8;
  int get conversationCharacters => contextTokens <= 1024
      ? 250
      : contextTokens <= 2048
      ? 400
      : 1500;
}

/// Mmap-aware phone planning. This is a *soft* guard: it picks a conservative
/// context and raises a warning, but lets the native runtime make the final
/// allocation decision. File bytes are not treated as fully committed heap RAM.
LocalExecutionPlan planLocalExecution({
  required int weightBytes,
  required GgufMetadata metadata,
  int? totalMemory,
  int? availableMemory,
  bool lowMemory = false,
  bool phone = false,
  int? contextCeiling,
}) {
  if (weightBytes < 1024) {
    throw StateError('Model weights are incomplete.');
  }

  final totalBudget = totalMemory == null ? null : (totalMemory * .80).floor();
  // Android can reclaim page cache while llama.cpp mmaps weights. Give the
  // planner a bounded reclaim allowance instead of treating availMem as a wall.
  final availableBudget = availableMemory == null
      ? null
      : availableMemory + (phone ? 512 * _mib : 256 * _mib);
  final budget = totalBudget == null
      ? availableBudget
      : availableBudget == null
      ? totalBudget
      : math.min(totalBudget, availableBudget);

  final contexts = phone
      ? const [4096, 2048, 1024, 512]
      : const [8192, 4096, 2048, 1024, 512];
  LocalExecutionPlan? smallest;
  for (final context in contexts) {
    if (contextCeiling != null && context > contextCeiling) continue;
    if (metadata.contextLength != null && context > metadata.contextLength!) {
      continue;
    }
    final knownKv = metadata.kvBytes(context);
    // Unknown geometry used to reserve ~256 KiB/token, which rejected many
    // valid small models before native loading. Keep a safer 128 KiB/token
    // fallback and rely on actual llama.cpp load as the authority.
    final kv = knownKv ?? context * 128 * 1024;
    // llama.cpp mmaps model weights. Estimate resident working pages rather than
    // pretending the whole GGUF is committed Dart/native heap at once.
    final residentWeights = (weightBytes * (phone ? .55 : .70)).ceil();
    final workspace = phone ? 320 * _mib : 512 * _mib;
    final bytes = residentWeights + (kv * 1.10).ceil() + workspace;
    final plan = LocalExecutionPlan(
      contextTokens: context,
      estimatedBytes: bytes,
      estimatedKvBytes: kv,
      geometryKnown: knownKv != null,
      memoryWarning: lowMemory || (budget != null && bytes > budget),
      budgetBytes: budget,
    );
    smallest = plan;
    if (!plan.memoryWarning) return plan;
  }

  if (smallest != null) return smallest;
  throw StateError(
    'This model exposes less than a 512-token context and cannot be used safely.',
  );
}'''
