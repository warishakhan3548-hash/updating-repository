name: Build verified release APK once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-release-apk-once.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Use test signing for release variant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          old = "buildTypes { release { minifyEnabled false; debuggable false } }"
          new = "buildTypes { release { minifyEnabled false; debuggable false; signingConfig signingConfigs.debug } }"
          if old not in s:
              raise SystemExit("Expected release buildTypes block not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Collect APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/app-release.apk release-apk/Aaris-release.apk
          sha256sum release-apk/Aaris-release.apk
          ls -lh release-apk/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aaris-verified-release-apk
          path: release-apk/Aaris-release.apk
          if-no-files-found: error
          retention-days: 7
