name: Build release APK once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-release-apk-once.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/*.apk release-apk/
          ls -lh release-apk/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aaris-release-apk
          path: release-apk/*.apk
          if-no-files-found: error
          retention-days: 7
