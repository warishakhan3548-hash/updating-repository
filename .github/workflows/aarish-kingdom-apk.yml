name: Aarish Kingdom APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aarish-kingdom-apk.yml'
      - 'lib/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'tool/final_voice_architecture_patch.py'

permissions:
  contents: write

concurrency:
  group: aarish-kingdom-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic final voice architecture hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/final_voice_architecture_patch.py
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android wrapper without replacing project files
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_ROOT="$(dirname "$(dirname "$FLUTTER_BIN")")"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_SDK_ROOT" > android/local.properties

          if [[ ! -f android/gradlew || ! -f android/gradle/wrapper/gradle-wrapper.jar ]]; then
            (
              cd android
              gradle wrapper --gradle-version 9.3.1 --distribution-type bin
            )
          fi
          chmod +x android/gradlew
          ./android/gradlew --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Test voice parser and turn arbitration
        run: flutter test test/voice_turn_binding_test.dart

      - name: Test N-best voice candidate fusion
        run: flutter test test/voice_candidate_fusion_test.dart

      - name: Test Android voice/build contracts
        run: flutter test test/android_build_contract_test.dart

      - name: Test core game logic
        run: flutter test test/core_logic_test.dart

      - name: Test crash resilience
        run: flutter test test/crash_resilience_test.dart

      - name: Test Ludo engine invariants
        run: flutter test test/ludo_engine_invariants_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Persist validated architecture source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            android/app/src/main/kotlin/com/aaris/voiceludomasti/MainActivity.kt \
            lib/game/ludo_engine.dart \
            lib/services/voice_dice_controller.dart \
            test/voice_candidate_fusion_test.dart \
            pubspec.yaml

          if git diff --cached --quiet; then
            echo 'Validated source is already committed.'
          else
            git commit -m 'Persist final deterministic voice architecture'
            git push origin HEAD:main
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aarish-kingdom-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK as GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_SOURCE='build/app/outputs/flutter-apk/app-release.apk'
          APK_RELEASE='Aarish-Kingdom-release.apk'
          cp "$APK_SOURCE" "$APK_RELEASE"
          SHA256="$(sha256sum "$APK_RELEASE" | awk '{print $1}')"

          gh release delete aarish-kingdom-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          git push origin :refs/tags/aarish-kingdom-latest >/dev/null 2>&1 || true

          gh release create aarish-kingdom-latest \
            "$APK_RELEASE" \
            --target "$(git rev-parse HEAD)" \
            --title 'Aarish Kingdom — Latest APK' \
            --notes "Validated automated release build. SHA-256: ${SHA256}"
