name: Temporary isolated-audio compile check

on:
  push:
    branches:
      - temp-compile-isolated-audio-20260923

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate canonical content and temporary catalog
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/build_content.py
          python3 - <<'PY'
          import hashlib,json,sqlite3
          from pathlib import Path
          db=sqlite3.connect("app/src/main/assets/quran.sqlite")
          packs={}
          total_words=0
          total_bytes=0
          for s in range(1,115):
              count=db.execute(
                  "SELECT count(*) FROM word WHERE ayah_id LIKE ? AND position>0 AND id LIKE '%:W:%' AND mapping_state='SOURCE_ALIGNED'",
                  (f"Q:{s}:%",)
              ).fetchone()[0]
              size=max(64,count*64)
              key=f"{s:03d}"
              packs[key]={
                  "words":count,
                  "bytes":size,
                  "sha256":"0"*64,
                  "url":f"https://github.com/warishakhan3548-hash/updating-repository/releases/download/quran-word-audio-muallim-v1-9796e08/{key}.aqp"
              }
              total_words+=count
              total_bytes+=size
          db.close()
          manifest=json.loads(Path("app/src/main/assets/content-manifest.json").read_text())
          assert total_words==77326
          catalog={
              "schema":1,
              "delivery":"ISOLATED_WORD_SURAH_CONTAINER_V1",
              "container_magic":"AARISQW1",
              "repo_id":"zaibihassan/Quranic-Word-By-Word-Audio-Data",
              "source_revision":"9796e08caae700f44266255da320adf6e5ab4114",
              "style":"muallim",
              "audio_format":"Ogg Opus isolated word clips",
              "canonical_quran_alignment_sha256":manifest["audio_alignment_sha256"],
              "canonical_quran_audio_words":total_words,
              "surahs":114,
              "total_bytes":total_bytes,
              "release_base_url":"https://github.com/warishakhan3548-hash/updating-repository/releases/download/quran-word-audio-muallim-v1-9796e08",
              "packs":packs
          }
          Path("app/src/main/assets/quran-audio-word-catalog.json").write_text(json.dumps(catalog,indent=2)+"\n")
          PY

      - name: Run offline contract and Android Java compile
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/check.py             --android-jar "$ANDROID_HOME/platforms/android-35/android.jar"             --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2"
