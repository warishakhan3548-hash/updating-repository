name: Aaris Offline V11 Semantic Brain Upgrade
on:
  push:
    branches: [upgrade/offline-engine-v11-semantic-brain]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/offline-engine-v11-semantic-brain
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply V11 integration surgery
        run: python3 .github/scripts/apply_v11_semantic_brain.py
      - name: Remove temporary upgrade tooling
        run: rm -f .github/scripts/apply_v11_semantic_brain.py .github/workflows/aaris-offline-v11-semantic-upgrade.yml
      - name: Format intended files only
        run: >-
          dart format
          lib/domain/medicine_semantic_roles.dart
          lib/domain/medicine_resolution_v2.dart
          lib/domain/medicine_understanding.dart
          lib/domain/medicine_date_intelligence.dart
          lib/services/offline_recognition_memory_service.dart
          test/offline_semantic_brain_v11_test.dart
          test/offline_date_intelligence_v10_test.dart
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: Static checks
        run: flutter analyze --no-fatal-infos
      - name: Focused V11 regressions
        run: >-
          flutter test
          test/offline_semantic_brain_v11_test.dart
          test/offline_date_intelligence_v10_test.dart
          test/offline_level6_reasoning_test.dart
          test/offline_level5_reasoning_test.dart
          test/medicine_resolution_v2_test.dart
          test/medicine_understanding_test.dart
          test/retrieval_fusion_test.dart
      - name: Full regression suite
        run: flutter test
      - name: Android debug integration build
        run: flutter build apk --debug
      - name: Commit verified V11 patch
        run: |
          git config user.name 'Aaris Upgrade Bot'
          git config user.email 'actions@users.noreply.github.com'
          git status --short
          git add -A
          git commit -m 'Upgrade offline medicine semantic brain to V11'
          git push origin HEAD:upgrade/offline-engine-v11-semantic-brain
