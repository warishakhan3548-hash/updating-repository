name: lib_llama_cpp
description: Audited in-process llama.cpp core for Aaris, based on upstream 0.7.3.
version: 0.7.3+aaris.1
publish_to: none
repository: https://github.com/gsmlg-app/lib_llama_cpp

environment:
  sdk: ^3.11.5
  flutter: '>=3.41.0'

dependencies:
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  lib_llama_cpp_android: 0.7.3
  lib_llama_cpp_ffi: 0.7.3
  lib_llama_cpp_ios: 0.7.3
  lib_llama_cpp_linux: 0.7.3
  lib_llama_cpp_macos: 0.7.3
  lib_llama_cpp_platform_interface: 0.7.3
  lib_llama_cpp_windows: 0.7.3

flutter:
  plugin:
    platforms:
      android:
        default_package: lib_llama_cpp_android
      ios:
        default_package: lib_llama_cpp_ios
      linux:
        default_package: lib_llama_cpp_linux
      macos:
        default_package: lib_llama_cpp_macos
      windows:
        default_package: lib_llama_cpp_windows
