plugins { id 'com.android.application' }

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('keystore.properties')
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

def releaseSigningValue = { String name ->
    def fileValue = releaseSigningProperties.getProperty(name)
    if (fileValue != null && !fileValue.isEmpty()) return fileValue
    def environmentValue = System.getenv(name)
    return (environmentValue != null && !environmentValue.isEmpty()) ? environmentValue : null
}

def releaseKeystorePath = releaseSigningValue('AARIS_KEYSTORE_PATH')
def releaseStorePassword = releaseSigningValue('AARIS_KEYSTORE_PASSWORD')
def explicitReleaseKeyAlias = releaseSigningValue('AARIS_KEY_ALIAS')
def releaseKeyAlias = explicitReleaseKeyAlias ?: 'upload'
def explicitReleaseKeyPassword = releaseSigningValue('AARIS_KEY_PASSWORD')
def releaseKeyPassword = explicitReleaseKeyPassword ?: releaseStorePassword
def releaseSigningConfigured = releaseKeystorePath && releaseStorePassword
def releaseSigningTouched = releaseKeystorePath || releaseStorePassword || explicitReleaseKeyAlias ||
    explicitReleaseKeyPassword
def requireReleaseSigning = (findProperty('requireReleaseSigning')?.toString()?.toBoolean() ?: false)
def expectedReleaseCertificateSha256 = '33:0D:16:11:84:9C:7C:9B:1F:9F:59:2C:45:89:32:F2:5A:E6:F3:AB:A1:BC:7E:8A:BF:BC:9E:68:68:EF:00:4F'

if (releaseSigningTouched && !releaseSigningConfigured) {
    throw new GradleException(
        'Incomplete release signing configuration. Provide AARIS_KEYSTORE_PATH and AARIS_KEYSTORE_PASSWORD; ' +
        'AARIS_KEY_ALIAS defaults to upload and AARIS_KEY_PASSWORD defaults to the store password.'
    )
}

android {
    namespace 'com.aaris.quran'
    compileSdk 35
    defaultConfig {
        applicationId 'com.aaris.quran'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile rootProject.file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
    lint {
        abortOnError true
        checkDependencies true
        htmlReport true
        textReport true
        // The preview supports Hindi, Urdu and English; copy is currently authored in code.
        disable 'SetTextI18n'
    }
}
dependencies { implementation project(':core') }

def verifyReleaseSigningIdentity = tasks.register('verifyReleaseSigningIdentity') {
    group = 'verification'
    description = 'Verifies that release signing uses the permanent Aaris upload certificate.'
    onlyIf { releaseSigningConfigured }
    doLast {
        def keystoreFile = rootProject.file(releaseKeystorePath)
        if (!keystoreFile.isFile()) {
            throw new GradleException("Release keystore does not exist: ${keystoreFile}")
        }

        def keyStore = java.security.KeyStore.getInstance('JKS')
        keystoreFile.withInputStream { input ->
            keyStore.load(input, releaseStorePassword.toCharArray())
        }
        def certificate = keyStore.getCertificate(releaseKeyAlias)
        if (certificate == null) {
            throw new GradleException("Release signing alias '${releaseKeyAlias}' was not found in the keystore.")
        }

        def actualFingerprint = java.security.MessageDigest.getInstance('SHA-256')
            .digest(certificate.encoded)
            .collect { String.format('%02X', (((int) it) & 0xFF)) }
            .join(':')
        if (actualFingerprint != expectedReleaseCertificateSha256) {
            throw new GradleException(
                "Wrong release signing certificate. Expected ${expectedReleaseCertificateSha256}, got ${actualFingerprint}."
            )
        }
        logger.lifecycle("Verified permanent release certificate SHA-256: ${actualFingerprint}")
    }
}

tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach {
    if (releaseSigningConfigured) {
        dependsOn verifyReleaseSigningIdentity
    }
    doFirst {
        if (requireReleaseSigning && !releaseSigningConfigured) {
            throw new GradleException(
                'A signed release was required but release signing is not configured. ' +
                'Use private keystore.properties or AARIS_KEYSTORE_* environment variables.'
            )
        }
    }
}

// Guard the architectural invariant before any content work. Quran/Hadith/search stay local-only;
// runtime network access is confined to explicit user-requested Quran audio downloads.
def offlineContract = tasks.register('checkOfflineContract', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/check_offline_contract.py'
    inputs.file rootProject.file('tools/check_offline_contract.py')
    inputs.file rootProject.file('app/src/main/AndroidManifest.xml')
    inputs.file rootProject.file('source-vault/quran-audio/on-demand-source-lock.json')
    inputs.dir rootProject.file('app/src/main/java')
    inputs.file file('build.gradle')
    outputs.upToDateWhen { false }
}
tasks.named('preBuild').configure { dependsOn offlineContract }

// A fresh checkout must contain the same verified offline pack before resource analysis.
def contentPack = tasks.register('prepareContentPack', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/build_content.py'
    inputs.dir rootProject.file('source-vault/translations')
    inputs.file rootProject.file('tools/build_translations.py')
    inputs.dir rootProject.file('source-vault/tanzil')
    inputs.dir rootProject.file('source-vault/data-quran')
    inputs.files rootProject.file('tools/build_content.py'), rootProject.file('tools/source-lock.json')
    outputs.files file('src/main/assets/quran.sqlite'), file('src/main/assets/content-manifest.json'), file('src/main/assets/translations.sqlite'), file('src/main/assets/translations-manifest.json')
}
tasks.named('preBuild').configure { dependsOn contentPack }

// Quran recitation audio is deliberately NOT an APK asset. It is downloaded later, only on
// explicit user action, one Surah at a time (or Download All), then kept in app-private storage.
// Fail a developer build if the old monolithic vendored payload is present so it cannot silently
// bloat the release APK again.
def rejectBundledQuranAudio = tasks.register('rejectBundledQuranAudio') {
    doLast {
        def legacy = rootProject.file('source-vault/quran-audio/active/quran-audio')
        def accidentalAsset = file('src/main/assets/quran-audio')
        def binaryAudioAssets = fileTree('src/main/assets') {
            include '**/*.aqp', '**/*.opus', '**/*.pb', '**/*.pack'
        }
        if (legacy.exists() || accidentalAsset.exists() || !binaryAudioAssets.files.isEmpty()) {
            throw new GradleException('Bundled Quran audio detected. Only the tiny catalog JSON may be packaged; pronunciation containers stay on-demand.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn rejectBundledQuranAudio }


// Hadith is a separate immutable pack. Prefer an explicitly prepared active pack; otherwise
// deterministically derive the bundled Arabic nine-book pack from the vendored ODbL source.
def activeHadithSource = rootProject.file('source-vault/hadith/active')
def vendoredHadithSource = rootProject.file('source-vault/hadith/open-hadith-data')
def generatedHadithSource = file("$buildDir/generated/hadith-source")

def prepareVendoredHadithSource = tasks.register('prepareVendoredHadithSource') {
    inputs.files rootProject.file('tools/prepare_open_hadith_data.py'),
        rootProject.file('tools/hadeethenc_source.py'),
        rootProject.file('tools/hadeethenc_xlsx.py'),
        rootProject.file('tools/hadith-catalog.json')
    inputs.files rootProject.fileTree(activeHadithSource)
    inputs.dir vendoredHadithSource
    inputs.dir rootProject.file('source-vault/hadith/hadeethenc')
    outputs.dir generatedHadithSource
    doLast {
        if (new File(activeHadithSource, 'manifest.json').exists()) {
            // Keep the fallback output deterministic. If the explicit pack is later removed,
            // the active-source input change forces this task to rebuild instead of exposing a
            // stale generated directory from an older vendored snapshot.
            delete generatedHadithSource
            generatedHadithSource.mkdirs()
            logger.lifecycle('Using explicit source-vault/hadith/active pack; vendored fallback preparation skipped.')
            return
        }
        if (!new File(vendoredHadithSource, 'SOURCE.json').exists()) {
            delete generatedHadithSource
            generatedHadithSource.mkdirs()
            logger.lifecycle('No explicit or vendored Hadith source pack is available.')
            return
        }
        exec {
            workingDir rootProject.projectDir
            commandLine 'python3', 'tools/prepare_open_hadith_data.py',
                '--source', vendoredHadithSource.absolutePath,
                '--output', generatedHadithSource.absolutePath
        }
    }
}

def hadithPack = tasks.register('prepareHadithPack') {
    dependsOn prepareVendoredHadithSource
    inputs.file rootProject.file('tools/build_hadith.py')
    inputs.file rootProject.file('tools/hadith-catalog.json')
    // Empty-safe: explicit active pack is optional; vendored fallback is generated when absent.
    inputs.files rootProject.fileTree(activeHadithSource)
    inputs.dir generatedHadithSource
    outputs.files file('src/main/assets/hadith.sqlite'), file('src/main/assets/hadith-manifest.json')
    doLast {
        def explicitManifest = new File(activeHadithSource, 'manifest.json')
        def generatedManifest = new File(generatedHadithSource, 'manifest.json')
        def selectedSource = explicitManifest.exists() ? activeHadithSource :
            (generatedManifest.exists() ? generatedHadithSource : null)
        def sqlite = file('src/main/assets/hadith.sqlite')
        def assetManifest = file('src/main/assets/hadith-manifest.json')
        if (selectedSource == null) {
            delete sqlite, assetManifest
            logger.lifecycle('No verified Hadith source pack installed; building Quran-only APK.')
            return
        }
        exec {
            workingDir rootProject.projectDir
            commandLine 'python3', 'tools/build_hadith.py',
                '--source', selectedSource.absolutePath,
                '--output', sqlite.absolutePath
        }
    }
}
tasks.named('preBuild').configure { dependsOn hadithPack }
