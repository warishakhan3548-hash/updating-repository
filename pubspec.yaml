name: aaris_pharmacy
description: Aaris Pharmacy — local inventory, expiry intelligence and reviewed AI management.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: 2.4.3
  camera: 0.12.1
  camera_android: 0.10.11+1
  google_mlkit_text_recognition: 0.17.1
  google_mlkit_barcode_scanning: 0.16.1
  speech_to_text: 7.4.0
  flutter_secure_storage: 11.0.0
  share_plus: 13.3.0
  http: 1.6.0
  path_provider: 2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: 2.4.2+1

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
