workflows:
  aaris-remote-release-apk:
    name: Aaris Remote - Release APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      android_signing:
        - aarish_upload_keystore
      vars:
        PACKAGE_NAME: "com.aaris.remoteassist"
        GRADLE_VERSION: "9.6.0"
    scripts:
      - name: Validate native Android project
        script: |
          set -euo pipefail
          test -f "$CM_BUILD_DIR/settings.gradle.kts"
          test -f "$CM_BUILD_DIR/app/build.gradle.kts"
      - name: Set Android SDK location
        script: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Validate release signing
        script: |
          set -euo pipefail
          test -n "${CM_KEYSTORE_PATH:-}"
          test -f "$CM_KEYSTORE_PATH"
          test -n "${CM_KEYSTORE_PASSWORD:-}"
          test -n "${CM_KEY_ALIAS:-}"
          test -n "${CM_KEY_PASSWORD:-}"
          test "$CM_KEY_ALIAS" = "upload"
      - name: Build signed release APK
        script: |
          set -euo pipefail
          GRADLE_HOME="/tmp/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            curl -fsSL "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
          fi
          "$GRADLE_HOME/bin/gradle" :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace
      - name: Verify signed APK
        script: |
          set -euo pipefail
          APK="$(find "$CM_BUILD_DIR/app/build/outputs/apk/release" -type f -name '*.apk' ! -name '*unsigned*' | head -1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | head -1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | head -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$PACKAGE_LINE" | grep -F "package: name='$PACKAGE_NAME'" >/dev/null
          VERSION_NAME="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          FINAL_APK="$CM_BUILD_DIR/app/build/outputs/apk/release/AarisRemote-$VERSION_NAME-release.apk"
          if [ "$APK" != "$FINAL_APK" ]; then mv "$APK" "$FINAL_APK"; fi
          shasum -a 256 "$FINAL_APK"
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/reports/lint-results-release.*
